<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Permaculture: a farm game where the crops are the things you are learning.">
<!-- What a chat app shows for a farm link. Every link shows the same preview: the part after the # is never sent. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Permaculture">
<meta property="og:description" content="A farm game where the crops are the things you are learning. Open a friend's farm, look around, and start your own next door.">
<meta property="og:image" content="https://yozo06.github.io/permaculture/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Permaculture</title>
<link rel="icon" href="data:,">
</head>
<body>

<div class="game">
  <header class="hud" aria-label="Farm status">
    <div class="logo">PERMACULTURE</div>
    <div class="stat"><span class="k">Day</span><span class="v" id="hDay">12</span></div>
    <div class="stat"><span class="k">Energy</span><div class="meter" aria-hidden="true"><i id="hEnergy"></i></div><span class="v" id="hEnergyT">90</span></div>
    <div class="stat"><span class="k">Coins</span><span class="v" id="hCoins">140</span></div>
    <div class="stat"><span class="k">Rain barrel</span><span class="v" id="hBarrel">2</span></div>
    <span class="save-warn" id="hSave" role="status" hidden>Not saved — export to keep</span>
  </header>

  <div class="stage">
    <canvas id="c" width="480" height="300" aria-label="Isometric farm. Drag to look around. Tap crops to water or harvest them."></canvas>
    <div class="visit" id="visit" role="status" hidden><span id="visitWho"><b id="visitName"></b><small id="visitDetail"></small></span><button type="button" id="bBack">Back to my farm</button></div>
    <div class="corner"><button type="button" id="bHome">Centre</button></div>
    <div class="night" id="night"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <footer class="bar">
    <div class="hint" id="hint"><b>Drag</b> to look around. Tap a crop with a <b>droplet</b> to water it, <b>sparkles</b> to harvest. Tap the forest to forage. Tap land beside a field to fence it in. Tap the <b>gate</b> to meet your neighbours.</div>
    <div class="acts">
      <button type="button" id="bAlm">Almanac</button>
      <button type="button" id="bTree">Learning tree</button>
      <button type="button" id="bBag">Seed bag</button>
      <button type="button" id="bSleep" class="pri">Sleep</button>
    </div>
  </footer>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
