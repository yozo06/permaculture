sources:
  - id: sre-incidents
    title: Site Reliability Engineering, chapter Managing Incidents
    url: https://sre.google/sre-book/managing-incidents/
    note: Roles, when to declare, clear live handoff, live incident document, best practices.
  - id: sre-postmortem
    title: The Site Reliability Workbook, chapter Postmortem Culture
    url: https://sre.google/workbook/postmortem-culture/
    note: Bad versus good example postmortem, blameless language, action items, organizational incentives, sharing and review.
  - id: sre-oncall
    title: Site Reliability Engineering, chapter Being On-Call
    url: https://sre.google/sre-book/being-on-call/
    note: Caps on on-call time and incidents per shift, team-size arithmetic, burnout, clear escalation paths.
  - id: sre-error-budget
    title: The Site Reliability Workbook, Appendix B Example Error Budget Policy
    url: https://sre.google/workbook/error-budget-policy/
    note: An example policy with thresholds, exceptions and escalation.
  - id: pagerduty
    title: PagerDuty Incident Response documentation, Incident Commander training
    url: https://response.pagerduty.com/training/incident_commander/
    note: Purpose of the commander, the size-up, stabilize, update, verify loop, assigning time-boxed tasks, polling for strong objections, transfer of command, treating unclear severity as the higher one. Open source docs.
  - id: allspaw
    title: Blameless PostMortems and a Just Culture (John Allspaw, Etsy Code as Craft)
    url: https://www.etsy.com/codeascraft/blameless-postmortems/
    note: Etsy blocks scripted fetches (403), so the text was confirmed in the Wayback Machine copy of this page; it is live in a normal browser. Covers just culture, hindsight bias, accountability without blame, and first versus second stories.
  - id: bergstrom-traps
    title: Understanding Incidents, Three Analytical Traps (Johan Bergstrom, on Adaptive Capacity Labs)
    url: https://www.adaptivecapacitylabs.com/2021/01/11/understanding-incidents-three-analytical-traps/
    note: Counterfactual reasoning, normative language and mechanistic reasoning, with transcript of a short lecture.
  - id: nygard-adr
    title: Documenting Architecture Decisions (Michael Nygard)
    url: https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions
    note: The original ADR post. Title, status, context, decision, consequences; numbered records kept in the repo; superseded rather than deleted.
  - id: edmondson
    title: How Fearless Organizations Succeed (Amy Edmondson, strategy+business)
    url: https://www.strategy-business.com/article/How-Fearless-Organizations-Succeed
    note: Edmondson's own summary of her definition, what psychological safety is not, and the leader behaviours that build it. The formal definition comes from her 1999 paper Psychological Safety and Learning Behavior in Work Teams (Administrative Science Quarterly, doi 10.2307/2666999).
  - id: rework-interviewing
    title: A guide to structured interviewing (Google re:Work)
    url: https://rework.withgoogle.com/intl/en/guides/a-guide-to-structured-interviewing-for-better-hiring-practices
    note: Sections on defining hiring attributes, drafting questions, behavioral versus hypothetical questions, and using a rubric.
  - id: star-method
    title: Using the STAR method for your next behavioral interview (MIT Career Advising and Professional Development)
    url: https://capd.mit.edu/resources/the-star-method-for-behavioral-interviews/
    note: Situation, Task, Action, Result with a suggested time split, I versus we, quantified results and takeaways.
  - id: staffeng
    title: StaffEng (Will Larson), Work on what matters
    url: https://staffeng.com/guides/work-on-what-matters/
    note: Snacking, preening, chasing ghosts, existential issues, editing and finishing things.
  - id: staffeng-strategy
    title: StaffEng (Will Larson), Writing engineering strategy
    url: https://staffeng.com/guides/engineering-strategy/
    note: When to write a strategy, writing design documents first, diagnosis and guiding policies, being specific and opinionated, how to tell it works.
  - id: staffeng-exec
    title: StaffEng (Will Larson), Present to executives
    url: https://staffeng.com/guides/present-to-executives/
    note: Lead with the summarizing idea, the SCQA opening paragraph, aligning with stakeholders before the meeting, never presenting a problem without an answer.
  - id: eng-practices
    title: Google Engineering Practices, How to write code review comments
    url: https://google.github.io/eng-practices/review/reviewer/comments.html
    note: Comment on the code, explain why, label severity, point out problems versus give directions, praise.
  - id: sbi
    title: Situation-Behavior-Impact (Untools)
    url: https://untools.co/situation-behavior-impact/
    note: SBI is a Center for Creative Leadership tool. The page also covers the optional intent question.
  - id: amazon-2016
    title: Amazon 2016 letter to shareholders (High-Velocity Decision Making)
    url: https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders
    note: Two-way doors and light-weight process, deciding with about 70 percent of the information, disagree and commit.
  - id: shapeup
    title: Shape Up, Set Boundaries (Basecamp)
    url: https://basecamp.com/shapeup/1.2-chapter-03
    note: Appetite versus estimate, fixed time with variable scope, and the soft no for raw ideas.
  - id: larson-saying-no
    title: Saying no (Will Larson, Irrational Exuberance)
    url: https://lethain.com/saying-no/
    note: Explaining team constraints with data (velocity), then priorities - document asks, set guiding principles, test new asks against them.
  - id: larson-migrations
    title: Migrations, the sole scalable fix to tech debt (Will Larson, Irrational Exuberance)
    url: https://lethain.com/migrations/
    note: The derisk, enable, finish playbook; start with the hardest adopters; tooling over tickets; shutting down the legacy system.
  - id: hogan-delegation
    title: Delegation is an art, not a science (Lara Hogan)
    url: https://larahogan.me/blog/delegation-is-an-art/
    note: Delegate the outcome without the how; at most three pro tips; how you will support, when to reach out, what success looks like.
  - id: outcomes-vs-outputs
    title: Outcomes vs. Outputs, What's the Difference and Why Does It Matter? (Teresa Torres, Product Talk)
    url: https://www.producttalk.org/2024/07/outcomes-vs-outputs/
    note: An output is what you ship; an outcome is the change it causes. Output teams are done at shipping, outcome teams when the impact shows up.
  - id: design-docs-google
    title: Design Docs at Google (Malte Ubl)
    url: https://www.industrialempathy.com/posts/design-docs-at-google/
    note: Anatomy of a design doc, goals and non-goals, alternatives considered, length, and when not to write one.
  - id: cone-of-uncertainty
    title: The Cone of Uncertainty (Construx, Steve McConnell)
    url: https://www.construx.com/resources/the-cone-of-uncertainty/
    note: Why early estimates span a wide range, how decisions narrow it, and why commitments should wait.
  - id: atlassian-comm
    title: Incident communication best practices (Atlassian)
    url: https://www.atlassian.com/incident-management/incident-communication
    note: Audiences, update cadence (never more than an hour without one), first contact, regular updates even when there is nothing new.
