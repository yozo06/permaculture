  - id: hash-flooding
    near: [hash-sets-maps, hash-table-internals]
    text: "Hash flooding is a real attack: crafted keys that all collide turn each hash-map operation into a linear scan. That is why Python and Rust randomise the seed of their default string hash."
  - id: binary-search-overflow-bug
    near: [binary-search, edge-case-testing]
    text: "The (lo + hi) / 2 overflow sat unnoticed in widely used binary search and merge sort code for years. Joshua Bloch wrote it up in 2006 after finding it in the Java standard library."
  - id: dijkstra-lazy-deletion
    near: [dijkstra, binary-heap]
    text: "Much real-world Dijkstra code has no decrease-key. It pushes a fresh heap entry on each improvement and skips stale entries when they pop, which keeps O(E log V) with a plain binary heap."
  - id: inverse-ackermann
    near: [union-find]
    text: "Union-find's cost per operation is the inverse Ackermann function, which stays below 5 for any input that could ever be stored. It is effectively constant, yet provably not exactly constant."
