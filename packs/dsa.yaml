# DSA patterns — Permaculture pack (v0)
# Format: docs/pack-format.md · Licence: CC-BY-SA 4.0 (packs/LICENSE.md)
pack: dsa
version: 0
title: DSA patterns
color: "#E58A5C"
description: >-
  Data structures and algorithm patterns for interviews and real code, from complexity to graphs and dynamic
  programming.
perennial: false
branches:
  - id: linear-and-search
    title: Arrays, search & linear structures
  - id: graphs-and-dp
    title: Trees, graphs & dynamic programming
sources:
  - id: clrs
    title: Introduction to Algorithms (Cormen, Leiserson, Rivest, Stein), 4th edition
    url: https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
    note: The reference text. Chapter numbers in summaries follow the 4th edition's table of contents; sections are cited by name.
  - id: algs4
    title: Algorithms, 4th edition (Sedgewick and Wayne) and its booksite
    url: https://algs4.cs.princeton.edu/home/
    note: Free booksite with code (BST.java, Parentheses.java, TopM and more), excerpts and lectures. Section numbers match the booksite sidebar.
  - id: erickson
    title: Algorithms (Jeff Erickson), free book
    url: https://jeffe.cs.illinois.edu/teaching/algorithms/
    note: Clear on recursion, backtracking, dynamic programming, greedy proofs and graph search. Chapters 1 Recursion, 2 Backtracking, 3 Dynamic Programming, 4 Greedy Algorithms, 5 Basic Graph Algorithms, 6 Depth-First Search, 8 Shortest Paths.
  - id: cph
    title: Competitive Programmer's Handbook (Antti Laaksonen)
    url: https://cses.fi/book/book.pdf
    note: A compact free book. Chapter and section numbers in summaries follow the PDF's table of contents.
  - id: mit6006
    title: MIT 6.006 Introduction to Algorithms (OCW, Spring 2020)
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/pages/lecture-notes/
    note: Lecture notes and videos. Lecture numbers in summaries follow this lecture-notes page.
  - id: mit6172
    title: MIT 6.172 Performance Engineering of Software Systems (OCW, Fall 2018), lecture videos
    url: https://ocw.mit.edu/courses/6-172-performance-engineering-of-software-systems-fall-2018/video_galleries/lecture-videos/
    note: Lecture 14 covers caching and cache-efficient algorithms; lecture 15 cache-oblivious algorithms.
  - id: drepper-memory
    title: What Every Programmer Should Know About Memory (Ulrich Drepper)
    url: https://people.freebsd.org/~lstewart/articles/cpumemory.pdf
    note: Free paper. Section 3.2 cache operation, 3.3.2 measured cache effects, 6.2.1 optimising L1 data cache access, 6.3.1 hardware prefetching.
  - id: cses
    title: CSES Problem Set
    url: https://cses.fi/problemset/
    note: Graded practice problems for the patterns in this pack.
  - id: pytc
    title: Python docs, Time complexity of operations on built-in types
    url: https://docs.python.org/3/builtins/time-complexity.html
    note: Costs of list, dict, set and str operations in CPython, including the notes on worst cases and string concatenation. It replaces the old wiki.python.org TimeComplexity page.
  - id: heapq
    title: Python docs, heapq (heap queue algorithm)
    url: https://docs.python.org/3/library/heapq.html
    note: Its Theory section gives the 0-indexed heap layout.
  - id: py-bisect
    title: Python docs, bisect (array bisection algorithm)
    url: https://docs.python.org/3/library/bisect.html
    note: bisect_left states the lower-bound invariant on a half-open range.
  - id: py-recursion-limit
    title: Python docs, sys.setrecursionlimit
    url: https://docs.python.org/3/library/sys.html#sys.setrecursionlimit
    note: Why an interpreter caps recursion depth.
  - id: go-slicetricks
    title: Go wiki, SliceTricks
    url: https://go.dev/wiki/SliceTricks
    note: Short recipes, including 'Filtering without allocating' and 'In-place deduplicate' with a read index and a write index.
  - id: bloch-binary-search
    title: "Joshua Bloch, Extra, Extra - Read All About It: Nearly All Binary Searches and Mergesorts are Broken (2006)"
    url: https://research.google/blog/extra-extra-read-all-about-it-nearly-all-binary-searches-and-mergesorts-are-broken/
    note: The (low + high) / 2 overflow bug found in the Java standard library.
  - id: humble-programmer
    title: Edsger W. Dijkstra, The Humble Programmer (EWD340, 1972 Turing Award lecture)
    url: https://www.cs.utexas.edu/~EWD/transcriptions/EWD03xx/EWD340.html
    note: Contains the argument that testing shows the presence of bugs, never their absence.
  - id: wiki-call-stack
    title: Wikipedia, Call stack
    url: https://en.wikipedia.org/wiki/Call_stack
    note: What a stack frame holds and how calls push and pop frames.
  - id: wiki-deque
    title: Wikipedia, Double-ended queue
    url: https://en.wikipedia.org/wiki/Double-ended_queue
    note: Implementations of a deque with a doubly linked list or a circular or offset array.
  - id: wiki-topological-sorting
    title: Wikipedia, Topological sorting
    url: https://en.wikipedia.org/wiki/Topological_sorting
    note: Kahn's algorithm with its cycle test, and the depth-first version.
  - id: wiki-lis
    title: Wikipedia, Longest increasing subsequence
    url: https://en.wikipedia.org/wiki/Longest_increasing_subsequence
    note: The 'Efficient algorithms' section describes the O(n log n) method with an array of smallest tails and binary search.
  - id: wiki-held-karp
    title: Wikipedia, Held-Karp algorithm
    url: https://en.wikipedia.org/wiki/Held%E2%80%93Karp_algorithm
    note: The subset dynamic program for the travelling salesman problem and its O(2^n n^2) cost.
  - id: wiki-boundary-value
    title: Wikipedia, Boundary-value analysis
    url: https://en.wikipedia.org/wiki/Boundary-value_analysis
    note: Why test inputs should sit on and next to the edges of a range.
  - id: wiki-loop-variant
    title: Wikipedia, Loop variant
    url: https://en.wikipedia.org/wiki/Loop_variant
    note: A bounded quantity that strictly decreases each pass is what proves a loop terminates.
  - id: kt-greedy
    title: Kleinberg and Tardos, Algorithm Design, slides 'Greedy Algorithms I' (Kevin Wayne)
    url: https://www.cs.princeton.edu/~wayne/kleinberg-tardos/pdf/04GreedyAlgorithmsI.pdf
    note: Interval scheduling (rules that fail, earliest finish) and interval partitioning (sort by start, priority queue of finish times, the depth bound).
  - id: algorithms-illuminated
    title: Algorithms Illuminated Part 2 (Tim Roughgarden), chapter 12 on hash tables
    url: https://www.algorithmsilluminated.org/
    note: Section 12.2 applies a hash table to the 2-SUM problem.
  - id: cp-deleting-dsu
    title: cp-algorithms, Deleting from a data structure in O(T(n) log n)
    url: https://cp-algorithms.com/data_structures/deleting_in_log_n.html
    note: Offline deletion by divide and conquer over time, with a union-find that supports rollbacks.
