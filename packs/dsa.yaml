    sources: [cph, cses]
    summary: >-
      Read CPH section 8.2 (nearest smaller elements: a stack that pops on arrival) and 8.3 (sliding window
      minimum: the same idea as a queue); next greater is the mirror image of nearest smaller. Notes: a stack that
      keeps its values in sorted order by popping on arrival, the 'next greater element' template, the monotonic
      deque for window maximum, and the amortised argument. Yield: next-greater and largest-rectangle templates.
    rubric:
      - "States what order the stack is kept in and what is popped on arrival"
      - "Explains that a popped item has just found its answer"
      - "Argues O(n) because each item is pushed and popped once"
      - "Names a window-maximum use of the monotonic deque"
    prompts:
      - "Explain how you would solve this: for each day in a list of temperatures, find how many days until a warmer one. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: find the largest rectangle that fits under a skyline of bar heights. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "You find the next greater element for each index with a stack that keeps values decreasing. When a new value x arrives, you…"
          answer: "Pop every smaller value; x is the answer for each value popped"
          distractors:
            - "Pop only the top value, then push x on top of the stack"
            - "Push x first, then sort the whole stack in place again"
            - "Pop every value that is larger than x, and x becomes the answer for each of them"
          why: "Anything smaller than x that is still waiting has just found its next greater element, which is x. What remains on the stack is still waiting. Popping larger values would break the decreasing order."
          source: cph
        - q: "A monotonic-stack solution over n items has pops inside a loop. Why is it O(n)?"
          answer: "Each item is pushed once and popped at most once"
          distractors:
            - "The pops stop at the first small value they meet, so few happen"
            - "The stack never holds more than log n items"
            - "Pops cost nothing, so only pushes count"
          why: "Total pops can never exceed total pushes, and there are n pushes. A single iteration may pop many items, but that work is paid for by the earlier iterations that pushed them."
          source: cph
