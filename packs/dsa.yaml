      - "Explain how you would solve this: count the ways to climb n stairs taking one, two or three steps at a time. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "A problem is a good fit for dynamic programming when it has…"
          answer: "Overlapping subproblems, and optimal answers built from optimal sub-answers"
          distractors:
            - "Sorted input that can be split in half again and again"
            - "Exactly one correct solution, which the search must find"
            - "A recursion that goes deeper than 1,000 levels and overflows the stack without a cache"
          why: "Overlap means a cache pays off, and optimal substructure means combining sub-answers is valid. Without overlap, plain divide and conquer is enough. Depth and sortedness are not the test."
          source: clrs
        - q: "House robber has best[i] = max(best[i-1], best[i-2] + a[i]). To use O(1) extra space you…"
          answer: "Keep only the last two values and roll them forward"
          distractors:
            - "Keep the whole table in memory and index into it each time"
            - "Recompute earlier values from scratch each step"
            - "Switch to recursion with no cache"
          why: "Each cell reads only the two cells before it, so nothing older is ever needed again. Recomputing, or recursing without a cache, would bring back exponential time."
          source: erickson
