    questions:
      water:
        - q: "An exchange argument shows a greedy choice is safe by proving that…"
          answer: "Any optimal solution can be changed to include the greedy choice and stay as good"
          distractors:
            - "The choice looks best at each step in isolation, so the total must be best"
            - "The greedy solution is the only optimal solution for the problem"
            - "No counterexample appears when the rule is tried on small test cases"
          why: "If swapping the greedy choice into an optimal solution leaves it feasible and at least as good, then some optimal solution starts with the greedy choice. Repeating this on what remains proves the whole algorithm."
          source: erickson
        - q: "For choosing the most non-overlapping activities, which greedy rule is correct?"
          answer: "Always take the compatible activity that finishes earliest"
          distractors:
            - "Always take the compatible activity that starts the earliest"
            - "Always take the shortest remaining activity that still fits"
            - "Always take the one that overlaps the fewest other activities"
          why: "Finishing earliest leaves the most room for what follows, and an exchange swaps any optimal first pick for it. The other rules fail on counterexamples; for instance, earliest-start can pick one long activity that blocks many short ones."
          source: kt-greedy
  - id: topo-sort
    name: Topological sort
    layer: understory
