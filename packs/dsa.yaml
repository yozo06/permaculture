      it in linear time, and using it to scan a text without ever moving back.
    rubric:
      - "Defines the prefix function and computes it for a short string"
      - "Explains the fallback after a mismatch using the table"
      - "Argues O(n + m) total because the text pointer never moves back"
      - "Contrasts it with the naive restart, which can cost O(nm)"
    prompts:
      - "Explain how you would solve this: find every position where a pattern of length m occurs in a text of length n in O(n + m) time. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "The prefix function value at position i of a string is…"
          answer: "The length of the longest proper prefix of s[0..i] that is also its suffix"
          distractors:
            - "The count of earlier positions in the string that hold the very same character"
            - "The length of the longest palindrome that ends at position i"
            - "The index at which the pattern last matched part of the text"
          why: "This overlap tells you how much of the current match you can keep after a mismatch. For 'abab' it is 2: the prefix 'ab' is also the suffix. 'Proper' means the prefix cannot be the whole string."
          source: clrs
        - q: "After a mismatch, KMP resumes matching by…"
          answer: "Falling back inside the pattern using the table, never moving back in the text"
          distractors:
            - "Restarting the pattern one character further along in the text, then re-comparing"
            - "Re-reading the last m characters of the text before comparing again"
            - "Jumping ahead in the text by the whole length of the pattern"
          why: "The table says which shorter prefix of the pattern is still consistent with the text already read, so no text character is examined twice. That gives O(n + m) in total, against O(nm) for the naive restart."
          source: clrs
