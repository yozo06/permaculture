    rubric:
      - "Lists the standard edge inputs for arrays, strings and graphs"
      - "Explains what each edge input is likely to break"
      - "Describes cross-checking against a slow brute-force version"
      - "Notes integer overflow and sizes at the limit"
    prompts:
      - "List the eight inputs you would run through a function that returns the length of the longest strictly increasing run in an array, and say what bug each one is meant to expose."
    questions:
      water:
        - q: "Which set of inputs is most likely to expose off-by-one errors in a binary search or window routine?"
          answer: "Empty, one-item and two-item arrays, with the target at either end or absent"
          distractors:
            - "Several very large arrays filled with random values chosen uniformly"
            - "A sorted array of a thousand distinct values, searching for one in the middle"
            - "Arrays that contain only positive numbers, to keep the sums simple"
          why: "Off-by-one bugs live at the boundaries, where a range has zero or one element or an index meets the end. Large random input rarely lands on those exact shapes."
          source: wiki-boundary-value
        - q: "A prefix-sum array over 200,000 values, each up to 10^9, is held in 32-bit integers. What goes wrong?"
          answer: "Sums can reach about 2 × 10^14, so the prefix values overflow 32 bits"
          distractors:
            - "Nothing goes wrong, since every single value on its own fits in 32 bits"
            - "Only the final sum overflows, not the prefixes"
            - "Only sorted input can make the total overflow"
          why: "Each element fits, but running totals do not; 32-bit integers stop near 2.1 × 10^9. The prefix entries themselves overflow, long before the last one, so use 64-bit sums."
          source: cph
  - id: backtracking
    name: Backtracking
    layer: understory
    branch: graphs-and-dp
    tier: 2
    needs: [recursion, call-stack]
    harvest: judged
    minutes: 45
    sources: [erickson, cph, cses]
    summary: >-
      Read CPH ch. 5 (Complete search: generating subsets and permutations, backtracking, pruning the search) and
      Erickson ch. 2 (Backtracking: N Queens, Subset Sum, The General Pattern). Notes: choose, explore, un-choose;
      the decision tree; pruning on partial results; subsets, permutations and N-queens as the three templates;
      and the exponential cost that pruning only reduces.
    rubric:
      - "Describes the choose, explore, undo loop and the state it maintains"
      - "Draws the decision tree for subsets or permutations and counts its leaves"
      - "Explains how pruning cuts branches that cannot succeed"
      - "States the worst-case cost and why it stays exponential"
    prompts:
      - "Explain how you would solve this: list every way to split a string into pieces that are all palindromes. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: place n queens on an n by n board so that none attack each other. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Backtracking differs from plain enumeration of all candidates because it…"
          answer: "Drops a partial choice as soon as it cannot lead to a valid result"
          distractors:
            - "Never revisits a position that it has already chosen once"
            - "Stores each partial result as it goes, so later branches can reuse them"
            - "Works only when the choices can be laid out as a tree"
          why: "Pruning cuts a whole subtree when a partial assignment already breaks a rule, as in a queen placed under attack. Plain enumeration builds complete candidates and tests them afterwards."
          source: cph
        - q: "Generating every subset of n items by choosing 'include' or 'skip' for each item visits how many leaves of the decision tree?"
          answer: "2^n"
          distractors:
            - "n², since each item pairs with every other"
            - "n!, as in a tree of permutations"
            - "2n, because each item has two choices"
          why: "Each item doubles the number of branches, giving 2 × 2 × … × 2 = 2^n leaves. Permutations are different: they have n! leaves because each choice removes one option from the next."
          source: cph
  - id: bfs
    name: Breadth-first search
    layer: understory
    branch: graphs-and-dp
    tier: 2
    needs: [graph-representation, stack-queue-deque]
    harvest: judged
    minutes: 40
    sources: [erickson, algs4, cph, cses]
    summary: >-
      Read Erickson ch. 5 (Whatever-First Search and Important Variants, where a queue gives BFS), Sedgewick and
      Wayne section 4.1 (breadth-first search) and CPH section 12.2. Notes: queue, visited set, distance array,
      the layer-by-layer invariant, marking nodes when they are enqueued, multi-source BFS, and BFS on implicit
      graphs such as grids and puzzles.
    rubric:
      - "Writes BFS with a queue and a visited set, marking on enqueue"
      - "States the invariant: nodes leave the queue in order of distance"
      - "Explains why it gives shortest paths only when edges are unweighted"
      - "Gives O(V + E) time and O(V) space"
    prompts:
      - "Explain how you would solve this: find the fewest moves for a knight to travel between two squares of an 8 by 8 chessboard. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: given a start word, an end word and a dictionary, find the shortest chain changing one letter at a time. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Breadth-first search from a source node on an unweighted graph reliably gives you…"
          answer: "The fewest edges from the source to every reachable node"
          distractors:
            - "The cheapest path measured by the total weight of its edges"
            - "A valid topological order of the nodes"
            - "A path that visits each node exactly once"
          why: "The queue releases nodes in non-decreasing distance, so the first time you reach a node is along a shortest route in edge count. Weighted graphs need Dijkstra instead."
          source: algs4
        - q: "In BFS, what goes wrong if you mark a node visited only when you pop it from the queue rather than when you push it?"
          answer: "The same node can be queued several times before its first pop, wasting work"
          distractors:
            - "Nodes come off the queue in the wrong level order, so the layers get mixed up"
            - "The search never terminates once the graph contains a cycle"
            - "Nothing at all, as the two marking times are equivalent in every case"
          why: "Several neighbours can discover the same unvisited node before it reaches the front, and each pushes a copy. Pops still come out in level order, so the answer stays right if you skip stale copies, but the queue can grow to O(E). Marking on push keeps one entry per node."
          source: erickson
  - id: dfs
    name: Depth-first search
    layer: understory
    branch: graphs-and-dp
    tier: 2
    needs: [graph-representation, call-stack]
    harvest: judged
    minutes: 40
    sources: [erickson, algs4, cph, cses]
    summary: >-
      Read Erickson ch. 6 (Preorder and Postorder, Detecting Cycles), Sedgewick and Wayne sections 4.1 and 4.2
      (depth-first search, cycles and DAGs), and CPH sections 12.1 and 12.3. Notes: recursive and explicit-stack
      forms, discovery and finish times, edge types in a directed graph, cycle detection with three states,
      connected components and flood fill on grids.
    rubric:
      - "Writes DFS recursively and with an explicit stack"
      - "Names tree, back, forward and cross edges, and what a back edge means"
      - "Detects a cycle in a directed graph using in-progress and done states"
      - "Counts components or fills a region in O(V + E)"
    prompts:
      - "Explain how you would solve this: count the islands of land cells in a grid of land and water. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: given course prerequisites as pairs, decide whether the plan contains a circular dependency. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "In a DFS of a directed graph, finding an edge that leads back to a node still on the current path means…"
          answer: "The graph contains a cycle"
          distractors:
            - "The graph is a tree"
            - "That node cannot be reached again"
            - "You have found a shortest path"
          why: "A node still on the path is an ancestor, so the edge closes a loop from the ancestor to a descendant and back. This is why DFS is the standard way to test whether a dependency graph is acyclic."
          source: erickson
        - q: "For cycle detection in a directed graph, a single 'visited' flag is not enough because…"
          answer: "Reaching a visited node may just be a finished branch, not an ancestor on the path"
          distractors:
            - "Visited flags would take more memory than the graph itself can afford"
            - "A visited flag cannot be reset, so the search could never leave the first branch"
            - "Directed edges cannot be followed backwards, so the cycle is never seen"
          why: "Two paths can legitimately reach the same node in a DAG, with no cycle. You need three states: unvisited, in progress, done. Only an edge into an in-progress node proves a cycle."
          source: algs4
