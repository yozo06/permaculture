    questions:
      water:
        - q: "Kahn's algorithm repeatedly removes nodes with in-degree zero. How does it reveal that the graph has a cycle?"
          answer: "It stops with fewer than n nodes removed, since cycle nodes keep positive in-degree"
          distractors:
            - "The queue is already empty before the first node has been processed"
            - "Some node's in-degree falls below zero while edges are being removed"
            - "A node is removed twice, because the cycle leads back to it"
          why: "Each node on a cycle has an incoming edge from another node on the cycle, which is never removed, so none of them reaches in-degree zero. The leftover nodes are exactly those blocked by a cycle."
          source: wiki-topological-sorting
        - q: "A DFS-based topological order of a DAG is obtained by…"
          answer: "Listing nodes in reverse of the order they finish"
          distractors:
            - "Listing nodes in the order in which they are first discovered"
            - "Sorting nodes by out-degree, highest first"
            - "Listing nodes by their breadth-first level"
          why: "A node finishes only after everything reachable from it has finished, so every edge u to v has v finishing before u. Reversing the finish order puts u ahead of v, as required."
          source: clrs
  - id: dijkstra
    name: Dijkstra's shortest paths
    layer: understory
    branch: graphs-and-dp
    tier: 3
    needs: [bfs, binary-heap]
    harvest: judged
    minutes: 50
    sources: [clrs, algs4, cph]
    summary: >-
      Read the Dijkstra section of CLRS ch. 22, Sedgewick and Wayne section 4.4 and CPH section 13.2 (the
      priority-queue version that tolerates duplicate entries, and its negative-edge example). Notes: tentative
      distance, relaxing an edge, popping the closest unsettled node, why nonnegative weights make the pop final,
      the heap with lazy deletion, and when to use BFS or Bellman-Ford (CPH 13.1) instead.
    rubric:
      - "Describes relaxation and the min-heap loop"
      - "Explains why a popped node's distance is final and why negative edges break this"
      - "Gives O((V + E) log V) with a binary heap"
      - "Names the alternative when edges are negative or all weights equal"
    prompts:
      - "Explain how you would solve this: find the fastest route between two cities in a road network where each road has a nonnegative travel time, and say what you would change if some roads could have negative cost. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Dijkstra's algorithm is only guaranteed correct when…"
          answer: "No edge has a negative weight"
          distractors:
            - "The graph has no cycles"
            - "Every edge weight is an integer"
            - "The graph is undirected"
          why: "When the smallest unsettled distance is popped, no later path can beat it, because later paths only add nonnegative weight. A negative edge could lower a distance after the node was settled."
          source: clrs
        - q: "Dijkstra with a binary heap, where you push duplicate entries instead of decreasing a key, runs in…"
          answer: "O((V + E) log V)"
          distractors:
            - "O(V²), as with an array scan"
            - "O(V + E), the same as BFS"
            - "O(V · E), as with Bellman-Ford"
          why: "There can be one heap entry per relaxed edge, so the heap holds at most E items, and each push or pop costs log E, which is O(log V). Stale entries are skipped when popped. The O(V²) bound belongs to the array version."
          source: cph
  - id: dp-grid
    name: DP on grids
    layer: understory
    branch: graphs-and-dp
    tier: 3
    needs: [dp-1d]
    harvest: judged
    minutes: 45
    sources: [cph, erickson, cses]
    summary: >-
      Read CPH section 7.3 (paths in a grid) and 7.5 (edit distance), and Erickson ch. 3, Edit Distance, including
      how the filled table lets you recover the edits. Notes: a two-index state, filling order so dependencies are
      ready, base row and column, blocked cells, reconstructing the path. Yield: unique paths, minimum path sum
      and edit distance.
    rubric:
      - "Defines dp[i][j] in words and writes its recurrence"
      - "Fills base rows and columns and orders the loops so dependencies are ready"
      - "States the time and the space of the table"
      - "Recovers the path or the edit operations from the table"
    prompts:
      - "Explain how you would solve this: count the paths from the top-left to the bottom-right corner of a grid, moving only right or down, where some cells are blocked. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: find the fewest single-letter inserts, deletes and replaces that turn one word into another. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Minimum path sum in a grid, moving only right or down. The best cost to reach a cell depends on…"
          answer: "Its own value plus the smaller of the best costs above and to its left"
          distractors:
            - "Its own value plus the best cost to its left only"
            - "Its own value plus the best of all eight neighbours"
            - "Its own value plus the best total of the previous row"
          why: "Only two cells can feed a cell when moves are right and down, and taking the cheaper of them is optimal, because the rest of the path does not depend on how you arrived. Eight neighbours would allow cycles."
          source: cph
        - q: "After filling an edit-distance table you want the actual edits, not just the count. What is the standard way?"
          answer: "Trace a path through the table, at each cell following a neighbour that produced its value"
          distractors:
            - "Refill the whole table with the loop order reversed, then read the edits off it"
            - "Read along the main diagonal of the table, since the matching letters lie there"
            - "Keep only the latest row while filling, as it already holds every edit made"
          why: "Every entry was defined by one of up to three neighbours (insert, delete or substitute), so following those choices from one corner to the other spells out an optimal edit sequence; the choices can be recomputed from the numbers in O(m + n) extra time. Keeping only one row saves memory but throws away what the trace needs."
          source: erickson
  - id: knapsack
    name: Knapsack and subset sum
    layer: understory
    branch: graphs-and-dp
    tier: 3
    needs: [dp-1d]
    harvest: judged
    minutes: 50
    sources: [cph, mit6006, cses]
    summary: >-
      Read CPH section 7.4 (knapsack problems, with the 1-D table filled from high capacity to low) and MIT 6.006
      lecture 18 (Part 4: Rods, Subsetsums, Pseudopolynomial), then the CSES coin and money-sum problems. Notes:
      the (item, capacity) state, take-or-skip recurrence, why the loop direction decides 0/1 versus unlimited
      items, and pseudo-polynomial time. Yield: subset sum and partition-equal-sum.
    rubric:
      - "Writes the take-or-skip recurrence for 0/1 knapsack"
      - "Explains the loop direction for 0/1 versus unlimited items"
      - "States O(nW) and why it is called pseudo-polynomial"
      - "Maps subset sum or equal partition onto the same table"
    prompts:
      - "Explain how you would solve this: decide whether an array of positive integers can be split into two groups with equal sums. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "In a 1-D table for 0/1 knapsack, why iterate the capacity from high to low for each item?"
          answer: "So each item is used at most once: lower entries are not yet updated when read"
          distractors:
            - "To keep the memory use of the table as small as possible"
            - "So that the largest capacities, which hold the final answer, are filled first of all"
            - "To keep the items processed in the same order as the input"
          why: "Updating dp[w] from dp[w − weight] when w goes downward reads the old value for this item. Going upward would read an entry already including the item, letting you take it repeatedly, which is the unlimited version."
          source: cph
        - q: "The O(nW) running time of the knapsack DP is called pseudo-polynomial because…"
          answer: "It is polynomial in the value of W but exponential in W's bit length"
          distractors:
            - "It is polynomial in the size of the input, so it counts as a polynomial algorithm"
            - "It is exponential in the number n of items, however small W is"
            - "It only holds when every item has the same weight as the others"
          why: "W can be astronomically large while taking few digits to write down, so the table can be huge compared with the input size. For small capacities it is fast; for a large one it is not."
          source: mit6006
  - id: lis
    name: Longest increasing subsequence
    layer: understory
    branch: graphs-and-dp
    tier: 3
    needs: [dp-1d, binary-search]
    harvest: judged
    minutes: 45
    sources: [cph, wiki-lis, cses]
    summary: >-
      Read CPH section 7.2 (longest increasing subsequence and its O(n²) dynamic program) and the 'Efficient
      algorithms' section of the Wikipedia article on the longest increasing subsequence for the O(n log n) array
      of smallest tails with binary search, then the CSES 'increasing subsequence' problem. Notes: dp ending at
      each index, why the tails array is not the sequence itself, and the strict versus non-strict variants.
    rubric:
      - "Defines dp[i] for the quadratic version and writes its recurrence"
      - "Defines what tails[k] holds and why it stays sorted"
      - "Explains the binary search step and its cost"
      - "Says how to recover an actual sequence and not only its length"
    prompts:
      - "Explain how you would solve this: given a list of envelope sizes, find the longest chain where each envelope is strictly larger than the previous in both width and height. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "In the O(n²) dynamic program for the longest increasing subsequence, dp[i] is…"
          answer: "The length of the longest increasing subsequence that ends at index i"
          distractors:
            - "The length of the longest increasing subsequence found within the first i items"
            - "The value of the i-th element of the best sequence"
            - "The index where the best sequence begins"
          why: "The recurrence is dp[i] = 1 + max over earlier j with a[j] < a[i] of dp[j]. Fixing the last element is what makes extension easy to check. The overall answer is the maximum of all dp[i]."
          source: cph
        - q: "In the O(n log n) method, tails[k] stores…"
          answer: "The smallest possible last value of an increasing subsequence of length k + 1"
          distractors:
            - "The k-th element of the final, longest increasing subsequence found"
            - "The largest last value of any increasing subsequence of length k + 1"
            - "The index in the input of the element chosen as the k-th member of the sequence"
          why: "A smaller tail is always at least as easy to extend, so you keep the best one per length. The array stays sorted, so each new value finds its slot by binary search. The tails array is not itself the subsequence."
          source: wiki-lis
  - id: bitmask-dp
    name: Bitmask DP over subsets
    layer: understory
    branch: graphs-and-dp
    tier: 4
    needs: [knapsack, backtracking]
    harvest: judged
    minutes: 55
    sources: [cph, wiki-held-karp, cses]
    summary: >-
      Read CPH section 10.3 (representing sets) and 10.5 (dynamic programming over subsets), the Wikipedia article
      on the Held-Karp algorithm, and the CSES 'elevator rides' and 'hamiltonian flights' problems. Notes: a
      subset as an integer, testing, setting and clearing bits, a state of (mask, last), the 2^n·n² cost, and the
      n of about 20 that signals this pattern.
    rubric:
      - "Represents a subset as a bitmask and uses bit tests, sets and clears"
      - "Defines the DP state over (mask, last) and its transition"
      - "Gives the cost as roughly 2^n times a polynomial in n"
      - "Recognises the size hint (n up to about 20) that points to this pattern"
    prompts:
      - "Explain how you would solve this: assign n tasks to n workers, one task each, at the lowest total cost given a cost for every pair, with n up to 18. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "In bitmask DP for the travelling-salesman route, dp[mask][last] means…"
          answer: "The cheapest path that visits exactly the cities in mask and ends at last"
          distractors:
            - "The cost of the shortest complete tour that starts from the city called last"
            - "The number of different orders that visit exactly the cities in mask"
            - "The cheapest single edge leaving the set of cities named by mask"
          why: "The mask records which cities are done, and last is where you stand, which is all the future needs to know. Extending to an unvisited city adds one bit and one edge, so the transition is cheap."
          source: wiki-held-karp
        - q: "Held-Karp style bitmask DP for n cities takes about…"
          answer: "O(2^n · n²) time, far better than trying all n! orders"
          distractors:
            - "O(n²) time, since the graph has at most n² edges to consider"
            - "O(n!) time, the same as full enumeration"
            - "O(2^n) time with no extra factor of n"
          why: "There are 2^n masks times n choices of last city, with n options for the next, giving 2^n·n². Because 2^n is much smaller than n! (for n = 20 about a million against 2×10^18), it makes n around 20 feasible."
          source: wiki-held-karp
  # ---------- tier 4 ----------
  - id: mst
    name: Minimum spanning trees
    layer: understory
    branch: graphs-and-dp
    tier: 4
    needs: [union-find, greedy-exchange, dfs]
    harvest: judged
    minutes: 50
    sources: [clrs, algs4, cph]
    summary: >-
      Read CLRS ch. 21 (Minimum Spanning Trees: the generic algorithm with its safe-edge theorem, then Kruskal and
      Prim), Sedgewick and Wayne section 4.3 and CPH ch. 15 (Kruskal, the union-find structure, Prim). Notes: the
      cut property, Kruskal's algorithm (sort edges, add if it joins two components, using union-find), Prim's
      algorithm with a heap, and the complexity of each.
    rubric:
      - "States the cut property and why it makes the greedy edge safe"
      - "Describes Kruskal with union-find and Prim with a heap"
      - "Gives the cost of each and when each is preferred"
      - "Explains the effect of tied weights on uniqueness"
    prompts:
      - "Explain how you would solve this: connect n offices with cable at the lowest total cost, given the price of laying cable between each pair, and say how you would find the cheapest replacement if one cable on your plan turned out to be unusable. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Kruskal's algorithm takes the cheapest remaining edge if and only if…"
          answer: "Its endpoints lie in different components of the edges chosen so far"
          distractors:
            - "It is the lightest edge in the whole graph, whatever the chosen edges are"
            - "It touches the vertex that was added most recently to the tree"
            - "Both of its endpoints have the same degree in the graph"
          why: "An edge inside one component would close a cycle, which a tree cannot have. Scanning edges by increasing weight and using union-find to check components gives O(E log E) time, mostly from sorting."
          source: clrs
        - q: "The cut property says that for any split of the vertices into two groups, the lightest edge crossing it…"
          answer: "Belongs to some minimum spanning tree"
          distractors:
            - "Belongs to every minimum spanning tree"
            - "Can never be part of one"
            - "Forms a cycle with the other crossing edges"
          why: "If an optimal tree lacks that edge, adding it forms a cycle that crosses the cut at another, heavier-or-equal edge, and swapping them does not hurt. With tied weights the lightest crossing edge need not be in every tree."
          source: clrs
  - id: divide-and-conquer
    name: Divide and conquer
    layer: canopy
    branch: graphs-and-dp
    tier: 2
    needs: [recursion, big-o]
    harvest: judged
    minutes: 50
    sources: [clrs, erickson]
    summary: >-
      Read CLRS ch. 2 (merge sort as divide and conquer) and ch. 4 (the recursion-tree and master methods), and
      Erickson ch. 1 (Mergesort, Quicksort, Recursion Trees, Fast Multiplication). Notes: split, solve, combine;
      the recurrence T(n) = a·T(n/b) + f(n) and which term dominates; why balanced splits matter; where the extra
      space goes. Yield: merge sort and inversion counting from the recurrence.
    rubric:
      - "Names the split, solve and combine steps of a divide-and-conquer algorithm"
      - "Writes the recurrence for merge sort and solves it to O(n log n)"
      - "Compares the combine cost with the work at the leaves to see which dominates"
      - "Explains why an unbalanced split, as in quicksort's worst case, costs O(n²)"
    prompts:
      - "Explain how you would solve this: count the pairs of positions i < j where a[i] > a[j] in an array of n numbers, faster than checking every pair. Name the pattern, the invariant, and the time and space cost."
      - "Write the recurrence for each of: binary search; merge sort; a routine that makes three calls on halves of its input and does linear extra work. Give the running time each one solves to and say which term dominates."
    questions:
      water:
        - q: "A divide-and-conquer routine makes three recursive calls on halves of its input, then does O(n) extra work to combine. Its running time is…"
          answer: "O(n^1.58), which is n to the power log2(3)"
          distractors:
            - "O(n log n), the same as merge sort does"
            - "O(n²), because three calls beat two"
            - "O(n³), one factor of n for each call"
          why: "The calls triple at each level while the size only halves, so the work per level grows by a factor of 3/2 and the leaves dominate: 3^(log2 n) leaves is n^(log2 3). Karatsuba multiplication has this shape, which is why it beats the schoolbook n² method."
          source: clrs
        - q: "Quicksort takes the first element as its pivot. On an already sorted array of n distinct values it runs in…"
          answer: "O(n²), since every split leaves one side empty"
          distractors:
            - "O(n log n), as sorted input is the easiest case for a pivot"
            - "O(n), as no swaps are needed when data is already in order"
            - "O(log n), as the first pivot already sits in its final place"
          why: "Each partition removes just one element, so T(n) = T(n − 1) + n, which sums to about n²/2. Balanced splits are what give n log n, which is why real implementations choose the pivot at random or by median of three."
          source: erickson
  - id: proving-correctness
    name: Proving an algorithm correct
    layer: vine
    branch: graphs-and-dp
    tier: 4
    needs: [greedy-exchange, invariants, dijkstra]
    harvest: judged
    minutes: 60
    sources: [erickson, clrs, humble-programmer, wiki-loop-variant]
    summary: >-
      Read the exchange proofs in Erickson ch. 4 and the Dijkstra section of ch. 8 (Best-First: Dijkstra's
      Algorithm), the Dijkstra correctness proof in CLRS ch. 22, Dijkstra's 'The Humble Programmer' (testing shows
      bugs, not their absence) and the Wikipedia article on loop variants for termination. Notes: partial versus
      total correctness, induction on the loop or recursion, invariants, exchange and contradiction proofs.
    rubric:
      - "Separates 'gives the right answer if it stops' from 'always stops'"
      - "Chooses a proof tool (invariant, induction, exchange, contradiction) and says why it fits"
      - "Writes the termination argument with a bounded, shrinking quantity"
      - "Checks the proof against a tricky case such as ties, empty input or negative values"
    prompts:
      - "Pick Dijkstra's algorithm or the earliest-finish rule for interval scheduling. Write a proof of correctness in your own words: the claim, the proof tool you use, the invariant or exchange step, and the termination argument. Then say which input would break it if its key assumption failed."
    questions:
      water:
        - q: "A complete correctness argument for a loop-based algorithm must also show termination. The usual way is to point to…"
          answer: "A quantity that is bounded and strictly shrinks (or grows) every pass"
          distractors:
            - "A test run in which the loop was seen to stop on real input"
            - "A proof showing that the body of the loop does the right thing on each pass"
            - "A bound on the memory that the loop uses while it is running"
          why: "A whole number bounded below that strictly decreases each pass cannot decrease forever, so the loop must end. Showing the body is correct says nothing about whether the loop ever reaches the exit."
          source: wiki-loop-variant
        - q: "Passing a large suite of test cases does not prove an algorithm is correct because…"
          answer: "Tests sample the inputs, and a failure may sit on an input never tried"
          distractors:
            - "Test cases are not able to check the exact format of what a program prints"
            - "A proof is only ever needed when the code is written recursively"
            - "Passing tests only shows that the code compiles and starts to run"
          why: "Tests can find bugs but cannot show their absence, since the input space is huge or infinite. A proof reasons about every input at once. The two work together: the proof states what to test, and tests catch proof gaps."
          source: humble-programmer
  - id: choosing-an-approach
    name: Choosing an approach
    layer: canopy
    branch: linear-and-search
    tier: 4
    needs: [binary-search-answer, greedy-exchange, knapsack, dijkstra, divide-and-conquer]
    harvest: judged
    minutes: 60
    sources: [cph, erickson, mit6006]
    summary: >-
      Read CPH section 2.3 (the table from input size to target complexity), Erickson ch. 3 ('Warning: Greed is
      Stupid' and 'The Pattern: Smart Recursion') and MIT 6.006 lecture 20 (Course Review: how to solve an
      algorithms problem). Notes: reading constraints to infer a target complexity, spotting the pattern from the
      shape of the question, a decision list (sort? window? graph? DP? greedy?), and how to check a choice on a
      small example. Yield: your own one-page decision flow.
    rubric:
      - "Reads input limits to infer the target complexity"
      - "Names the clue in a problem that points to each pattern"
      - "Chooses between greedy and DP, and says how to tell when greedy fails"
      - "States the trade-off in time, space and implementation risk"
    prompts:
      - "Here are three problems in plain words, and you choose a method for each. (1) The cheapest way to connect cities by rail. (2) The most items you can fit in a bag of limited weight, each with a value. (3) The smallest speed that gets a delivery done in time. For each, name the pattern, the invariant, and the time and space cost, and say why the other two patterns do not fit."
    questions:
      water:
        - q: "A problem gives n up to 200,000 and a time limit of a few seconds. The intended complexity is most likely…"
          answer: "About O(n log n) or O(n)"
          distractors:
            - "O(n²), since that is about 4 × 10^10"
            - "O(2^n), the best that can be done"
            - "O(n³) with a small constant"
          why: "Roughly 10^8 to 10^9 simple operations fit in a few seconds. n² is 4 × 10^10 operations, which is far too many, so you need sorting, a heap, a window or a hash map instead. Reading limits first saves hours."
          source: cph
        - q: "A greedy rule seems natural but you cannot prove it, and a small counterexample shows it fails. The sensible next step is…"
          answer: "Switch to a DP or search that considers all choices at each step"
          distractors:
            - "Add a tie-breaking rule to the greedy choice and hope that covers it"
            - "Test it on larger random inputs until it passes"
            - "Accept it, since a counterexample is just an edge case"
          why: "A single counterexample disproves the greedy rule outright, and tie-breaking cannot rescue a rule that is wrong on its basic choice. DP keeps all options open by remembering the best answer for each subproblem."
          source: erickson
