  - id: fenwick-tree
    name: Fenwick tree
    layer: shrub
    branch: linear-and-search
    tier: 2
    needs: [prefix-sums]
    wild: true
    harvest: judged
    minutes: 45
    sources: [cph, cses]
    summary: >-
      Read CPH section 9.2 (binary indexed tree) and the CSES 'dynamic range sum queries' problem. Notes: how
      index i covers a block whose length is its lowest set bit (CPH writes it as the largest power of two
      dividing i), point update and prefix query in O(log n), turning range sum into two prefix queries, and when
      a segment tree (CPH 9.3) is needed instead.
    rubric:
      - "Says what each index of the tree stores"
      - "Writes the update and query loops using the lowest set bit"
      - "Gives O(log n) for both and O(n) space"
      - "Explains when this beats plain prefix sums"
    prompts:
      - "Explain how you would solve this: an array receives many point updates and many range-sum queries, interleaved. Name the data structure, the invariant, and the time and space cost, and say why plain prefix sums fail here."
    questions:
      water:
        - q: "Why does a Fenwick tree beat a plain prefix-sum array when values keep changing between queries?"
          answer: "An update touches about log n entries, not up to n prefix values"
          distractors:
            - "It stores the sums in sorted order so that queries can binary search"
            - "It answers every query in constant time with no log factor"
            - "It needs no extra memory at all beyond the input array itself"
          why: "A plain prefix array must be rewritten from the changed index onwards, which can be O(n). A Fenwick tree stores block sums so both update and query hop through about log n entries."
          source: cph
        - q: "In a Fenwick tree, the entry at index i holds the sum of a block whose length is…"
          answer: "The lowest set bit of i"
          distractors:
            - "The highest set bit of i"
            - "Always exactly two"
            - "The number of ones in i"
          why: "For i = 12 (binary 1100) the lowest set bit is 4, so the entry covers the four items ending at position 12. Jumping by lowest set bits is how queries walk down to zero and updates walk up."
          source: cph
  - id: kmp-prefix-function
    name: KMP and the prefix function
