seeds:
  # ---------- tier 0 ----------
  - id: big-o
    name: Big-O and amortised cost
    layer: ground-cover
    branch: linear-and-search
    tier: 0
    harvest: recall
    minutes: 30
    sources: [clrs, algs4, cph, erickson]
    summary: >-
      Read CLRS ch. 3 (Characterizing Running Times) or CPH ch. 2 (Time complexity), and Sedgewick and Wayne
      section 1.4. For recurrences read Erickson ch. 1 (Mergesort, Recursion Trees); for amortised cost, the
      dynamic-tables section of CLRS ch. 16. Notes: what O, Omega and Theta each claim; the dominant operation in
      a loop, a halving loop and a recursion; worst, average and amortised cost. Yield: three cards mapping a loop
      shape to its cost.
    rubric:
      - "Says Big-O is an upper bound on growth that ignores constants and lower-order terms"
      - "Costs a nested loop, a halving loop and a two-way recursion correctly"
      - "Separates worst-case, average-case and amortised cost with one example of each"
      - "Reports space cost separately from time cost"
    questions:
      water:
        - q: "A loop starts with i = 1 and doubles i each pass until i reaches n, doing constant work per pass. Its running time is…"
          answer: "O(log n)"
          distractors:
            - "O(n) because it reaches n"
            - "O(√n) because it doubles"
            - "O(n log n) because it doubles n times"
          why: "i takes the values 1, 2, 4, 8 and so on, so only about log2(n) passes are needed to reach n. Any loop that multiplies or divides its counter by a constant each pass is logarithmic."
          source: cph
        - q: "Pushing n items one by one onto a dynamic array that doubles its capacity when full costs, in total…"
          answer: "O(n), so each push is O(1) amortised"
          distractors:
            - "O(n log n), since every resize copies up to n items"
            - "O(n²), because any push might copy the whole array"
            - "O(1) in total, since resizing is rare"
          why: "Resizes happen at sizes 1, 2, 4, 8 and so on, so all the copying adds up to less than 2n element moves. The occasional expensive push is paid for by the cheap ones before it."
          source: clrs
      harvest:
        - q: "A function does O(n) work itself, then calls itself on each half of its input (two calls of size n/2). Its total cost is…"
          answer: "O(n log n)"
          distractors:
            - "O(n), because the halves add up to n"
            - "O(n²), since there are two calls per level"
            - "O(log n), because the input halves"
          why: "There are about log n levels, and each level does O(n) work in total across all its calls (the sizes add back up to n). This is the shape of merge sort."
          source: erickson
  - id: arrays-strings
    name: Arrays and strings
    layer: ground-cover
    branch: linear-and-search
    tier: 0
    harvest: recall
    minutes: 25
    sources: [algs4, clrs, pytc, go-slicetricks]
    summary: >-
      Read Sedgewick and Wayne section 1.1 (arrays), CLRS ch. 10 (Elementary Data Structures) and the list and str
      notes on the Python time-complexity page. Then read the Go wiki SliceTricks entry 'Filtering without
      allocating' for the read-index and write-index pattern. Notes: O(1) index access, O(n) insert and delete in
      the middle, in-place versus copying, why repeated string concatenation goes quadratic, and a 2-D array as
      rows of arrays.
    rubric:
      - "Explains why index access is constant time and middle insertion is linear"
      - "Describes an in-place update with a read index and a write index"
      - "Explains when repeated string building is quadratic and the usual fix"
      - "Names what an off-by-one error looks like in a slice or loop bound"
    questions:
      water:
        - q: "Inserting a new value at the front of an array holding n items costs…"
          answer: "O(n), because every existing item shifts one slot"
          distractors:
            - "O(1), since the index of the front is known"
            - "O(log n), since a contiguous array can be split"
            - "O(1) amortised, thanks to spare resizing capacity"
          why: "Items live in consecutive slots, so making room at index 0 moves all n items. Knowing the index only helps reads. A deque or linked list is the tool when you need cheap front inserts."
          source: pytc
        - q: "Where every concatenation creates a new string, building a result with s += c inside a loop of n characters costs about…"
          answer: "O(n²) in total"
          distractors:
            - "O(n) in total"
            - "O(n log n) in total"
            - "O(1) per step, so O(n) overall"
          why: "Each append copies the whole string built so far, so the copies are 1 + 2 + … + n characters. Collecting pieces in a list or a string builder and joining once brings it back to O(n)."
          source: pytc
      harvest:
        - q: "You must delete every zero from an array in O(n) time, keeping the order of the other values and using O(1) extra space. Which approach does it?"
          answer: "Scan once, copying each non-zero value to a write index that only moves forward"
          distractors:
            - "Shift the whole tail one slot left each time you meet a zero"
            - "Sort the array so that every zero ends up together at one end, then trim them"
            - "Copy the non-zeros into a new array first, then copy that array back over the original"
          why: "A read index and a write index let you compact in place in one pass. Shifting per zero is O(n²); sorting loses the order and costs O(n log n); a second array breaks the O(1) space limit."
          source: go-slicetricks
  - id: recursion
    name: Recursion
    layer: ground-cover
    branch: graphs-and-dp
    tier: 0
    harvest: recall
    minutes: 30
    sources: [erickson]
    summary: >-
      Read Erickson ch. 1 (Reductions, Simplify and Delegate, Tower of Hanoi, and the Exponentiation section),
      then the opening Fibonacci section of ch. 3 to see why naive double recursion is exponential. Notes: base
      case, a strictly smaller subproblem, trusting the recursive call, and the cost recurrence. Yield: factorial,
      fast power and Tower of Hanoi each written as 'solve smaller, then combine'.
    rubric:
      - "States the base case and the step that moves toward it"
      - "Explains why you may assume the recursive call is correct (induction)"
      - "Writes the cost recurrence for a simple recursive function"
      - "Shows fast power by squaring as an example of halving the problem"
    questions:
      water:
        - q: "Every correct recursive function needs…"
          answer: "A base case, and a step that gets closer to it each call"
          distractors:
            - "A loop around the call that keeps the recursion going"
            - "At least two recursive calls per invocation, so it can branch"
            - "A global counter that stops it once a set depth is reached"
          why: "Without a base case the calls never end, and without progress toward it they can loop forever. One recursive call is enough, as in factorial; no loop or counter is required."
          source: erickson
        - q: "Computing x^n with x^n = (x^(n/2))² for even n (and one extra factor of x for odd n) needs how many multiplications?"
          answer: "About log2(n)"
          distractors:
            - "About n, one per factor"
            - "About n/2, since it halves the work"
            - "About √n, from the square"
          why: "Each call halves the exponent, so the recursion is only log2(n) levels deep, and each level does one or two multiplications. The key is that the half-power is computed once and reused, not twice."
          source: erickson
      harvest:
        - q: "A naive fib(n) = fib(n-1) + fib(n-2) with no caching runs in…"
          answer: "Exponential time, as the same subproblems are solved over and over"
          distractors:
            - "Linear time, since only n distinct values ever need computing"
            - "Quadratic time, from n levels that each make two calls"
            - "Logarithmic time, as the argument shrinks on each call, like binary search"
          why: "The call tree branches twice per level and the branches overlap heavily, so the number of calls grows by roughly a factor of 1.6 per step of n. Caching each result turns it into n subproblems, the start of dynamic programming."
          source: erickson
  - id: graph-representation
    name: Graph representations
    layer: shrub
    branch: graphs-and-dp
    tier: 0
    harvest: recall
    minutes: 30
    sources: [algs4, cph, clrs]
    summary: >-
      Read Sedgewick and Wayne section 4.1 (the Graph API and its adjacency-list representation) with section 4.2
      for the reverse of a digraph, then CPH section 11.2 (Graph representation) or the representations section of
      CLRS ch. 20 (Elementary Graph Algorithms). Notes: adjacency list, adjacency matrix and edge list with the
      space and lookup cost of each; directed versus undirected; weighted edges. Yield: when each one is the right
      choice.
    rubric:
      - "Gives the space of adjacency list, matrix and edge list in terms of V and E"
      - "States the cost of listing a vertex's neighbours and of testing one edge in each"
      - "Explains why sparse graphs favour lists and dense graphs can favour matrices"
      - "Says how to store direction and weight"
    questions:
      water:
        - q: "A road network has 100,000 junctions and about 300,000 roads, and you walk from junction to junction. The usual storage is…"
          answer: "An adjacency list"
          distractors:
            - "An adjacency matrix, for O(1) lookups"
            - "A list of edges, scanned per move"
            - "A hash set holding every possible pair"
          why: "A list uses O(V + E) space and hands you the neighbours of a vertex directly. A matrix would need V² = 10 billion cells for a graph that has almost no edges."
          source: algs4
        - q: "In an adjacency list, testing whether the specific edge (u, v) exists costs…"
          answer: "Time proportional to u's neighbour count, unless each vertex keeps a hash set"
          distractors:
            - "Constant time, because adjacency lists are indexed directly by vertex number"
            - "O(E) in every case, since the whole edge set must be searched"
            - "O(log V), because every neighbour list is kept sorted and searched by halving"
          why: "You jump to u's list in O(1) but then scan it. A matrix answers in O(1); a hash set per vertex does the same at the price of extra memory."
          source: clrs
      harvest:
        - q: "You store a directed graph as adjacency lists but now also need to walk each edge backwards. What is the standard fix?"
          answer: "Build a second set of lists with every edge reversed"
          distractors:
            - "Treat it as undirected and recover the direction later"
            - "Sort each neighbour list in descending order"
            - "Switch to a matrix, since lists cannot go backwards"
          why: "A list only knows outgoing edges. Keeping a reversed copy costs O(V + E) extra and is how algorithms such as strongly connected components walk against the arrows. A matrix would also work but is not the fix for lists."
          source: algs4
  # ---------- tier 1 ----------
  - id: hash-sets-maps
    name: Hash maps and sets
    layer: shrub
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings]
    harvest: recall
    minutes: 35
    sources: [clrs, algs4, pytc, algorithms-illuminated]
    summary: >-
      Read CLRS ch. 11 (Hash Tables), Sedgewick and Wayne section 3.4, the dict and set notes on the Python
      time-complexity page, and Algorithms Illuminated Part 2 section 12.2, whose 2-SUM application is the
      one-pass map idea. Notes: expected O(1) insert, lookup and delete; what makes a key hashable; counting,
      grouping and 'seen before' as the three everyday uses. Yield: one-pass solutions to two-sum and
      group-anagrams.
    rubric:
      - "States expected and worst-case cost of lookup and what the worst case needs"
      - "Names the three everyday uses: count, group, seen-before"
      - "Explains why a key must not change while it is in the map"
      - "Solves two-sum in one pass and says what the map stores"
    questions:
      water:
        - q: "Counting how often each of n words appears, using a hash map, takes expected time…"
          answer: "O(n)"
          distractors:
            - "O(n log n), as lookups walk a sorted structure"
            - "O(n²), since each lookup scans the earlier words"
            - "O(n·k), where k is the distinct word count"
          why: "Each word needs one expected-O(1) lookup and one update, so the total is linear. Sorting first would give O(n log n); the map avoids that by jumping straight to a bucket."
          source: clrs
        - q: "Which object is unsafe to use as a map key?"
          answer: "A mutable object whose contents (so hash) change after insertion"
          distractors:
            - "A tuple holding two integers and never modified afterwards"
            - "An immutable string that was built once, then reused as a key"
            - "A very large integer that is far bigger than the table size"
          why: "The map files a key under the bucket for its hash at insertion time. If the contents change later, the hash changes and the entry can no longer be found, though it is still stored."
          source: algs4
      harvest:
        - q: "To find, in one pass and expected O(n) time, whether any two numbers in an array sum to a target, you…"
          answer: "Keep a map of values already seen; for each x ask if target − x is in it"
          distractors:
            - "Store every possible pair sum in a set first, then look the target up afterwards"
            - "Keep a sorted copy of the array and walk inward from both ends"
            - "Remember only the largest value seen and compare each new value to it"
          why: "At each step the one partner you need is exactly target − x, which is a single lookup. Storing pair sums costs O(n²), and a sorted copy costs O(n log n) just to build."
          source: algorithms-illuminated
  - id: stack-queue-deque
    name: Stacks, queues and deques
    layer: shrub
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings]
    harvest: recall
    minutes: 25
    sources: [algs4, clrs, cph, wiki-deque]
    summary: >-
      Read Sedgewick and Wayne section 1.3 (its booksite Parentheses client is the bracket matcher), CLRS ch. 10
      (Elementary Data Structures) plus the BFS section of ch. 20 for a queue at work, CPH section 4.5, and the
      implementation notes in the Wikipedia article on double-ended queues. Notes: LIFO versus FIFO, array and
      linked implementations, the ring buffer, and the deque with O(1) at both ends. Yield: bracket matching and a
      queue from two stacks.
    rubric:
      - "Contrasts LIFO and FIFO and names a use of each"
      - "Explains how a ring buffer gives O(1) enqueue and dequeue"
      - "Matches brackets with a stack and says what it holds at any moment"
      - "Says what a deque adds over a stack or a queue"
    questions:
      water:
        - q: "Checking that every closing bracket in \"([{}])\" matches the most recent unclosed opener is a job for…"
          answer: "A stack"
          distractors:
            - "A queue, since the oldest opener closes first"
            - "A set of the brackets seen so far"
            - "A heap ordered by bracket type"
          why: "The most recent unmatched opener must be the first to close, which is last-in-first-out. A queue would pair the first opener with the first closer, which is wrong for nesting."
          source: algs4
        - q: "Visiting a tree level by level, left to right, naturally uses…"
          answer: "A queue, with children added at the back"
          distractors:
            - "A stack, with each node's children pushed on top"
            - "A priority queue ordered by depth"
            - "A hash set of visited nodes"
          why: "First-in-first-out keeps all nodes of one depth ahead of the next depth's nodes. A stack would dive down one branch first, which gives depth-first order."
          source: clrs
      harvest:
        - q: "You need O(1) push and pop at both ends without shifting elements. The structure to reach for is…"
          answer: "A deque, built as a ring buffer or as linked blocks"
          distractors:
            - "A plain array that treats index 0 as the front end"
            - "A singly linked list with only a head pointer, so the far end is slow"
            - "A binary heap that orders items by when they were inserted"
          why: "A ring buffer wraps indices around a fixed array, so neither end ever shifts anything. An array front needs shifting, a head-only singly linked list cannot remove from the far end quickly, and a heap pops its minimum, not an end."
          source: wiki-deque
  - id: binary-heap
    name: Binary heaps and top-k
    layer: shrub
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings, big-o]
    harvest: recall
    minutes: 40
    sources: [clrs, algs4, heapq]
    summary: >-
      Read CLRS ch. 6 (Heapsort: heaps, maintaining the heap property, building a heap), Sedgewick and Wayne
      section 2.4 (its TopM client keeps the k largest) and the heapq docs, whose Theory section gives the
      0-indexed layout. Notes: the heap property, array layout with index arithmetic, sift-up and sift-down,
      heapify in O(n), and the size-k min-heap that keeps the k largest of a stream. Yield: write push, pop and
      top-k from memory.
    rubric:
      - "States the heap property and the array index rule for parent and children"
      - "Gives the cost of push, pop-min and peek, and of heapify"
      - "Explains top-k with a heap of size k, and which kind of heap"
      - "Notes that a heap does not give a sorted iteration for free"
    questions:
      water:
        - q: "In a binary heap stored in a 0-indexed array, the children of the item at index i sit at…"
          answer: "2i + 1 and 2i + 2"
          distractors:
            - "i + 1 and i + 2"
            - "2i and 2i + 1"
            - "i / 2 and i / 2 + 1"
          why: "The heap is a complete binary tree written level by level, so level sizes double. The pair 2i and 2i + 1 is the rule for arrays that start at index 1, which is why 0-indexed code gets it wrong so often."
          source: heapq
        - q: "Building a heap from n unsorted items by sifting down every node, from the last parent back to the root, costs…"
          answer: "O(n)"
          distractors:
            - "O(n log n), as each of the n items costs log n"
            - "O(log n), because the tree is balanced"
            - "O(n²), since each sift compares everything"
          why: "Most nodes sit near the leaves and sift down only a step or two, while only a few near the root pay log n. The sum over levels converges to a constant times n. Inserting n items one at a time is the O(n log n) route."
          source: clrs
      harvest:
        - q: "You must keep the k largest values from a stream of n items using only O(k) memory. What do you keep, and what does it cost?"
          answer: "A min-heap of size k; swap out its root for any larger value; O(n log k)"
          distractors:
            - "A max-heap of size k; remove its root whenever the heap is full; O(n log k)"
            - "A max-heap of all n values, popped k times to get the answer; O(n log n)"
            - "A sorted array of size k; insert each new value by shifting entries; O(nk)"
          why: "The heap's root should be the weakest of your current best k, so it is the first to be evicted, which needs a min-heap. A max-heap of size k would evict your largest values and keep the smallest."
          source: algs4
  - id: two-pointers
    name: Two pointers
    layer: herb
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings]
    harvest: recall
    minutes: 30
    sources: [cph, go-slicetricks, cses]
    summary: >-
      Read CPH section 8.1 (two pointers: a subarray sum, and the 2SUM problem, which sorts first) and, for
      same-direction pointers, the Go wiki SliceTricks entries 'Filtering without allocating' and 'In-place
      deduplicate'. Notes: opposite-end pointers on sorted data, slow and fast pointers for in-place work, why the
      scan stays linear, and when it fails. Yield: pair-sum on a sorted array and remove-duplicates in place.
    rubric:
      - "Describes opposite-end and same-direction pointer setups"
      - "Explains why moving a particular pointer is safe (what it rules out)"
      - "Argues the scan is O(n) because pointers never move back"
      - "Says what property of the data the technique relies on"
    questions:
      water:
        - q: "On a sorted array with a pointer at each end, the pair sums to more than the target. You should…"
          answer: "Move the right pointer one step left"
          distractors:
            - "Move the left pointer one step right"
            - "Move both pointers inward at once"
            - "Restart with the pointers at new positions"
          why: "Sorted order means a smaller right value is the only move that lowers the sum without skipping a valid pair. Moving the left pointer would raise the sum, and moving both can skip an answer."
          source: cph
        - q: "Removing duplicates from a sorted array in place, the slow pointer marks…"
          answer: "The end of the de-duplicated prefix built so far"
          distractors:
            - "The last duplicate value that the scan has found so far"
            - "The middle of the array, where the halves meet"
            - "The index of the first element that is out of order"
          why: "The fast pointer scans every item, and whenever it finds a value different from the one at the slow pointer, that value is written just after the slow pointer. Everything left of the slow pointer is final."
          source: go-slicetricks
      harvest:
        - q: "Why does the opposite-ends pair-sum method not work on an unsorted array?"
          answer: "The sum no longer says which pointer to move, so a valid pair may be skipped"
          distractors:
            - "Pointers cannot safely cross over data that is not in order"
            - "It becomes O(n²) because the pointer loop has to be nested"
            - "Duplicates make the two pointers meet before the scan has finished"
          why: "The method relies on sorted order making each move monotonic: moving one end changes the sum in a known direction. Without that, comparing to the target gives no safe move. Sort first, or use a hash map."
          source: cph
  - id: prefix-sums
    name: Prefix sums
    layer: herb
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings]
    harvest: recall
    minutes: 30
    sources: [cph, cses]
    summary: >-
      Read CPH section 9.1 (static array queries: the prefix sum array, its range formula and the two-dimensional
      version; the book indexes the prefix array from the first element) and the opening of section 9.2 for why
      updates break it. Notes: building the prefix array, the range-sum formula and its off-by-one trap, the 2-D
      rectangle formula, and when to switch to a Fenwick tree. Yield: a range-sum helper and a rectangle-sum
      table; as a stretch, CSES 'Subarray Sums II'.
    rubric:
      - "Builds the prefix array and states the range-sum formula without an off-by-one"
      - "Gives build cost and per-query cost"
      - "Extends the idea to a 2-D table and combines four entries per rectangle query"
      - "Says what breaks when values change between queries, and what to use then"
    questions:
      water:
        - q: "Let P[0] = 0 and P[i] = a[0] + … + a[i-1]. The sum of a[l] through a[r], both included, equals…"
          answer: "P[r + 1] − P[l]"
          distractors:
            - "P[r] − P[l]"
            - "P[r] − P[l − 1]"
            - "P[r + 1] + P[l]"
          why: "P[r + 1] covers everything up to index r, and P[l] covers everything before index l, so the difference is exactly the slice. P[r] − P[l − 1] is right only when the array is stored 1-indexed."
          source: cph
        - q: "Prefix sums over n numbers cost what to build and what per range-sum query?"
          answer: "O(n) to build, O(1) per query"
          distractors:
            - "O(n log n) to build, O(1) per query"
            - "O(n) to build, O(log n) per query"
            - "O(1) to build, O(n) per query"
          why: "One pass builds the table, and each query is a single subtraction. The trade is memory: you store n extra numbers. If the array changes between queries you need a Fenwick tree instead."
          source: cph
      harvest:
        - q: "A fixed n × n grid of numbers must answer a million rectangle-sum queries. Which plan gives the cheapest queries?"
          answer: "Build a 2-D prefix table once; each query then combines four table entries"
          distractors:
            - "Keep a 1-D prefix array per row; each query then adds up one range per row"
            - "Re-add every cell inside the rectangle, since the grid is too big to table"
            - "Sort all the cell values once so each rectangle becomes a contiguous run"
          why: "The table stores the sum from the top-left corner to each cell, so a rectangle is one corner sum minus two strips plus the overlap that was subtracted twice: four lookups, O(1) per query after O(n²) setup. Row-wise prefix arrays also work but cost O(n) per query, and adding cell by cell costs O(n²) per query."
          source: cph
  - id: binary-search
    name: Binary search
    layer: herb
    branch: linear-and-search
    tier: 1
    needs: [arrays-strings, big-o]
    harvest: recall
    minutes: 35
    sources: [algs4, cph, py-bisect, bloch-binary-search]
    summary: >-
      Read Sedgewick and Wayne section 1.1 (the binary search example), the bisect docs (bisect_left states the
      lower-bound invariant on a half-open range), CPH section 3.3 and Joshua Bloch's 2006 post on the midpoint
      overflow bug. Notes: the loop on a half-open range [lo, hi), the lower-bound form that finds the first index
      with a[i] >= x, the overflow-safe midpoint, and the invariant that keeps it correct. Yield: lower-bound and
      upper-bound written from memory.
    rubric:
      - "States the invariant about what lies left of lo and right of hi"
      - "Writes a lower-bound search that terminates on every input"
      - "Computes the midpoint without overflow"
      - "Gives the cost and the one property of the input it needs"
    questions:
      water:
        - q: "Binary search on a sorted array of one million items needs at most about how many comparisons?"
          answer: "20"
          distractors:
            - "1,000"
            - "500,000"
            - "100"
          why: "Each comparison halves the remaining range, and 2^20 is a little over a million, so about 20 halvings reach a single item. Linear search would need up to a million."
          source: algs4
        - q: "Computing the middle as (lo + hi) / 2 with fixed-width integers can fail because…"
          answer: "lo + hi can overflow before the division"
          distractors:
            - "The division rounds the wrong way for odd sizes"
            - "mid can land exactly on hi"
            - "Duplicate values make the loop endless"
          why: "With very large arrays the sum of two valid indices can exceed the integer range and wrap negative. Writing lo + (hi − lo) / 2 never exceeds hi. Integer rounding is harmless to correctness."
          source: bloch-binary-search
      harvest:
        - q: "In a lower-bound search over a half-open range [lo, hi) that returns the first index with a[i] >= x, the invariant is…"
          answer: "Everything before lo is smaller than x; everything from hi on is at least x"
          distractors:
            - "x always lies between the values at a[lo] and a[hi] whenever it is in the array"
            - "a[mid] equals x when the loop ends"
            - "The range shrinks by exactly half each pass"
          why: "The invariant says the answer lies in [lo, hi]. When lo meets hi, the boundary between 'smaller than x' and 'at least x' has been pinned down. Many off-by-one bugs come from not knowing which side mid belongs to."
          source: py-bisect
  - id: dynamic-array-growth
    name: Dynamic array growth
    layer: root
    branch: linear-and-search
    tier: 1
    needs: [big-o, arrays-strings]
    harvest: recall
    minutes: 30
    sources: [mit6006, clrs, algs4]
    summary: >-
      Read MIT 6.006 lecture 2 (Data Structures: dynamic arrays, amortisation and deletion), the dynamic-tables
      section of CLRS ch. 16, and the resizing-array stack in Sedgewick and Wayne section 1.3. Notes: grow by a
      factor versus by a constant, the aggregate and potential methods, and the shrink-too-eagerly trap. Yield:
      why the factor works and why +10 does not.
    rubric:
      - "Shows that growth by a constant factor gives O(1) amortised push"
      - "Shows that growth by a fixed number of slots gives quadratic total cost"
      - "Explains thrashing when a table shrinks at half full"
      - "Names the memory cost of spare capacity"
    questions:
      water:
        - q: "A dynamic array that adds 10 slots each time it fills, pushing n items, costs in total about…"
          answer: "O(n²)"
          distractors:
            - "O(n), as growth is rare"
            - "O(n log n), from repeated copying"
            - "O(n) amortised, same as doubling"
          why: "There are about n / 10 resizes, and each copies everything stored so far, so the copies add up to a sum proportional to n². Multiplying the capacity makes the number of resizes logarithmic instead."
          source: mit6006
        - q: "Which growth factor makes dynamic-array push O(1) amortised?"
          answer: "Any constant factor above 1, such as 1.5 or 2"
          distractors:
            - "Only 2, because doubling matches how binary works"
            - "Only a power of two, so addresses stay aligned in memory"
            - "Any amount of extra room, even one slot, in each step"
          why: "With a factor f, the total copying is a geometric series bounded by roughly n / (f − 1), still linear. Smaller factors waste less memory but copy more often; 1.5 and 2 are common."
          source: mit6006
      harvest:
        - q: "A table halves its capacity as soon as it drops below half full, and a program alternately pushes and pops at that boundary. What happens?"
          answer: "Each operation triggers a resize, so every one costs O(n)"
          distractors:
            - "Nothing special, because resizing is amortised anyway so each op stays cheap"
            - "The array grows without bound until memory runs out"
            - "Pops get cheaper because the array keeps getting smaller"
          why: "Right at the boundary, the table shrinks on pop and immediately regrows on push, copying everything each time. The standard fix is to shrink only at a quarter full, which leaves room for many operations before the next resize."
          source: clrs
  - id: binary-trees
    name: Binary trees and BSTs
    layer: shrub
    branch: graphs-and-dp
    tier: 1
    needs: [recursion]
    harvest: recall
    minutes: 40
    sources: [clrs, algs4]
    summary: >-
      Read CLRS ch. 12 (Binary Search Trees: what a BST is, querying, insertion and deletion) and Sedgewick and
      Wayne section 3.2, including the height method in BST.java on the booksite (it counts edges, so an empty
      tree is -1; the harvest question counts nodes). Notes: node structure, pre-, in- and post-order traversals,
      the BST ordering rule, search and insert, why height decides cost, and self-balancing without the rotations.
    rubric:
      - "Writes pre-, in- and post-order traversals recursively"
      - "States the BST rule and what an in-order walk yields"
      - "Explains that search cost is the tree's height, and when height is n"
      - "Writes the recursion for tree height or node count"
    questions:
      water:
        - q: "An in-order traversal of a binary search tree visits the keys in…"
          answer: "Ascending sorted order"
          distractors:
            - "The order they were inserted"
            - "Level order, top to bottom"
            - "Descending sorted order"
          why: "In-order means left subtree, then the node, then the right subtree. Every key in the left subtree is smaller and every key in the right is larger, so the walk comes out sorted."
          source: clrs
        - q: "Keys 1, 2, 3, …, n are inserted in that order into an ordinary unbalanced BST. A search then costs…"
          answer: "O(n), because the tree degenerates into a chain"
          distractors:
            - "O(log n), because every binary search tree is balanced"
            - "O(1), since the keys are consecutive integers"
            - "O(n log n), from walking down and comparing keys"
          why: "Each new key is bigger than all before it, so it hangs off the right of the last node, and the tree is a linked list of height n. Self-balancing trees such as AVL or red-black trees repair this."
          source: algs4
      harvest:
        - q: "The height of a binary tree, counted in nodes along the longest root-to-leaf path, with an empty tree having height 0, is defined as…"
          answer: "1 + max(height(left), height(right))"
          distractors:
            - "height(left) + height(right)"
            - "1 + min(height(left), height(right))"
            - "The number of nodes divided by two"
          why: "The longest path goes through whichever child is deeper, plus the node itself. Using the minimum finds the shortest path to a missing child, and adding the two heights measures a path through the root, not from it."
          source: algs4
  - id: call-stack
    name: The call stack
    layer: root
    branch: graphs-and-dp
    tier: 1
    needs: [recursion]
    harvest: recall
    minutes: 25
    sources: [wiki-call-stack, py-recursion-limit, erickson]
    summary: >-
      Read the Wikipedia article on the call stack (frames, return addresses, locals), the sys.setrecursionlimit
      entry in the Python docs (why interpreters cap depth), and Erickson ch. 5, Whatever-First Search, which
      writes DFS recursively and with an explicit stack. Notes: a frame holds arguments, locals and a return
      address; depth costs memory; overflow; and the explicit-stack rewrite that avoids it.
    rubric:
      - "Says what a stack frame holds and when it is created and freed"
      - "Explains stack overflow on deep recursion and where the limit comes from"
      - "Converts a recursive walk to an explicit stack, noting what state must be pushed"
      - "Counts the stack space of a recursive function as its maximum depth"
    questions:
      water:
        - q: "Recursing one million levels deep in a language with a fixed-size call stack, such as C, Java or CPython, most likely ends in…"
          answer: "A stack overflow or recursion-limit error"
          distractors:
            - "A slower run that still finishes correctly"
            - "Running out of heap memory first"
            - "A compile-time error about depth"
          why: "Every active call holds a frame on a stack with a fixed budget, often a few megabytes. A runtime that caps depth, as Python does, raises its own error sooner. Heap size is a separate limit."
          source: py-recursion-limit
        - q: "Each active recursive call keeps…"
          answer: "Its own frame, holding its arguments, locals and a return address"
          distractors:
            - "Only the value that it is going to return to its caller"
            - "A private copy of the entire heap, so that calls cannot disturb one another"
            - "Nothing of its own, as the frames are shared between calls"
          why: "The frame is how the call knows where to resume and what its locals were, so that calls at different depths do not disturb each other. This is also why space for a recursion is its maximum depth."
          source: wiki-call-stack
      harvest:
        - q: "To make a deep recursive graph walk safe, you rewrite it with an explicit stack. What must each entry on your stack carry?"
          answer: "What the frame held: the node, and how far through its neighbours you were"
          distractors:
            - "Only the starting node, since the rest can be rebuilt from the graph later"
            - "Only the return value of each finished subcall, collected in order"
            - "Just the depth reached, because the stack can regenerate everything else"
          why: "A call frame remembers where to resume. If your stack holds only the node, you lose your place and may revisit neighbours or finish in the wrong order, so a post-order step breaks."
          source: wiki-call-stack
  - id: union-find
    name: Union-find (disjoint sets)
    layer: shrub
    branch: graphs-and-dp
    tier: 1
    needs: [graph-representation, arrays-strings]
    harvest: recall
    minutes: 40
    sources: [algs4, clrs, cp-deleting-dsu]
    summary: >-
      Read Sedgewick and Wayne section 1.5, or CLRS ch. 19 (Data Structures for Disjoint Sets). Notes: parent
      array, find with path compression, union by size or rank, the nearly constant cost, and what it cannot do
      (undo a merge). For deletions see cp-algorithms 'Deleting from a data structure in O(T(n) log n)', which
      shows the offline rollback version. Yield: counting components in an edge stream.
    rubric:
      - "Describes the parent-array forest and what find and union do"
      - "Names path compression and union by size, and what each fixes"
      - "States the cost as nearly constant per operation"
      - "Says it supports merging and not splitting"
    questions:
      water:
        - q: "Which two ideas together make union-find run in nearly constant time per operation?"
          answer: "Linking the smaller tree under the larger, and compressing paths in find"
          distractors:
            - "Keeping each set as a sorted array, and merging two sets by a linear merge"
            - "Hashing every element, then comparing the hashes of two whole sets"
            - "Storing each set as a list and copying the shorter one into the longer"
          why: "Union by size keeps trees shallow, and path compression flattens whatever a find walks over. Together the amortised cost per operation is the inverse Ackermann function, which is below 5 for any realistic input. Copying the smaller set into the larger is a real technique, but it costs O(log n) per element overall, not nearly constant."
          source: algs4
        - q: "Can union-find undo a union, splitting a set back into two?"
          answer: "Not in its basic form; it only merges sets and answers same-set queries"
          distractors:
            - "Yes, by calling find on the node and then clearing that node's parent link"
            - "Yes, by running union again with the arguments swapped around"
            - "Yes, because every union is recorded as an edge and can be deleted"
          why: "Path compression rewrites parents all over a tree, so the old structure is gone. Handling deletions needs offline tricks such as divide and conquer over time with a rollback version."
          source: cp-deleting-dsu
      harvest:
        - q: "You process a stream of edges over n nodes and want the number of connected components at the end. How do you get it?"
          answer: "Start from n and subtract one per union that joined two different roots"
          distractors:
            - "Count the distinct values in the parent array without calling find on each"
            - "Count the number of union calls that were made"
            - "Count the nodes whose parent has a smaller index than their own"
          why: "Each successful merge reduces the component count by exactly one; a union of nodes already together changes nothing. Raw parent values include non-roots until compressed, so counting them overcounts."
          source: algs4
