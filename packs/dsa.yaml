      - "Describes the event-sweep and what state it carries"
      - "Uses a min-heap of end times for concurrent counts"
      - "Decides how touching endpoints are treated"
    prompts:
      - "Explain how you would solve this: given meeting start and end times, find the minimum number of rooms needed. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: given a list of possibly overlapping ranges, merge them into the smallest set of disjoint ranges. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "A set of meetings needs rooms so that no two meetings in one room overlap. The fewest rooms you can possibly use is never less than…"
          answer: "The most meetings in progress at any single moment"
          distractors:
            - "The number of other meetings that overlap the longest one"
            - "The number of distinct start times among all the meetings"
            - "The number of meetings that start before the last one ends"
          why: "If k meetings are all running at one instant, each needs its own room, so k rooms are unavoidable. This count is called the depth of the intervals, and sorting by start time and reusing a free room achieves it exactly. Distinct start times or the overlaps of one meeting do not bound the answer, since back-to-back meetings share a room."
          source: kt-greedy
        - q: "To count the rooms needed for meetings sorted by start time, you keep a min-heap of…"
          answer: "The end times of meetings in progress"
          distractors:
            - "The start times of the meetings still waiting"
            - "The lengths of the meetings so far"
            - "The room numbers that are free"
          why: "The root is the meeting that ends soonest. If it ends before the next meeting starts, you reuse that room, so you pop it; otherwise you need a new room. The heap size is the number of rooms in use."
          source: kt-greedy
  - id: trie
    name: Tries
    layer: shrub
    branch: linear-and-search
    tier: 2
    needs: [hash-sets-maps, binary-trees]
    harvest: judged
    minutes: 40
    sources: [algs4, cph, cses]
    summary: >-
      Read CPH section 26.2 (trie structure) and Sedgewick and Wayne section 5.2 (tries, including prefix
      matching). Notes: nodes with a child per character, insert and lookup in O(length), prefix queries, array
      children versus map children, and the memory cost. Yield: an insert/search/startsWith implementation.
    rubric:
      - "Describes the node layout and the end-of-word marker"
      - "Gives insert and lookup cost in terms of word length"
      - "Explains how a prefix query finds all words under a node"
      - "Weighs array children against hash-map children for memory"
    prompts:
      - "Explain how you would solve this: build search-as-you-type suggestions for 200,000 product names, returning up to ten names that start with what the user has typed so far. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "Looking up a word of length m in a trie that stores n words costs…"
          answer: "O(m), regardless of how many words are stored"
          distractors:
            - "O(log n), the same as in a balanced search tree"
            - "O(m log n), one search per letter"
            - "O(n · m), comparing every word"
          why: "You follow one edge per character, so the work depends on the word's length and not on the dictionary size. A hash table also gives about O(m), since hashing reads every character."
          source: cph
        - q: "To list every stored word that starts with a prefix p, a trie lets you…"
          answer: "Walk down to the node for p, then collect words in its subtree"
          distractors:
            - "Hash every stored word, then compare each hash against the hash of p"
            - "Scan all stored words and test each one for the prefix p"
            - "Look p up as a whole key and read off the value"
          why: "All words sharing prefix p hang below one node, so a short walk finds them with no scan of unrelated words. A hash lookup of p alone only finds p itself."
          source: algs4
  - id: hash-table-internals
    name: Hash table internals
    layer: root
    branch: linear-and-search
    tier: 2
    needs: [hash-sets-maps, dynamic-array-growth]
    edge: system-design
    harvest: judged
    minutes: 45
    sources: [clrs, algs4, pytc]
    summary: >-
      Read CLRS ch. 11 (Hash Tables): the sections on hash tables with chaining, hash functions and open
      addressing. Then Sedgewick and Wayne section 3.4 (separate chaining, linear probing, resizing) and the dict
      notes on the Python time-complexity page for the worst case. Notes: hash function to bucket index, load
      factor, resizing and rehashing, and how a bad hash or hostile keys turn O(1) into O(n).
    rubric:
      - "Traces a put from hash to bucket and handles a collision by chaining or probing"
      - "Defines load factor and says when and why the table resizes"
      - "Explains why resizing re-inserts every key"
      - "Describes how poor or attacker-chosen hashes degrade cost to linear"
    prompts:
      - "Explain what happens inside a hash map from put(key, value) through a collision to the resize that follows, and say how a bad hash function turns O(1) lookups into O(n). Name the load-factor trigger and the cost of the resize."
    questions:
      water:
        - q: "In a chained hash table with m buckets holding n entries, the load factor n / m tells you…"
          answer: "The average chain length"
          distractors:
            - "The share of buckets that are empty"
            - "The longest chain you will meet"
            - "The count of collisions so far"
          why: "Spread evenly, each bucket holds n / m entries on average, and that average is what a lookup scans. The longest chain depends on the hash quality, and the load factor alone cannot reveal it."
          source: clrs
        - q: "When a hash table resizes, it must…"
          answer: "Re-insert every key, computing its bucket for the new capacity"
          distractors:
            - "Copy each old bucket to the same index in the new, larger array"
            - "Move only the keys that collided"
            - "Keep the old indices and just append spare buckets"
          why: "The bucket index is the hash taken modulo the capacity, so a bigger capacity changes where most keys belong. Copying buckets as they are would leave keys where lookups will no longer find them."
          source: algs4
  - id: cache-locality
    name: Cache locality
    layer: root
    branch: linear-and-search
    tier: 2
    needs: [dynamic-array-growth]
    harvest: judged
    minutes: 45
    sources: [mit6172, drepper-memory]
    summary: >-
      Watch or read MIT 6.172 lecture 14 (Caching and Cache-Efficient Algorithms: cache lines, spatial locality,
      row-major matrices). Then Drepper's 'What Every Programmer Should Know About Memory': section 3.2 (cache
      operation, 64-byte lines), 3.3.2 (sequential versus random list access) and 6.2.1 (optimising L1 data cache
      access). Notes: spatial and temporal locality, row-major versus column-major traversal, array versus linked
      list, and why equal big-O does not mean equal speed.
    rubric:
      - "Explains cache lines and why neighbouring memory is cheap once one item is loaded"
      - "Predicts which loop order over a 2-D array is faster and why"
      - "Explains why array traversal beats pointer chasing for the same big-O"
      - "Says what big-O hides, and when that matters"
    prompts:
      - "Explain why binary search over a sorted array can beat a balanced binary search tree holding the same keys, even though both are O(log n), and name one case where the tree still wins."
    questions:
      water:
        - q: "Summing a large 2-D array stored row by row is much faster when you loop row by row than column by column, because…"
          answer: "Row reads touch consecutive memory, so one fetched line serves many items"
          distractors:
            - "Row-wise loops need fewer additions in total than column-wise ones"
            - "Column-wise reads need extra index arithmetic for every single element they touch"
            - "The CPU can add values from only one row at a time"
          why: "Memory is fetched in cache lines of around 64 bytes. Walking along a row uses every byte of each line, while walking down a column uses a line for one element and then moves on, so the cache misses far more."
          source: mit6172
        - q: "Traversing an array and a linked list of the same n items are both O(n), yet the array is usually several times faster, because…"
          answer: "Array items are adjacent, so cache lines and prefetching help; list nodes are scattered"
          distractors:
            - "Linked lists need a separate memory allocation each time a node is read from them"
            - "Array reads need fewer machine instructions per element than list reads"
            - "Linked-list nodes are stored in slower kinds of RAM than array data"
          why: "Following a pointer to a distant node often means a cache miss, and the processor cannot know the next address until it has loaded the current one. Sequential array access is easy to predict and prefetch."
          source: drepper-memory
  - id: invariants
    name: Loop invariants
    layer: vine
    branch: linear-and-search
    tier: 2
    needs: [binary-search, two-pointers]
    harvest: judged
    minutes: 35
    sources: [clrs, cph]
    summary: >-
      Read CLRS ch. 2 (insertion sort and its loop invariant: initialization, maintenance, termination) and CPH
      section 2.4 (maximum subarray sum, ending in Kadane's algorithm). Notes: how to state an invariant in one
      sentence, check it before the loop, after each pass and at exit, and apply it to Kadane's algorithm and
      binary search.
    rubric:
      - "States the three checks: before the loop, kept by each pass, useful at exit"
      - "Writes a one-sentence invariant for a loop of your choice"
      - "Shows how the invariant plus the exit condition gives the result"
      - "Uses an invariant to find an off-by-one error"
    prompts:
      - "Take Kadane's maximum-subarray loop. State its invariant in one sentence, show it holds before the loop, is kept by each pass, and gives the answer at exit. Say what time and space the loop uses."
    questions:
      water:
        - q: "To show a loop is correct using an invariant, you check that it holds…"
          answer: "Before the first pass, after each pass, and at exit it implies the goal"
          distractors:
            - "After the first pass only, since later passes repeat exactly the same body"
            - "At the last pass only, because that is where the result appears"
            - "On a handful of sample inputs that cover the usual cases"
          why: "Initialisation, maintenance and termination work like induction: the base case, the step, and the conclusion. Testing a few inputs can find a bug but cannot prove there is none."
          source: clrs
        - q: "In Kadane's algorithm, after processing index i, the variable 'cur' holds…"
          answer: "The best sum of a subarray that ends exactly at index i"
          distractors:
            - "The best subarray sum seen anywhere in a[0..i], like the overall answer"
            - "The sum of all elements of a[0..i]"
            - "The best sum of a subarray that starts at index i"
          why: "cur = max(a[i], cur + a[i]) extends the best run ending at the previous index or starts fresh. The best seen anywhere is a separate variable, updated from cur. Mixing up these two meanings is the usual bug."
          source: cph
  - id: edge-case-testing
