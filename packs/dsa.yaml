  - id: sliding-window
    name: Sliding window
    layer: understory
    branch: linear-and-search
    tier: 2
    needs: [two-pointers, hash-sets-maps]
    harvest: judged
    minutes: 40
    sources: [cph, cses]
    summary: >-
      Read CPH section 8.1 (two pointers: the subarray-sum example is a variable window) and 8.3 (sliding window
      minimum, a fixed window), then the CSES sliding-window problems. Notes: fixed versus variable windows, what
      state the window holds (a count map, a sum), when to expand and when to shrink, and why every index enters
      and leaves at most once.
    rubric:
      - "Distinguishes fixed-size from variable-size windows"
      - "States the window invariant and what state is kept for it"
      - "Says when to expand the right edge and when to shrink the left"
      - "Argues the cost is O(n) because each index enters and leaves once"
      - "Gives the space cost of the window state"
    prompts:
      - "Explain how you would solve this: given a list of positive daily sales figures and a target S, find the shortest run of consecutive days whose total reaches at least S. Name the pattern, the invariant, and the time and space cost."
      - "Explain how you would solve this: given a long text, find the longest stretch that contains at most two different characters. Name the pattern, the invariant, and the time and space cost."
    questions:
      water:
        - q: "A window of positive daily sales must stay at or under a budget S. After the right edge takes in a new day, the total exceeds S. You…"
          answer: "Advance the left edge, dropping days, until the total is at most S again"
          distractors:
            - "Reset the window to empty and restart the scan from the new day"
            - "Skip the new day and keep the window exactly as it was before"
            - "Drop days from the right end until the total fits under S again"
          why: "All values are positive, so removing days from the left always lowers the total: shrinking from the left until the budget fits is safe and keeps the new day. Resetting throws away a window that was still partly valid, and dropping from the right undoes the day you just added."
          source: cph
        - q: "A variable window has a shrink loop nested inside its grow loop. Why is the whole scan still O(n)?"
          answer: "Each index enters once and leaves at most once; the pointers never move back"
          distractors:
            - "The inner loop only runs when a duplicate arrives, which is rare"
            - "The shrink loop runs exactly once per grow step, so the nesting costs nothing"
            - "Hash maps make every step constant time, so the loops cancel out"
          why: "The nested loops look quadratic, but the left pointer never moves back and cannot pass the right one. Total left moves are at most n and total right moves are at most n, so it is linear."
          source: cph
