    rubric:
      - Lists fields that make lines joinable, such as request id, tenant, event name and duration
      - Gives events with severities and says why some are not logged at INFO
      - Names secrets or personal data to redact and a mechanism for it
      - Addresses load, with bounded buffers, sampling or dropping
    prompts:
      - >-
        Design the logging for a payment webhook handler. List the fields every line carries, the events you log and
        at what severity, what you must never log, and how you would stop a log flood from slowing requests.
      - >-
        A support engineer cannot connect the five log lines of one failed request. Describe the change to the logging
        setup that fixes this, and how it fits in a ReaderT Env app.
    questions:
      water:
        - q: Why log status and order id as separate JSON fields instead of one interpolated sentence?
          answer: Tools can filter, group and alert on fields without fragile text parsing
          distractors:
            - JSON logs always take less disk space than text logs
            - Show instances cannot render whole sentences safely in a typical Haskell program
            - A sentence cannot carry a severity level
          why: >-
            A field can be queried by name and counted. A sentence has to be matched with a regular expression that
            breaks the next time someone rewords the message.
          source: katip-pkg
        - q: A request id must appear on every log line from a handler and its helpers. In a ReaderT Env app, the simplest approach is to…
          answer: Put it in the logging context carried by the Env, and set it per request
          distractors:
            - Pass it as an extra argument to every logging call
            - Store it in a global IORef that each request overwrites
            - Include it in the message text and parse it out later
          why: >-
            Context carried by the environment follows the call chain automatically, and each request gets its own copy.
            A global is shared across concurrent requests, so lines would be tagged with the wrong id.
          source: katip-pkg
  - id: observability
    name: Runtime metrics & observability
    layer: vine
    branch: runtime-and-performance
    tier: 3
    needs:
      - profiling-eventlog
      - rts
    edge: infra
    harvest: judged
    minutes: 50
    sources: [ghc-rts, base-pkg, pcph]
    summary: >-
      Read the User's Guide RTS options -T, -s and -S, the GHC.Stats docs in base (getRTSStats), and PCPH
      chapter 15, 'Event Logging and ThreadScope' (traceEvent markers). Yield: a short list of RTS numbers to
      export (allocation rate, live bytes, GC time and pauses) and the symptom each one points to, next to the
      usual request metrics.
    rubric:
      - Picks metrics from both the RTS and the application (rate, errors, duration)
      - Explains what each metric would show when something is wrong
      - Says how -T and getRTSStats, or the eventlog, supply the numbers
      - Ties alert thresholds to user impact, not just raw values
    prompts:
      - >-
        Define five runtime and application metrics you would export from a Haskell HTTP service. For each, give the
        question it answers and an alert threshold idea. Add one eventlog user event you would emit around a critical
        section and what you would learn from it.
      - >-
        p99 latency doubles every afternoon. Describe the dashboard panels and RTS numbers you would check, in order,
        to tell a GC problem from a load problem.
    questions:
      water:
        - q: Which RTS option makes `getRTSStats` work at runtime so a service can export GC metrics, without printing a summary at exit?
          answer: "-T"
          distractors:
            - "-s"
            - "-S"
            - "-hT"
          why: >-
            -T collects the statistics silently so the program can read them. -s and -S also collect them but print
            their reports, and -hT is a heap profile, a different mechanism.
          source: ghc-rts
        - q: A dashboard shows p99 latency spikes that line up with rising max live bytes and long major GCs. The service most likely…
          answer: Retains more data over time, so each major GC has more to copy
          distractors:
            - Is network bound, since GC time cannot affect latency
            - Has too few capabilities, so requests queue before the GC runs
            - Runs with the idle GC off, which delays collections
          why: >-
            Copying cost grows with live data, and a stop-the-world pause delays every in-flight request. Rising
            residency points at a leak or a growing cache rather than at the network.
          source: ghc-rts
  - id: servant-api
    name: API design with servant
    layer: canopy
    branch: types-and-effects
    tier: 3
    needs:
      - type-driven-design
      - gadts
    edge: system-design
    harvest: judged
    minutes: 60
    sources: [servant-docs]
    summary: >-
      Work through the servant tutorial pages 'A web API as a type' and 'Serving an API': combinators such as
      :>, :<|>, Capture, ReqBody and Get/Post, 'Failing, through ServerError', then 'Using another monad for
      your handlers' (hoistServer) for a ReaderT app. Yield: notes on how one type yields server, client and
      docs, how handler types are computed from the API type, and where the approach strains (compile times,
      error messages).
    rubric:
      - Writes the API as a type with captures, query, body and header combinators
      - Explains that handler types follow from the API type, so drift is a compile error
      - Handles errors with ServerError and runs the app monad with hoistServer
      - Names a trade-off such as compile time, error messages or versioning
    prompts:
      - >-
        Design the API type for an orders service: list, create (with an idempotency key header), get and cancel, with
        auth and typed errors. Give the type, the Server skeleton, what the compiler refuses if a handler drifts, and
        one servant trade-off you would accept.
      - >-
        Explain how you would add a v2 of one endpoint without breaking v1 clients, using servant types.
    questions:
      water:
        - q: In servant, the handler for `Capture "id" Int :> Get '[JSON] User` has the type…
          answer: Int -> Handler User, computed from the API type
          distractors:
            - Request -> IO Response, as in a bare WAI application
            - Int -> IO (Maybe User), with failures reported as Nothing
            - Any function at all, since handlers are not checked against the API
          why: >-
            The Server type family turns each combinator into a function argument or result, so a handler with the wrong
            shape is a compile error rather than a runtime surprise.
          source: servant-docs
        - q: Handlers run in `ReaderT Env Handler`. What does servant's `hoistServer` do?
          answer: Applies a natural transformation that runs your monad down to Handler
          distractors:
            - Lifts constant lookups out of the per-request loop
            - Converts the whole API type into a WAI Application without needing any handlers
            - Moves the handlers to a pool of worker threads
          why: >-
            serve wants handlers in Handler. hoistServer takes a function from your monad to Handler, typically
            running the ReaderT with the Env, and applies it to every handler in the API.
          source: servant-docs
  - id: safe-parsing
    name: Safe parsing of untrusted input
    layer: vine
    branch: types-and-effects
    tier: 3
    needs:
      - type-driven-design
      - text-bytestring
    harvest: judged
    minutes: 50
    sources: [parse-dont-validate, text-pkg, base-pkg, wai-extra-pkg]
    summary: >-
      Re-read Parse, don't validate with a security eye, the Data.Text.Encoding docs for decodeUtf8', the wai-
      extra RequestSizeLimit middleware and the base docs for readMaybe. Yield: a checklist of limits to apply
      before parsing (body size, nesting depth, time), total decoding with Either, parsing into domain types
      once, and what error text is safe to show a client.
    rubric:
      - Names concrete abuse routes such as size, nesting, encoding, numeric blow-ups and slow clients
      - Places each defence at a layer (proxy, WAI middleware, parser, domain type)
      - Uses total functions (Either or Maybe) instead of read and exceptions for input
      - Returns errors that help the client without leaking internals
    prompts:
      - >-
        List the ways a hostile client could hurt a JSON-over-HTTP Haskell endpoint with only crafted bytes, and for each
        give the limit or check and where it lives (proxy, middleware, parser, domain type).
      - >-
        A webhook handler uses `decode`, `read` and `fromJust` on the body. Rewrite its parsing as a total function
        returning Either, and say which failures become a 400 and which a 500.
    questions:
      water:
        - q: Which function turns untrusted bytes into Text without risking an exception?
          answer: "`decodeUtf8'`, which returns an Either"
          distractors:
            - "`decodeUtf8`, which replaces invalid bytes with a replacement character"
            - "`decodeLatin1`, which rejects bytes above 127"
            - "`T.unpack`, which validates the bytes while converting"
          why: >-
            decodeUtf8 throws on invalid UTF-8, which becomes a 500 for any client who sends bad bytes. The primed
            version returns the failure as a value so you can answer 400.
          source: text-pkg
        - q: A JSON endpoint decodes request bodies of any size with `decode`. What is the first defence to add?
          answer: A byte limit on the body, applied before any parsing starts
          distractors:
            - Switching to eitherDecode so that large bodies fail with a Left
            - A larger -A, so big bodies fit in the nursery
            - Compressing the body with gzip middleware first
          why: >-
            A size-limit middleware rejects an oversized body before your handler or parser sees it, so memory and CPU are
            bounded. Swapping in a decoder that returns a Left still reads the whole body first. Put the cap at the proxy
            as well.
          source: wai-extra-pkg
  - id: linear-types
    name: Linear types
    layer: herb
    branch: types-and-effects
    tier: 3
    needs:
      - gadts
      - bracket
    wild: true
    harvest: judged
    minutes: 40
    sources: [ghc-linear]
    summary: >-
      Read the User's Guide section on linear types (the LinearTypes extension, the %1 arrow, and the
      Limitations part). Yield: notes on what consumed exactly once means, how linear and unrestricted arrows
      mix, why most existing libraries are not linear, and one resource-safety API it could make impossible to
      misuse.
    rubric:
      - Explains linear as used exactly once, not at most once
      - Shows a signature where close consumes a handle so it cannot be used again
      - Explains what stays unrestricted and why
      - Mentions limits, such as an experimental status, little library support, and that exceptions still need handling
    prompts:
      - >-
        Sketch, with types only, a linear API for a file or DB connection handle so that forgetting to close it, or using
        it after close, is a type error. Say what the linear arrow guarantees here and where you would still need bracket.
    questions:
      water:
        - q: "`f :: a %1 -> b` says that `f`…"
          answer: Uses its argument exactly once when its result is used exactly once
          distractors:
            - Runs in constant time and never allocates on the heap
            - Is evaluated at most once, and its result is then cached
            - Takes its argument by reference, which avoids a copy
          why: >-
            Linearity is a promise about how many times the argument is consumed, checked by the type checker. It
            says nothing about speed or evaluation order.
          source: ghc-linear
        - q: Which statement about GHC's LinearTypes extension is accurate for production code today?
          answer: It is marked experimental, so syntax, inference and error messages may still change
          distractors:
            - It is part of GHC2021, and its inference of linearity is considered stable
            - It makes every function in a module linear, so unused arguments are rejected
            - It works only for IO code, since pure functions cannot be linear
          why: >-
            The User's Guide gives the extension (since GHC 9.0) an experimental status and tells you to expect bugs and
            bad error messages; multiplicity polymorphism and several pattern forms are still incomplete. It is opt-in per
            module and per function arrow, so you adopt it where a resource-safety API justifies the cost.
          source: ghc-linear
  - id: reading-core
    name: Reading GHC Core
    layer: root
    branch: runtime-and-performance
    tier: 4
    needs:
      - worker-wrapper
    harvest: artifact
    minutes: 60
    sources: [ghc-optimisation, ghc-profiling]
    summary: >-
      Dump the Core of a small function with -ddump-simpl (and -dsuppress-all to cut the noise; both flags are
      listed on the guide's debugging page, linked from the source note). Then read the optimisation flag
      entries for -ffull-laziness, -fworker-wrapper and -fcpr-anal. Yield: a one-page cheat sheet of what let
      (allocation), case (forcing), lambdas, $w workers, $s specialisations, I# boxes and dictionary arguments
      look like, and which patterns signal a problem.
    rubric:
      - Reads let as allocation and case as forcing
      - Recognises $w workers, $s specialisations and dictionary arguments
      - Spots boxing (I#, D#) in a hot path
      - Connects a Core change to a measurable difference in allocation or time
    prompts:
      - >-
        Pick a function from a service you know. Dump its optimised Core with -ddump-simpl and the suppress flags,
        annotate it line by line (what allocates, where it forces, what is boxed, where dictionaries are passed), then
        make one change and prove it with a second dump and +RTS -s numbers.
    questions:
      water:
        - q: In `-ddump-simpl` output, which construct usually means a heap allocation of a suspended computation?
          answer: A let binding of a non-trivial expression
          distractors:
            - A case expression on a variable
            - A top-level lambda with no free variables
            - A type application to a known type
          why: >-
            let allocates a thunk (or closure) for its right-hand side; case forces a value. Reading Core is mostly
            counting lets in the hot path and asking whether each is needed.
          source: ghc-optimisation
        - q: A name like `$wgo` in Core is a sign that…
          answer: Worker/wrapper split go, and the worker takes unboxed arguments
          distractors:
            - go was specialised to one type class instance
            - go was marked NOINLINE by the programmer
            - go was floated out to the top level of the module
          why: >-
            The $w prefix marks a worker. Specialised copies are named $s, and floated-out bindings usually get lvl
            names, so the prefix tells you which transformation made the binding.
          source: ghc-optimisation
  - id: effect-libraries
    name: Effect libraries vs mtl
    layer: understory
    branch: types-and-effects
    tier: 4
    needs:
      - effects
      - readert-pattern
    harvest: judged
    minutes: 55
    sources: [effectful-pkg, readert-pattern, transformers-pkg, ghc-optimisation]
    summary: >-
      Read the effectful package page ('What about mtl?') next to the definitions of StateT and ExceptT in the
      transformers docs, and the -fspecialise entry in the User's Guide optimisation flags. Yield: notes on the
      n-by-m instance problem in mtl, why layer order changes semantics (StateT over Either versus the reverse),
      how effectful avoids transformer stacks, and the speed risk of unspecialised polymorphic code.
    rubric:
      - Shows the same capability in at least two styles
      - Explains the layer-order semantics issue or the instance cost in mtl
      - Discusses runtime cost and when specialisation or static dispatch matters
      - Makes a recommendation tied to team size and risk, not taste
    prompts:
      - >-
        Take one feature (logging, a DB call, config and retry). Sketch it three ways: ReaderT Env IO with records, mtl
        classes, and an effect library. Compare boilerplate, testability, speed risk and what a new teammate must learn,
        then pick one and justify it.
      - >-
        Show with a small example that StateT over Either and ExceptT over State behave differently after a failure, and
        say how a service would choose between them.
    questions:
      water:
        - q: After an error mid-computation, which keeps the state changes made so far, StateT s (Either e) or ExceptT e (State s)?
          answer: "`ExceptT e (State s)`, because the state sits beneath the error layer"
          distractors:
            - "`StateT s (Either e)`, because state is threaded through every step"
            - Both keep it, since the order of the layers is only cosmetic
            - Neither does, because an error always rolls state back to the start
          why: >-
            StateT s (Either e) a is s -> Either e (a, s), so a Left carries no state. ExceptT e (State s) a is
            s -> (Either e a, s), so the final state is returned either way.
          source: transformers-pkg
        - q: An mtl-style function `MonadState Int m => m ()` is slow in a hot loop in another module. A common cause is…
          answer: It is compiled once against a dictionary, never specialised to a stack
          distractors:
            - mtl classes allocate a fresh thread for each call
            - MonadState always forces the state lazily, which keeps every old version alive
            - Class constraints disable the garbage collector's nursery
          why: >-
            Polymorphic code receives the monad's operations as a dictionary at runtime, so each bind is an unknown call.
            Specialisation (INLINABLE, SPECIALIZE) or a static-dispatch library removes that indirection.
          source: ghc-optimisation
  - id: service-architecture
    name: Service architecture
    layer: canopy
    branch: runtime-and-performance
    tier: 4
    needs:
      - servant-api
      - structured-logging
      - readert-pattern
    harvest: artifact
    minutes: 75
    sources: [servant-docs, readert-pattern, three-layer-cake, base-pkg]
    summary: >-
      Pull the earlier seeds together. Re-read Three Layer Haskell Cake (the layers from IO orchestration to
      pure business logic), servant's 'Using another monad for your handlers' and the ReaderT post's
      'Initializing resources', plus the 'Terminating the program' notes in base's Control.Concurrent. Yield: a
      diagram and a short note laying out a Haskell service as HTTP edge, ReaderT application layer, pure domain
      core and adapters, with resource lifetimes, timeouts, pools and shutdown marked.
    rubric:
      - Separates edge, application, pure domain and adapters, with dependencies pointing inward
      - Shows resource lifetimes tied to startup, bracket and shutdown
      - Places timeouts, retries and bounded queues at the boundaries
      - Says where logs and metrics come from and what is deliberately left out
    prompts:
      - >-
        Draw a module and dependency diagram for a Haskell order service with an HTTP edge, application layer, domain
        core and adapters for the database and a payment API. Mark where resources are acquired and released, where
        timeouts and retries live, where logs and metrics are emitted, and what happens on SIGTERM. Name two things you
        left out on purpose.
    questions:
      water:
        - q: In a 'functional core, imperative shell' service, business rules such as pricing live in…
          answer: Pure functions over plain data, called by thin effectful handlers
          distractors:
            - The IO handlers, so that rules can read the database directly
            - Database triggers, so rules apply no matter who writes
            - Type class instances on the HTTP request types
          why: >-
            Pure rules are easy to test and to reason about, because they cannot touch the outside world. The shell
            fetches the data, calls them, and performs the resulting effects.
          source: three-layer-cake
        - q: On SIGTERM during a deploy, which design lets in-flight requests finish and resources close cleanly?
          answer: Stop accepting, wait for handlers to finish, then release pools in bracket
          distractors:
            - Kill every handler thread at once and let the OS close the sockets
            - Exit the main thread, since the runtime finalises everything else on exit
            - Restart the process and replay the lost requests from the logs
          why: >-
            When main returns, other Haskell threads are simply abandoned without running cleanup. Graceful shutdown means
            draining the server, then letting bracket release the pools in reverse order of acquisition.
          source: base-pkg
