finds:
  - id: nonmoving-gc
    near: [gc, leaks, rts]
    seed: nonmoving
    text: "GHC's non-moving garbage collector (--nonmoving-gc) marks the old generation concurrently, trading a little throughput for much shorter pauses."
  - id: stm-commit
    near: [stm, lockfree]
    text: "GHC STM validates at commit with per-TVar locks, so long transactions on hot TVars retry often. Keep transactions short and TVars fine-grained."
  - id: whnf
    near: [laziness, eval-model, strict-data]
    text: "Bang patterns and `seq` only force to weak head normal form. `deepseq` (NFData) is what forces a whole structure."
  - id: linear-arrow
    near: [gadts, bracket, newtypes-deriving]
    seed: linear-types
    text: "GHC 9.0 added LinearTypes. A function typed a %1 -> b must consume its argument exactly once, and the check is purely static: it does not by itself change the generated code, which is why it is aimed at safer APIs rather than speed."
  - id: text-utf8
    near: [text-bytestring, safe-parsing, containers]
    text: "Since text-2.0, Data.Text stores UTF-8 internally instead of UTF-16. Converting valid UTF-8 bytes to Text now means validating them, not transcoding them, which makes decode and encode much cheaper."
  - id: omit-yields
    near: [async-exceptions, rts, worker-wrapper]
    text: "GHC checks for a pending async exception or context switch when a thread allocates. A tight loop that never allocates can ignore killThread and timeout. Compiling with -fno-omit-yields adds the checks back, for a few percent of code size."
  - id: small-strict-fields
    near: [strict-data, worker-wrapper, vectors]
    text: "With -O, GHC already unpacks strict fields that are no larger than a pointer (-funbox-small-strict-fields). A field written as !Int lives inside its constructor without an UNPACK pragma; the pragma matters for bigger fields."
  - id: lazy-map-values
    near: [containers, leaks, folds]
    text: "Data.Map (the lazy one) stores whatever expression you hand it as a value. Updating a counter with insertWith (+) a million times builds a million-step thunk chain; Data.Map.Strict evaluates each sum as it is inserted."
  - id: delimited-continuations
    near: [effects, effect-libraries, readert-pattern]
    text: "GHC 9.6 added delimited-continuation primops (prompt# and control0#) to the runtime. They are for library authors, and let effect systems capture continuations natively rather than through free-monad interpretation."
  - id: eventlog-markers
    near: [profiling-eventlog, observability]
    text: "traceMarkerIO and traceEventIO in Debug.Trace write your own labelled events into the eventlog, so ThreadScope can show a request starting and ending next to the GC and scheduler activity."
