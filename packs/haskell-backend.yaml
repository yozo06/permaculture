# Backend · Haskell — Permaculture pack (v0, extracted from the Phase 0 prototype)
# Format: docs/pack-format.md · Licence: CC-BY-SA 4.0 (packs/LICENSE.md)
pack: haskell-backend
version: 0
title: Backend · Haskell
color: "#6DB24F"
description: >-
  Running Haskell services in production: the runtime under your feet, the types above your head, and the
  idioms in between.
branches:
  - id: runtime-and-performance
    title: Runtime & performance
  - id: types-and-effects
    title: Types & effects
sources:
  - id: pcph
    title: Parallel and Concurrent Programming in Haskell (Simon Marlow)
    url: https://simonmar.github.io/pages/pcph.html
    note: The author's page links the free online edition and the O'Reilly page; chapter numbers in the seed summaries follow that edition.
  - id: base-pkg
    title: base (Hackage documentation)
    url: https://hackage.haskell.org/package/base
    note: Data.Foldable (its Overview on strict and lazy folds), Data.Maybe, Data.Either, Data.Ord, Data.Coerce, Data.IORef, System.IO, System.IO.Unsafe, System.Timeout, Control.Exception, Control.Concurrent and GHC.Stats.
  - id: transformers-pkg
    title: transformers (Hackage documentation)
    url: https://hackage.haskell.org/package/transformers
    note: StateT, ExceptT, ReaderT and their definitions; the mtl package (https://hackage.haskell.org/package/mtl) adds the classes.
  - id: containers-pkg
    title: containers (Hackage documentation)
    url: https://hackage.haskell.org/package/containers
    note: Data.Map and Data.Map.Strict (the module headers cover strict versus lazy values and point to HashMap), Data.IntMap and Data.Set. HashMap itself lives in unordered-containers (https://hackage.haskell.org/package/unordered-containers).
  - id: text-pkg
    title: text (Hackage documentation)
    url: https://hackage.haskell.org/package/text
    note: Data.Text (including copy), Data.Text.Encoding (decodeUtf8'). The bytestring package (https://hackage.haskell.org/package/bytestring) has the same ideas for raw bytes, including Data.ByteString.copy.
  - id: vector-pkg
    title: vector (Hackage documentation)
    url: https://hackage.haskell.org/package/vector
  - id: parse-dont-validate
    title: "Parse, don't validate (Alexis King)"
    url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
  - id: readert-pattern
    title: The ReaderT Design Pattern (FP Complete)
    url: https://web.archive.org/web/20240124135910/https://www.fpcomplete.com/blog/readert-design-pattern/
    note: The original site is offline (the post was published in June 2017), so this is the Internet Archive copy of the post.
  - id: three-layer-cake
    title: Three Layer Haskell Cake (Matt Parsons)
    url: https://www.parsonsmatt.org/2018/03/22/three_layer_haskell_cake.html
    note: Layer 1 is the ReaderT pattern, layer 2 mtl-style classes, layer 3 pure business logic.
  - id: servant-docs
    title: Servant documentation and tutorial
    url: https://docs.servant.dev/en/latest/
    note: The tutorial pages "A web API as a type" and "Serving an API", plus the cookbook recipe on using a custom monad.
  - id: quickcheck-pkg
    title: QuickCheck (Hackage documentation)
    url: https://hackage.haskell.org/package/QuickCheck
    note: Hedgehog (https://hackage.haskell.org/package/hedgehog) is the main alternative, with integrated shrinking.
  - id: katip-pkg
    title: katip (Hackage documentation)
    url: https://hackage.haskell.org/package/katip
    note: A structured logging library; the same ideas apply to co-log or any JSON logger.
  - id: effectful-pkg
    title: effectful (Hackage documentation)
    url: https://hackage.haskell.org/package/effectful
    note: The package page carries the README, including the "What about mtl?" section.
  - id: conduit-pkg
    title: conduit (Hackage documentation)
    url: https://hackage.haskell.org/package/conduit
    note: The package page carries the README, with its Evaluation strategy and Resource allocation sections.
  - id: wai-extra-pkg
    title: "wai-extra: Network.Wai.Middleware.RequestSizeLimit"
    url: https://hackage.haskell.org/package/wai-extra/docs/Network-Wai-Middleware-RequestSizeLimit.html
    note: Request body size limits as WAI middleware, which servant and Warp applications can use.
  - id: lock-free
    title: Non-blocking algorithm (Wikipedia)
    url: https://en.wikipedia.org/wiki/Non-blocking_algorithm
    note: Defines wait-free, lock-free and obstruction-free. Jeff Preshing's An Introduction to Lock-Free Programming (https://preshing.com/20120612/an-introduction-to-lock-free-programming/) covers compare-and-swap loops.
  - id: ghc-smp
    title: "GHC User's Guide: Using Concurrent Haskell (-threaded and -N)"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/using-concurrent.html
  - id: ghc-rts
    title: "GHC User's Guide: Runtime system (RTS) options"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/runtime_control.html
    note: Garbage collector options, runtime statistics (-T, -s, -S) and tracing (-l).
  - id: ghc-profiling
    title: "GHC User's Guide: Profiling"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/profiling.html
    note: Cost centres, time profiles and the heap profile breakdowns (-hc, -hT and the rest).
  - id: ghc-strict
    title: "GHC User's Guide: Bang patterns and Strict Haskell"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/exts/strict.html
  - id: ghc-pragmas
    title: "GHC User's Guide: Pragmas"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/exts/pragmas.html
    note: INLINE, INLINABLE, NOINLINE, SPECIALIZE and UNPACK.
  - id: ghc-gadts
    title: "GHC User's Guide: Generalised Algebraic Data Types (GADTs)"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/exts/gadt.html
  - id: ghc-linear
    title: "GHC User's Guide: Linear types"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/exts/linear_types.html
  - id: ghc-deriving
    title: "GHC User's Guide: Deriving strategies"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/exts/deriving_strategies.html
    note: The neighbouring sections cover generalised newtype deriving, deriving any class and deriving via.
  - id: ghc-optimisation
    title: "GHC User's Guide: Optimisation (code improvement)"
    url: https://downloads.haskell.org/ghc/latest/docs/users_guide/using-optimisation.html
    note: Flag entries for -fworker-wrapper, -fstrictness, -fcpr-anal, -fspecialise, -ffull-laziness and -fcse. The -ddump-simpl and -dsuppress-* flags are in the same guide's page on debugging the compiler (https://downloads.haskell.org/ghc/latest/docs/users_guide/debugging.html).
seeds:
  - id: laziness
    name: Laziness model
    layer: ground-cover
    branch: types-and-effects
    tier: 0
    harvest: recall
    minutes: 30
    sources: [pcph]
    summary: >-
      Read Marlow's PCPH chapter 2, the section 'Lazy Evaluation and Weak Head Normal Form'. Yield: a page on
      what a thunk is, when it is forced, why it runs at most once, and one example each of laziness that helps
      (an infinite or half-used structure) and laziness that costs (a deferred error or a pile of suspended
      work).
    rubric:
      - Says a thunk is a suspended computation that runs only when its value is demanded
      - Explains that an evaluated thunk is overwritten with its result, so it never runs twice
      - Separates naming a value (let) from demanding it (pattern match, case, seq)
      - Gives one case where laziness helps and one where it hides cost or errors
    questions:
      water:
        - q: "`let xs = [1..] in take 3 xs` works because…"
          answer: Lists are built lazily; only the demanded cons cells get evaluated
          distractors:
            - GHC detects infinite lists and truncates them at compile time
            - take forces the whole list first, then discards the rest
            - "[1..] is shorthand for a list capped at some fixed length, such as 1000"
          why: Thunks are evaluated on demand; take only pattern-matches three cells.
          source: pcph
        - q: "Given `ys = map expensive [1..1000]`, a program evaluates only `head ys`. What runs?"
          answer: Only the first call to `expensive`; the other 999 stay unevaluated
          distractors:
            - All 1000 calls run as soon as ys is bound, because let evaluates its right side
            - None of them, since head only inspects the spine and never the element
            - Only the first call runs, and ys is rebuilt from scratch on every later use
          why: >-
            map produces cons cells whose heads are thunks. Evaluating head ys forces the first element only, and
            the evaluated thunk is updated in place, so nothing is recomputed later.
          source: pcph
      harvest:
        - q: A service parses config into a record with lazy fields and reports a bad value only hours later, on first use. What explains it?
          answer: The error sat inside an unevaluated thunk until something demanded the field
          distractors:
            - GHC defers every exception until the program exits, then prints them together
            - The parser ran on a background thread that failed without reporting anything
            - Lazy fields are skipped by the parser unless they are marked strict
          why: >-
            Building a record does not evaluate its lazy fields. The failure stays suspended, which is why boundary
            code usually forces (or uses strict fields for) parsed values at startup so bad config fails fast.
          source: pcph
  - id: stm
    name: STM retry
    layer: shrub
    branch: types-and-effects
    tier: 1
    harvest: recall
    minutes: 45
    sources: [pcph]
    summary: >-
      Read PCPH chapter 10 (Software Transactional Memory): 'Running Example: Managing Windows', 'Blocking',
      'Merging with STM', 'Bounded Channels' and 'Performance'. Yield: notes on TVar, atomically, retry and
      orElse, why transactions compose where lock-based code does not, and a sketch of a bounded queue built
      from TVars that blocks when full or empty.
    rubric:
      - States that a transaction either commits all its writes or none, as if it ran alone
      - Explains retry as blocking until a TVar the transaction read changes
      - Explains orElse as trying an alternative when the first branch retries
      - Says why side effects other than TVar writes cannot appear inside atomically
    questions:
      water:
        - q: Inside an STM transaction, what does `retry` do?
          answer: Blocks until a TVar it read changes, then re-runs the transaction
          distractors:
            - Re-runs the transaction immediately in a busy loop until it succeeds
            - Throws an exception to the caller that atomically can catch and handle
            - Commits the writes made so far and ends the transaction early
          why: retry parks the thread and wakes it when any TVar read so far is written by another transaction.
          source: pcph
        - q: What does `orElse a b` do inside a transaction?
          answer: Runs `a`; if `a` retries, undoes its writes and runs `b` instead
          distractors:
            - Runs a and b in parallel and keeps whichever finishes first
            - Runs b only when a throws an exception, and commits both sets of writes
            - Runs a and then b, committing both as a single transaction
          why: >-
            orElse is the choice operator for blocking. The writes made by the branch that retried are rolled back,
            so the alternative starts from a clean view.
          source: pcph
      harvest:
        - q: Why can you not run IO inside `atomically`?
          answer: A transaction may run several times before committing, so effects would repeat
          distractors:
            - IO is too slow for the STM scheduler to track reliably
            - The runtime has no way to time IO inside a transaction
            - STM transactions run only on the main thread
          why: Transactions are optimistic and can be re-executed; IO effects cannot be rolled back.
          source: pcph
        - q: Two threads move money between the same two TVar accounts in opposite directions. With STM instead of MVar locks, what happens?
          answer: No deadlock; the runtime detects the conflict and re-runs one transaction
          distractors:
            - The same deadlock, because each transaction takes its TVars in program order
            - Both transactions abort forever, since STM has no way to resolve conflicts
            - A deadlock exception is thrown to whichever thread locked second
          why: >-
            STM has no lock order for the programmer to get wrong. Transactions validate at commit; on a conflict
            one is discarded and re-run, so the opposite orderings cannot wedge each other.
          source: pcph
  - id: bracket
    name: bracket & cleanup
    layer: herb
    branch: types-and-effects
    tier: 1
    harvest: recall
    minutes: 30
    sources: [pcph, base-pkg]
    summary: >-
      Read PCPH chapter 9 (Cancellation and Timeouts): 'Masking Asynchronous Exceptions' and 'The bracket
      Operation'. Then the bracket, finally and mask entries in base's Control.Exception. Yield: notes on the
      three parts of bracket, what masking protects, and an example where a hand-written try/finally leaks a
      connection that bracket would not.
    rubric:
      - Names the three parts of bracket and says when release runs
      - Explains why acquire and release run with asynchronous exceptions masked
      - Gives a case where hand-written cleanup leaks a resource
      - Notes the limit, that a blocking operation inside mask can still be interrupted
    questions:
      water:
        - q: "`bracket acquire release use` runs `release` when…"
          answer: "`use` finishes, throws, or the thread gets an async exception"
          distractors:
            - Only when `use` returns normally, since errors skip cleanup
            - Only on asynchronous exceptions, not on ordinary failures
            - Only if `acquire` itself fails part of the way through
          why: bracket masks async exceptions during acquire/release and always runs release.
          source: pcph
        - q: Why prefer `bracket` over writing `acquire >>= use >>= release` by hand?
          answer: The hand-written version leaks the resource if `use` throws or is cancelled
          distractors:
            - The hand-written version cannot return a value from use to the caller
            - bracket runs use on a separate thread so that failures stay isolated
            - The hand-written version runs release twice whenever use throws an error or exits
          why: >-
            Plain sequencing never reaches release when an exception unwinds past it. bracket installs the handler
            for you and masks the gap between acquiring and installing it.
          source: pcph
      harvest:
        - q: What does `mask` change for the `acquire` step?
          answer: Async exceptions are deferred until an interruptible op or unmask
          distractors:
            - Synchronous exceptions are caught and swallowed until acquire returns
            - The garbage collector is paused so acquire cannot be interrupted
            - Nothing changes; mask applies only to the release function
          why: Without mask, a Ctrl-C between acquire and the handler install would leak the resource.
          source: pcph
  - id: gc
    name: GC generations
    layer: root
    branch: runtime-and-performance
    tier: 1
    harvest: recall
    minutes: 40
    sources: [ghc-rts]
    summary: >-
      Read the User's Guide section 'RTS options to control the garbage collector' (-A, -n, -F, -G, -c, -I, -qg,
      -qn) and run a program with +RTS -s. Yield: notes on the nursery and the old generation, what makes an
      object get promoted, why a copying collector needs headroom, and which flags trade pause time against
      throughput.
    rubric:
      - Describes generations, the nursery, and what promotion means
      - Explains why most objects die young and why that makes minor collections cheap
      - Says -A is per capability and what raising it costs
      - Reads allocation, max residency and GC time off a +RTS -s report
    questions:
      water:
        - q: GHC's default garbage collector is…
          answer: A generational copying collector
          distractors:
            - Reference counting, with a cycle detector for loops
            - Mark-and-sweep only, with no generations at all
            - There is no GC; memory is arena-allocated per request
          why: Young objects live in the nursery and get copied to the old generation if they survive.
          source: ghc-rts
        - q: A service runs with `-N8 -A64m`. Roughly how much memory do the nurseries take in total?
          answer: About 512MB, since -A applies to each capability
          distractors:
            - 64MB in total, shared by all eight capabilities
            - 64MB plus a fixed 8MB of bookkeeping per capability
            - About 128MB, one nursery for each of the two generations
          why: >-
            Each capability allocates into its own nursery, so the allocation area is -A times -N. Forgetting this is
            how a "small" -A change ends up using gigabytes.
          source: ghc-rts
      harvest:
        - q: Raising -A (nursery size) usually means…
          answer: Fewer minor GCs, more memory per capability
          distractors:
            - More minor GCs, less memory in use at any moment
            - No change to GC frequency, only to the heap profile
            - The old generation shrinks to make room for the nursery
          why: >-
            A bigger nursery fills more slowly, so minor collections are rarer; cost is memory and cache
            locality.
          source: ghc-rts
  - id: leaks
    name: Space leaks
    layer: root
    branch: runtime-and-performance
    tier: 1
    harvest: recall
    minutes: 45
    sources: [pcph, base-pkg, containers-pkg, ghc-profiling, ghc-strict]
    summary: >-
      Read the Overview in base's Data.Foldable docs (strict versus lazy folds), the User's Guide profiling
      chapter on heap profiling (-hc, -hT) and the thunk part of PCPH chapter 2. Yield: a list of the three
      common ways a lazy program holds memory (thunk chains, retained references, lazy state) and, for each, how
      a heap profile would show it.
    rubric:
      - Defines a space leak as memory held longer than the program needs it
      - Explains how a lazy accumulator builds a chain of thunks
      - Names at least two other causes, such as retained references or lazy state or map values
      - Says which tool shows it (+RTS -s residency, a heap profile) and how a strict version fixes it
    questions:
      water:
        - q: The classic `foldl` space leak happens because…
          answer: The lazy accumulator builds a chain of thunks before anything is forced
          distractors:
            - The list is evaluated strictly up front and held in memory
            - Too many capabilities run the fold at the same time
            - foldl allocates a brand new copy of the list at every step
          why: foldl' (or a bang on the accumulator) forces each step and keeps memory flat.
          source: base-pkg
        - q: A request counter does `Map.insertWith (+) path 1` on a lazy `Data.Map` for each hit, and memory keeps growing. Why?
          answer: Each value becomes a chain of unevaluated (+) thunks until someone reads it
          distractors:
            - insertWith copies the whole map on every update, so old versions pile up in memory
            - The map keeps every previous version around for later rollback
            - The keys are boxed and never garbage collected while the map lives
          why: >-
            The lazy Data.Map stores whatever expression it is given. Updating a hot key 10 million times leaves a
            10 million deep (+) chain; Data.Map.Strict evaluates each sum on insert.
          source: containers-pkg
      harvest:
        - q: Which RTS flag gives you a heap profile broken down by cost centre?
          answer: "-hc"
          distractors:
            - "-s"
            - "-N"
            - "-A64m"
          why: "-hc profiles by cost centre; -hy by type, -hd by closure description."
          source: ghc-profiling
        - q: A -hT heap profile shows memory dominated by THUNK closures and I# boxes, and the live data is a growing state record. Which change is most likely to fix it?
          answer: Make the record's fields strict so each update stores an evaluated value
          distractors:
            - Raise -A so the nursery absorbs the thunks before they are promoted
            - Switch to the non-moving collector so that old thunks are freed concurrently
            - Add more capabilities with -N so the thunks are evaluated in parallel
          why: >-
            The thunks are live data, so no collector setting can free them. Strict fields (or bangs) evaluate each
            update when it is made, so the old values become garbage immediately.
          source: ghc-strict
  - id: rts
    name: Threaded RTS
    layer: root
    branch: runtime-and-performance
    tier: 2
    needs:
      - gc
    harvest: recall
    minutes: 40
    sources: [ghc-smp, ghc-rts, pcph]
    summary: >-
      Read the User's Guide on using Concurrent Haskell with -threaded and -N, the -qg, -qn and -I options in
      the RTS options page, then PCPH chapter 15, 'RTS Options to Tweak'. Yield: notes on capabilities vs OS
      threads vs Haskell threads, what -threaded changes, how parallel GC synchronises capabilities, and how to
      size -N inside a container.
    rubric:
      - Distinguishes capabilities, OS threads and Haskell (green) threads
      - Says what -N sets and what -threaded adds to the runtime
      - Explains why parallel GC can hurt when capabilities exceed available CPU
      - Names a flag to limit or turn off parallel GC and when to try it
    questions:
      water:
        - q: "`-N4` with the threaded runtime gives you…"
          answer: "4 capabilities: OS threads that run Haskell threads in parallel"
          distractors:
            - 4 green threads, all multiplexed onto one OS thread
            - 4 separate heaps with no sharing between them
            - Nothing unless you also use forkOS for every thread
          why: >-
            Each capability is serviced by an OS thread and runs Haskell (green) threads one at a time, so N
            capabilities give N-way parallelism. Extra OS threads can exist for blocking foreign calls, but they are
            not capabilities.
          source: ghc-smp
        - q: A service runs `-N16` in a container limited to 4 CPUs of quota and shows long GC pauses. What is the likely cause?
          answer: Sixteen capabilities compete for four CPUs, so GC threads wait on descheduled peers
          distractors:
            - The RTS silently caps -N at the number of physical cores, so the extra ones just idle
            - Capabilities beyond the thread count deadlock the collector
            - The nursery is shared, so sixteen capabilities collide on one allocation area
          why: >-
            Parallel GC makes every capability meet at a barrier. If the OS has not scheduled some of them, the rest
            spin or wait, so pause time grows. Match -N to the CPUs you actually get.
          source: pcph
      harvest:
        - q: A latency-sensitive service on -N8 has 200 ms pauses although its live heap is small. The pause is GC threads waiting on each other. What do you try first?
          answer: Limit GC threads with -qn, or turn parallel GC off with -qg
          distractors:
            - Lower -A so each collection has less data to copy
            - Lower -I so the idle collector fires sooner
            - Add -threaded so the collector can run concurrently with Haskell code
          why: >-
            With a small heap, the pause is mostly synchronisation, not copying. Fewer GC participants (-qn) or a
            single-threaded collection (-qg) removes the barrier cost. -N only works with the threaded runtime anyway.
          source: ghc-rts
  - id: lockfree
    name: Lock-free structures
    layer: shrub
    branch: types-and-effects
    tier: 2
    needs:
      - stm
    harvest: recall
    minutes: 40
    sources: [pcph, base-pkg, lock-free]
    summary: >-
      Read the Wait-freedom and Lock-freedom parts of the Wikipedia article on non-blocking algorithms, PCPH
      chapter 15 'Shared Concurrent Data Structures', and the Data.IORef docs in base (atomicModifyIORef' and
      the note on atomicity). Yield: notes on what lock-free and wait-free promise, how a compare-and-swap retry
      loop works, when an IORef beats an MVar or TVar, and what contention does to one hot location.
    rubric:
      - Defines lock-free (the system makes progress) versus wait-free (every thread does)
      - Describes a compare-and-swap retry loop and when it can starve a thread
      - Says what atomicModifyIORef' guarantees and what its prime changes
      - Explains how contention on one location hurts and one way to reduce it
    questions:
      water:
        - q: A compare-and-swap loop can starve a thread because…
          answer: Another thread keeps winning the CAS, so it never commits
          distractors:
            - CAS takes a global lock that other threads hold for long periods
            - The GC blocks CAS operations until the next major collection
            - CAS only works on 8-bit values, so larger updates are split
          why: Lock-free guarantees system progress, not per-thread progress; that is wait-free.
          source: lock-free
        - q: What does the prime in `atomicModifyIORef'` change compared with `atomicModifyIORef`?
          answer: It forces the new value, so thunks do not pile up inside the IORef
          distractors:
            - It upgrades the operation from lock-free to wait-free
            - It adds a lock so that only one thread at a time is able to update the value
            - It lets the update function itself run in IO instead of purely
          why: >-
            Both versions are atomic. The lazy one stores an unevaluated application, so a hot counter becomes a long
            thunk chain; the strict one evaluates it before returning.
          source: base-pkg
      harvest:
        - q: Eight threads bump one shared counter in a tight loop, and an MVar-guarded Int is slow because each release hands the lock to a waiting thread. Which change usually helps first?
          answer: Use an IORef with atomicModifyIORef', so no thread blocks or hands over
          distractors:
            - Use a plain IORef with readIORef and writeIORef, since each call is atomic
            - Wrap every increment in forkIO so the waiting threads run in parallel
            - Raise -A so that fewer collections interrupt the increments
          why: >-
            MVar promises fairness, so a releasing thread must hand the MVar to a waiter and every increment pays a
            thread switch. atomicModifyIORef' updates in place in one atomic step and never blocks; the prime forces
            the value so thunks do not pile up. A separate read then write would lose updates.
          source: pcph
  - id: gadts
    name: GADTs & type-level
    layer: ground-cover
    branch: types-and-effects
    tier: 2
    needs:
      - laziness
    harvest: recall
    minutes: 45
    sources: [ghc-gadts]
    summary: >-
      Read the User's Guide section 'Generalised Algebraic Data Types (GADTs)', including its rules for pattern
      matching on a GADT and for rigid types. Yield: notes on how a match refines a type variable, the typed
      expression evaluator as the standard example, why a function matching on a GADT needs a signature, and how
      an existential constructor hides a type.
    rubric:
      - Explains that each constructor can fix the type index it returns
      - Shows how pattern matching brings a type equality into scope in that branch
      - Says why such functions need explicit type signatures
      - Gives one real use, such as a typed expression tree or a state-indexed type
    questions:
      water:
        - q: A GADT lets a constructor…
          answer: Refine the type parameter, so pattern matching learns type information
          distractors:
            - Have more than one name, one for each module that uses it
            - Be used at the kind level only, never in ordinary terms
            - Skip the type checker when it is applied to a literal
          why: "`eval :: Expr Int -> Int` is safe because matching on `IntLit` refines `a ~ Int`."
          source: ghc-gadts
        - q: Why does a function that pattern matches on a GADT usually need an explicit type signature?
          answer: The type differs per branch, so GHC cannot infer one result type
          distractors:
            - Each branch is compiled on its own, so GHC needs a signature to join them
            - Signatures tell GHC which constructors are missing from the match
            - GADT syntax cannot be parsed unless a signature appears before the body
          why: >-
            Inside a branch, matching adds a local equality such as a ~ Int. Inferring a type across branches that
            each know something different has no single answer, so you state the rigid type up front.
          source: ghc-gadts
      harvest:
        - q: "A typed expression tree is a GADT with constructors such as `IsZero :: Expr Int -> Expr Bool` and `If :: Expr Bool -> Expr a -> Expr a -> Expr a`. What does that buy over a plain, untyped `Expr` type?"
          answer: Ill-typed trees, such as `If (Lit 3) a b`, cannot be built at all
          distractors:
            - Evaluation becomes lazy, so unused branches are never type checked
            - Every `Expr` value carries its type at runtime, so `eval` can check it
            - Pattern matches on `Expr` no longer need a type signature in any case
          why: >-
            Each constructor fixes the type index it returns, so the type checker refuses a tree that puts an Int
            where a Bool belongs. Matching on `IsZero` or `If` also tells GHC which type that branch has, so
            `eval :: Expr a -> a` needs no runtime tag checks. The types are erased; the guarantee is compile time only.
          source: ghc-gadts
  - id: effects
    name: Effect systems
    layer: canopy
    branch: types-and-effects
    tier: 3
    needs:
      - gadts
      - bracket
    harvest: recall
    minutes: 60
    sources: [readert-pattern, effectful-pkg]
    summary: >-
      Read FP Complete's The ReaderT Design Pattern (the sections 'Avoiding WriterT and StateT', 'Avoiding
      ExceptT' and 'Has typeclass approach'), then the effectful package page, especially 'What about mtl?'.
      Yield: a one-page comparison of three ways to structure effects (a concrete ReaderT Env IO, mtl-style
      classes, an effect library): boilerplate, speed, testability and what a new teammate must learn, ending
      with the one you would pick for a new service.
    rubric:
      - Describes ReaderT Env IO and where capabilities and state live
      - Names mtl-style classes and an effect library as the alternatives
      - Compares them on boilerplate, performance risk and testability
      - Makes a choice for a concrete service and says what would change your mind
    questions:
      water:
        - q: The ReaderT-over-IO pattern avoids…
          answer: Deep transformer stacks and their lifting overhead
          distractors:
            - All use of IO, by pushing every effect behind a type class
            - Exceptions entirely, since errors become values in the Env
            - The need for a configuration record shared by every function
          why: One ReaderT Env IO layer; capabilities live in the Env.
          source: readert-pattern
        - q: What is the strongest argument for keeping a logger, DB pool and config as fields of one Env record?
          answer: A test can swap any capability by building a different Env
          distractors:
            - The compiler can then prove that no capability is used twice
            - Capabilities no longer need to be initialised inside IO
            - It removes the need for exception handling around them
          why: >-
            The record is plain data passed to the app, so tests build one with fake clients, and production builds
            one with real pools. No transformer instance or type class machinery is needed for that swap.
          source: readert-pattern
      harvest:
        - q: A StateT-over-ExceptT-over-IO stack loses state updates made by a worker thread forked in a handler. How does the ReaderT-over-IO pattern avoid that?
          answer: State lives in shared references in the Env, not in a threaded monad value
          distractors:
            - ReaderT copies the state back into the parent thread when the worker thread finishes
            - forkIO is disallowed inside ReaderT, so worker threads never exist
            - The Env is immutable, so forked threads can never observe changes
          why: >-
            A StateT value is passed along the call chain; a forked thread receives a copy and its changes vanish. An
            IORef or TVar in the Env is one shared mutable cell that every thread sees.
          source: readert-pattern
  - id: nonmoving
    name: Non-moving GC
    layer: root
    branch: runtime-and-performance
    tier: 3
    needs:
      - rts
    wild: true
    harvest: recall
    minutes: 30
    sources: [ghc-rts]
    summary: >-
      Read the User's Guide entry for --nonmoving-gc in 'RTS options to control the garbage collector', and the
      notes on -c and -I next to it. Yield: notes on why a copying old generation causes long pauses on large
      heaps, how the non-moving collector marks concurrently and frees in place, and what you give up
      (throughput, some memory overhead).
    rubric:
      - Explains why copying a large old generation produces long stop-the-world pauses
      - Says the non-moving collector marks concurrently and reclaims memory without moving it
      - Names the trade-off in throughput and when it is worth it
      - Says how to enable it and how to check its effect with +RTS -s or the eventlog
    questions:
      water:
        - q: GHC's non-moving collector mainly reduces…
          answer: Pause times for the old generation
          distractors:
            - Allocation cost for short-lived objects in the nursery
            - Thunk creation during lazy evaluation of large structures
            - Binary size of programs built with the threaded runtime
          why: Enable with --nonmoving-gc; throughput can drop slightly.
          source: ghc-rts
        - q: What does the non-moving collector do differently from the default for the old generation?
          answer: Marks live data concurrently and frees dead segments in place
          distractors:
            - Copies the old data in parallel across every capability
            - Compacts the heap into one contiguous block at each cycle
            - Reference-counts old objects and frees them when the count hits zero
          why: >-
            Because objects are not moved, marking can run alongside the program and the stop-the-world part shrinks
            to a short synchronisation, at the cost of fragmentation and some extra bookkeeping.
          source: ghc-rts
      harvest:
        - q: A service with a 6GB live heap has p99 latency dominated by major-GC pauses. Which change targets that directly?
          answer: Run with --nonmoving-gc and compare pause times against throughput
          distractors:
            - Raise -A to 1GB so major collections never happen
            - Switch to -c compacting collection to shrink the pauses on the old generation
            - Disable the idle GC with -I0 and leave everything else alone
          why: >-
            Long pauses on a big old generation come from copying it. Concurrent marking avoids that copy; -A only
            helps minor collections, -c is slower than copying, and -I0 affects idle periods, not busy ones.
          source: ghc-rts
  - id: purity
    name: Purity & referential transparency
    layer: ground-cover
    branch: types-and-effects
    tier: 0
    harvest: recall
    minutes: 25
    sources: [base-pkg, ghc-optimisation]
    summary: >-
      Read the System.IO.Unsafe docs in base (unsafePerformIO and the precautions it lists), the 'IO monad'
      entry in System.IO, and the -fcse and -ffull-laziness entries in the User's Guide optimisation flags.
      Yield: notes on what referential transparency lets GHC do, what an IO a value actually is, and why a
      global IORef made with unsafePerformIO needs NOINLINE.
    rubric:
      - Defines referential transparency as swapping an expression for its value without changing behaviour
      - Explains that an IO action is a description that does something only when it is run
      - Names two things purity makes safe, such as sharing, inlining, reordering or dropping unused code
      - Says what can go wrong with unsafePerformIO
    questions:
      water:
        - q: "`let act = print 1 in act >> act` prints…"
          answer: 1 twice, because naming an action does not run it
          distractors:
            - 1 once, because act is a shared value that is evaluated one time
            - Nothing at all, because let never executes IO
            - 1 once, then a type error on the second use of act
          why: >-
            An IO action is a value that describes an effect. Binding it with let runs nothing; each time it is
            placed in the sequence, it runs.
          source: base-pkg
        - q: What does GHC gain from knowing that a call `f x` has no side effects?
          answer: It may share, inline or float the call without changing results
          distractors:
            - It may cache the result of f on disk between separate program runs
            - It can skip type checking at every place where f is called from another module
            - It can guarantee that f x terminates for all inputs
          why: >-
            Purity is the licence for optimisation: duplicate work can be shared (-fcse), expressions floated out of loops
            (-ffull-laziness) and calls inlined or evaluated earlier once GHC proves them strict. It says nothing about
            termination; a pure function can still loop forever.
          source: ghc-optimisation
      harvest:
        - q: A teammate caches a database lookup using unsafePerformIO inside a function GHC inlines in three places. In production the query sometimes runs once and sometimes three times. Why?
          answer: GHC treats the call as pure, so it may duplicate, share or float it freely
          distractors:
            - unsafePerformIO runs on a pool thread, so the count depends on thread scheduling
            - The thunk is re-evaluated after every garbage collection cycle
            - The database driver caches some queries and not others
          why: >-
            By promising purity you let the optimiser treat the call as an expression, and which copy it keeps is
            its decision. Effects belong in IO; global singletons need NOINLINE and care.
          source: base-pkg
  - id: error-values
    name: Maybe, Either & total functions
    layer: ground-cover
    branch: types-and-effects
    tier: 0
    harvest: recall
    minutes: 30
    sources: [base-pkg, parse-dont-validate]
    summary: >-
      Read the Data.Maybe, Data.Either and Text.Read (readMaybe) docs in base, then the section 'Turning partial
      functions total' in Parse, don't validate. Yield: notes on when to return Maybe, Either or throw, how
      traverse short-circuits, and a list of partial functions to ban (head, fromJust, read, !!) with a total
      replacement for each.
    rubric:
      - Says when Maybe is enough and when Either with a typed error is needed
      - Explains that Either short-circuits on the first Left in a monadic or traversal chain
      - Lists partial functions to avoid and a total replacement for each
      - Says what a total function is and why exhaustive matches matter
    questions:
      water:
        - q: "`traverse parseInt` over four strings, where only the second and fourth fail, returns…"
          answer: A Left carrying the error for the second item only
          distractors:
            - A Right list of the good values, with the bad ones dropped
            - A Left with both errors collected into a list
            - A Right list with Left placeholders in the failed positions
          why: >-
            Either's Monad and Applicative stop at the first Left. Collecting every error needs a validation
            applicative, which is a different type on purpose.
          source: base-pkg
        - q: "What is the safest replacement for `read s :: Int` on user input?"
          answer: "`readMaybe s`, with the Nothing case handled at the call site"
          distractors:
            - "`read` wrapped in a `catch` for ErrorCall around the whole handler"
            - "`reads s`, taking the head of the list it returns"
            - "`fromJust (readMaybe s)`, because the input was already checked"
          why: >-
            read throws on bad input, and head or fromJust only move the crash. readMaybe returns the failure as a
            value the type system makes you handle.
          source: base-pkg
      harvest:
        - q: A lookup returns `Maybe User`, and callers treat Nothing as 'create a default user' both when the user is missing and when the database is down. What does this show?
          answer: Maybe cannot say why it failed, so an Either with a typed error is needed
          distractors:
            - Maybe is lazy, so the error shows up too late and a strict Maybe is needed
            - Matching on Nothing is partial, so fromMaybe must replace it everywhere
            - Callers should catch an exception, since Maybe is only meant for parsing
          why: >-
            Nothing carries one bit. When different causes need different handling, encode them in a sum type in Left,
            so the caller must decide what to do for each.
          source: base-pkg
  - id: newtypes-deriving
    name: Newtypes & deriving strategies
    layer: herb
    branch: types-and-effects
    tier: 0
    harvest: recall
    minutes: 30
    sources: [ghc-deriving, base-pkg]
    summary: >-
      Read the User's Guide section on deriving strategies and its neighbours (generalised newtype deriving,
      deriving any other class, deriving via), plus the Data.Coerce docs in base. Yield: notes on the zero
      runtime cost of a newtype, what stock, newtype, anyclass and via each do, and an example where two
      strategies give different output for the same type.
    rubric:
      - Explains that a newtype is erased at runtime but is a distinct type at compile time
      - Names the four strategies and what each one derives from
      - Gives a case where stock and newtype deriving produce different behaviour, such as Show or ToJSON
      - Says why wrapping ids and units in newtypes prevents mix-ups
    questions:
      water:
        - q: At runtime, `newtype UserId = UserId Int` differs from a plain `Int` by…
          answer: "Nothing: the wrapper is erased after type checking"
          distractors:
            - One extra pointer indirection on every access to the value
            - A tag word that pattern matching must check each time
            - An allocation per construction unless the field is made strict
          why: >-
            A newtype has the same representation as its field, so wrapping is free. That is why it is the standard
            way to make ids, units and validated strings distinct types.
          source: base-pkg
        - q: "With `newtype OrderId = OrderId Int deriving newtype Show`, `show (OrderId 5)` gives…"
          answer: "5, because the instance is reused from Int"
          distractors:
            - "OrderId 5, which is the shape that stock deriving writes"
            - A compile error, since newtypes cannot derive Show
            - The empty string, because the wrapper is erased at runtime
          why: >-
            The newtype strategy reuses the underlying type's instance, while stock deriving writes the constructor
            name. Erasure is about representation, not about which instance gets picked.
          source: ghc-deriving
      harvest:
        - q: In an API, `newtype UserId = UserId Text` derives ToJSON with the newtype strategy, and `data User` derives it with anyclass through Generic. What do clients receive for a user's id field?
          answer: A bare JSON string for the id, inside a JSON object for the user
          distractors:
            - A JSON object that wraps the string under a UserId key
            - A JSON object for both, since derived instances always use Generic
            - A compile error, because the two strategies cannot be mixed in one module
          why: >-
            The newtype strategy borrows Text's instance, so the id is just a string. DeriveAnyClass produces an empty
            instance that falls back to default methods (here Generic). Pick the strategy per type on purpose.
          source: ghc-deriving
  - id: folds
    name: Folds & foldl'
    layer: ground-cover
    branch: runtime-and-performance
    tier: 0
    harvest: recall
    minutes: 30
    sources: [base-pkg]
    summary: >-
      Read the Overview in base's Data.Foldable docs (recursive, corecursive and short-circuit folds) and the
      entries for foldr, foldl, foldl' and foldMap. Yield: each fold written as a loop on paper, which ones can
      stop early on an infinite list, which run in constant space, and the rule of thumb for choosing between
      foldr and foldl'.
    rubric:
      - Writes foldr and foldl as recursion and says how each associates
      - Explains why foldr can stop early on a lazy combiner
      - Explains why foldl' keeps memory flat and when plain foldl leaks
      - Says what foldl' forces (the accumulator to WHNF) and what it does not
    questions:
      water:
        - q: Which fold can return a result from an infinite list when the combining function is lazy in its second argument?
          answer: "`foldr`, since the combiner may stop before demanding the rest"
          distractors:
            - "`foldl'`, because forcing the accumulator ends the loop early"
            - "`foldl`, because it starts from the left, where the list begins"
            - None of them, since every fold must traverse the entire list
          why: >-
            foldr f z (x:xs) = f x (foldr f z xs), and if f ignores its second argument the recursive call is never
            demanded. This is how any and takeWhile-style functions work on infinite lists.
          source: base-pkg
        - q: Why is `foldl' (+) 0 xs` safe on ten million Ints, where lazy `foldl` can exhaust memory?
          answer: foldl' forces the accumulator at every step, so no thunk chain forms
          distractors:
            - foldl' reverses the list first, so that the additions happen in order
            - foldl' splits the list and sums the chunks in parallel
            - foldl' fuses the list away, so it is never allocated at all
          why: >-
            Lazy foldl builds (((0+x1)+x2)+...) as unevaluated thunks and only collapses it at the end. With -O GHC's
            strictness analysis often rescues simple cases, but you should not rely on it.
          source: base-pkg
      harvest:
        - q: Running totals over 50 million rows use `foldl'` with a tuple accumulator (count, total), and memory still grows. Why?
          answer: foldl' forces only the tuple constructor, so each field stays a thunk chain
          distractors:
            - foldl' does not work on tuples; it needs a list as the accumulator
            - Tuples are always boxed on the heap and never collected until the whole fold ends
            - The list is retained because foldl' keeps a reference to its head
          why: >-
            foldl' evaluates the accumulator to weak head normal form, which for a pair is just the (,) constructor.
            Use a strict data type or bang patterns on the fields so each step evaluates them.
          source: base-pkg
  - id: containers
    name: Map, IntMap & HashMap
    layer: shrub
    branch: runtime-and-performance
    tier: 0
    edge: dsa
    harvest: recall
    minutes: 40
    sources: [containers-pkg]
    summary: >-
      Read the module headers of Data.Map.Strict, Data.IntMap.Strict and Data.Set in containers (the notes on
      strict versus lazy values, Ord keys and the performance information). The Data.Map header also points to
      HashMap in unordered-containers for the contrast. Yield: a table of lookup and insert costs, which key
      constraint each needs (Ord or Hashable), what ordering they give, and the lazy versus strict value
      distinction.
    rubric:
      - States the cost of lookup and insert for Map, IntMap and HashMap
      - Says which key class each requires and what ordering it offers
      - Explains persistence, so an update shares most of the old structure
      - Explains why the Strict modules matter for values that are updated often
    questions:
      water:
        - q: When would `Data.Map` be a better fit than a `HashMap` for a service's lookup table?
          answer: When you need keys in order, such as the next key above a threshold
          distractors:
            - When the key type has no Eq instance, since Map does not need one
            - When keys are mostly Ints, which Map hashes faster than HashMap does
            - When the table never changes after startup, since only Map is read-only
          why: >-
            Map is an ordered tree, so it supports range queries and sorted traversal, and it needs only Ord. HashMap
            is usually faster for point lookups but has no useful key order.
          source: containers-pkg
        - q: "`Map.insert` into a map of a million entries returns a new map. About what does that cost?"
          answer: O(log n) new nodes along one path, with the rest shared
          distractors:
            - O(n), because the whole map has to be copied
            - O(1), because the update mutates the structure in place
            - O(log n), but the old map is invalidated and must not be used
          why: >-
            Maps are persistent. Only the nodes on the path from the root to the changed key are rebuilt, so the old
            version stays valid and cheap to keep, for example as a snapshot.
          source: containers-pkg
      harvest:
        - q: Events are kept in a Map keyed by timestamp, and everything older than a cutoff must be dropped. Which approach fits?
          answer: Split the map at the cutoff and keep the upper part
          distractors:
            - Filter every entry and rebuild the map, as a HashMap would need
            - Scan linearly and delete the old keys one at a time
            - Move to a Set, because a Map cannot be ordered by its keys
          why: >-
            Ordered keys let split (or dropWhileAntitone) cut the tree in O(log n). A HashMap has no order, so it would
            force a full scan.
          source: containers-pkg
  - id: text-bytestring
    name: Text vs ByteString vs String
    layer: shrub
    branch: runtime-and-performance
    tier: 0
    harvest: recall
    minutes: 35
    sources: [text-pkg]
    summary: >-
      Read the text package overview (Data.Text, its note on strict versus lazy types, Data.Text.Encoding) and
      the Data.Text.copy entry; the bytestring docs named in the source note show the same ideas for raw bytes.
      Yield: notes on what each type holds (Unicode text, raw bytes, a linked list of Chars), strict versus lazy
      variants, when you must decode, and the trap where a small slice keeps a huge buffer alive.
    rubric:
      - States what Text, ByteString and String each represent and what each costs
      - Says when to decode or encode, and with which function for untrusted bytes
      - Explains strict versus lazy variants and when lazy ones are used
      - Describes how a slice can retain a large buffer, and the copy that fixes it
    questions:
      water:
        - q: An HTTP body arrives as a ByteString. Before treating it as Text you must…
          answer: Decode it using its encoding, because bytes have no text meaning of their own
          distractors:
            - Do nothing, since the two types convert for free with coerce
            - Unpack it into a String first, which is the shared common type
            - Call length to check that it is not empty
          why: >-
            A ByteString is bytes; Text is validated Unicode. Decoding is where invalid input shows up, so it is also a
            security boundary.
          source: text-pkg
        - q: Why is `String` a poor choice for large volumes of text in a service?
          answer: Each Char sits in its own list cell, costing memory and cache misses
          distractors:
            - String is always lazy, so two strings cannot be compared
            - String supports only ASCII characters, so any other script has to use Text instead
            - String cannot be used as a key in a Map
          why: >-
            A String is a list of boxed Chars, several words per character. Text and ByteString are packed arrays, much
            smaller and friendlier to the cache.
          source: text-pkg
      harvest:
        - q: A cache keeps `T.take 8 body` slices of 100 MB request bodies held as strict Text, and memory never drops. Why, and what is the fix?
          answer: Each slice keeps its whole buffer alive; copy the slice with T.copy
          distractors:
            - Text memory is never collected unless it is freed by hand
            - take returns a lazy Text, so the chunks stay until forced
            - The cache stores a thunk of take, which retains only the length
          why: >-
            A strict Text slice is an offset and length into a shared array, so holding eight characters holds all
            hundred megabytes. Data.Text.copy gives the slice an array of its own and breaks the link. The same trap and
            the same fix exist for ByteString, with Data.ByteString.copy.
          source: text-pkg
  - id: typeclass-laws
    name: Typeclass laws
    layer: ground-cover
    branch: types-and-effects
    tier: 1
    needs:
      - purity
    harvest: recall
    minutes: 35
    sources: [base-pkg]
    summary: >-
      Read the class docs in base for Functor, Semigroup, Monoid, Monad and Ord, including their laws and the
      note on Double's Ord instance. Yield: each law as an equation, one real lawless instance (Double's Ord
      with NaN, or a non-associative Semigroup), and what a refactor is allowed to assume because the laws hold.
    rubric:
      - States the laws of Functor, Semigroup and Monoid as equations
      - Explains what an optimisation or refactor may assume because of a law
      - Gives a real example of an instance that breaks a law
      - Says the compiler does not check laws, so tests or proofs have to
    questions:
      water:
        - q: Which law does `Semigroup` require of `<>`?
          answer: "Associativity: (a <> b) <> c equals a <> (b <> c)"
          distractors:
            - "Commutativity: a <> b equals b <> a"
            - "Idempotence: a <> a equals a for every a"
            - "Identity: some element e exists with e <> a equal to a"
          why: >-
            Only associativity is required, so grouping is free but order is not. Identity is added by Monoid;
            commutativity and idempotence are extra properties some types happen to have.
          source: base-pkg
        - q: A big `foldMap` can be split into chunks and combined as a tree because…
          answer: Associativity lets the grouping of <> change without changing the result
          distractors:
            - Commutativity lets the chunks be combined in any order at all, even right to left
            - The identity element makes empty chunks free to reorder
            - "`<>` is always strict in both of its arguments"
          why: >-
            Chunks must still be combined left to right; what changes is the bracketing. Treating a monoid as
            commutative is the common mistake that breaks ordered results such as lists.
          source: base-pkg
      harvest:
        - q: A Map keyed by Double starts losing lookups once a NaN key is inserted. What is the underlying problem?
          answer: compare treats NaN as greater than every key in both directions, so the key order is inconsistent
          distractors:
            - NaN is hashed to an arbitrary bucket, so the tree files it in an unpredictable place
            - Double has no Ord instance, so Map quietly falls back to Eq and scans every entry
            - Map refuses NaN at insert time and silently drops the entry instead of storing it
          why: >-
            compare x y returns GT whenever neither x < y nor x == y holds, so both compare nan 1 and compare 1 nan
            say GT. That breaks the ordering laws the tree's search depends on, and lookups walk the wrong way. Avoid
            Double keys, or wrap them in a type with a total Ord.
          source: base-pkg
  - id: eval-model
    name: Thunks, WHNF & forcing
    layer: root
    branch: runtime-and-performance
    tier: 1
    needs:
      - laziness
    harvest: recall
    minutes: 40
    sources: [pcph, ghc-strict]
    summary: >-
      Re-read PCPH chapter 2 (WHNF, the Eval monad, deepseq) and the User's Guide section 'Bang patterns and
      Strict Haskell'. Yield: notes on how a thunk is represented and updated, what WHNF means for each kind of
      value, and a table of seq, bang patterns, $!, evaluate, force and deepseq with what each forces and when.
    rubric:
      - Defines weak head normal form for a data constructor and for a function
      - Describes a thunk being evaluated and then overwritten with its value
      - Says what seq, a bang pattern, evaluate and deepseq each force
      - Gives a case where forcing to WHNF is not enough
    questions:
      water:
        - q: "`length [undefined, undefined, undefined]` evaluates to…"
          answer: 3, since length walks the cells without forcing the elements
          distractors:
            - undefined, because length must inspect every element
            - 0, because undefined elements are skipped when counting
            - A type error, because undefined has no known element type
          why: >-
            Weak head normal form of a list only fixes its outer constructor. length pattern matches on the spine and
            never touches the elements.
          source: pcph
        - q: "`seq a b` guarantees…"
          answer: "`a` is evaluated to weak head normal form before `b` is returned"
          distractors:
            - "`a` is evaluated completely, including every nested field"
            - "`a` and `b` are evaluated in parallel on two capabilities"
            - "`b` is evaluated first, then `a`, to find out its type"
          why: seq stops at the outermost constructor; deepseq is the one that walks the whole structure.
          source: pcph
      harvest:
        - q: A decoded record is passed through `evaluate` to catch bad data before caching. Failures still appear later, from inside the cache. What is the gap?
          answer: evaluate forces only to WHNF, so nested fields stay thunks that can throw
          distractors:
            - evaluate runs the thunks on another thread, which dies without reporting
            - evaluate works only on strict ByteString and ignores records
            - evaluate forces the fields but not the outer constructor
          why: >-
            evaluate on a record forces its constructor, not its fields. To surface errors up front, use deepseq/force
            with an NFData instance, or strict fields so construction itself forces them.
          source: pcph
