      Read the User's Guide section 'Bang patterns and Strict Haskell' (BangPatterns, StrictData, Strict) and
      the UNPACK entry in 'Pragmas'. Yield: notes on what a bang on a field or pattern forces, what StrictData
      changes module-wide and how a field opts back out with a tilde, and what UNPACK removes.
    rubric:
      - Says what a strict field forces and when (at construction)
      - Explains what StrictData changes and how to make one field lazy again
      - Explains what UNPACK saves and when it applies
      - Says why strict fields prevent thunk build-up in long-lived state
    questions:
      water:
        - q: "With StrictData on, evaluating `P 1 undefined` for `data P = P Int Int` to WHNF…"
          answer: Throws, because building the constructor forces both fields
          distractors:
            - Returns the P value, and the second field fails only when it is read
            - Compiles with a warning but still evaluates the fields lazily
            - Throws only if the second field is used somewhere later on
          why: >-
            A strict field is evaluated as the constructor is built. That is the point: a bad value is caught where it
            is made, not wherever it is eventually read.
          source: ghc-strict
        - q: "What does a field declared as `{-# UNPACK #-} !Int` save?"
          answer: The separate heap box for the Int, so the number sits inside the constructor
          distractors:
            - The strictness check itself, because unpacked fields are always evaluated lazily
            - The garbage collector's scan of that field during minor collections
            - The need for an NFData instance when the type is forced deeply
          why: >-
            A normal Int field is a pointer to a boxed Int. Unpacking stores the raw machine word inline, saving an
            allocation and an indirection. It needs the field to be strict.
          source: ghc-pragmas
      harvest:
        - q: A `Stats` record with lazy fields lives in a state monad and is updated a million times with `modify'` and record updates such as `s { hits = hits s + 1 }`. Memory climbs. Which single change helps most?
          answer: Turn on StrictData, or bang the fields, so each update stores a value
          distractors:
            - Mark the state with a lazy tilde pattern so it is collected sooner
            - Use the lazy variant of the state monad, which frees old states earlier
            - Replace the record with a tuple, which is always evaluated
          why: >-
            modify' only forces the record to its outer constructor. The fields remain thunks unless they are strict,
            which is why StrictData is the usual default for state types.
          source: ghc-strict
  - id: vectors
    name: Vector & unboxed arrays
    layer: shrub
    branch: runtime-and-performance
    tier: 1
    needs:
      - containers
    harvest: recall
    minutes: 35
    sources: [vector-pkg]
    summary: >-
      Read the vector package docs: Data.Vector (boxed), Data.Vector.Unboxed, Data.Vector.Storable, the Mutable modules
      and the fusion notes. Yield: notes on what each flavour stores, bounds-checked versus unsafe indexing, how
      freeze and thaw copy, and when a Map is still the better structure.
    rubric:
      - Distinguishes boxed, unboxed and storable vectors by what they store
      - Says why appending one element at a time is a trap
      - Explains freeze, thaw and unsafeFreeze with respect to copying
      - Names a case where a vector is wrong and a Map or list is better
    questions:
      water:
        - q: "`Data.Vector.Unboxed` of `Double` differs from boxed `Data.Vector` of `Double` by…"
          answer: Storing raw numbers in one flat array, with no pointers to boxed values
          distractors:
            - Allowing lazy elements, so unevaluated thunks can sit in the slots of the array
            - Using a linked list of chunks that grows as elements are added
            - Requiring every element to have an NFData instance
          why: >-
            A boxed vector holds pointers to heap values, which may be thunks. An unboxed one holds the numbers
            themselves, evaluated, which is smaller and much friendlier to the cache.
          source: vector-pkg
        - q: Building a vector one element at a time with `snoc` in a loop of n steps costs about…
          answer: O(n squared), because each snoc copies the vector
          distractors:
            - O(n log n), as it rebalances a tree on every append
            - O(n), since snoc amortises like a growable array
            - O(n) only when the vector is unboxed
          why: >-
            Vectors are immutable arrays, so snoc allocates a new one and copies. Build with generate, fromList,
            unfoldr or a mutable vector in ST, and freeze it once.
          source: vector-pkg
      harvest:
        - q: A hot loop sums a million Doubles from a boxed `Vector Double` and allocates heavily. Which change is the most direct fix?
          answer: Switch to Data.Vector.Unboxed and sum with a strict fold
          distractors:
            - Convert the vector to a list so that fusion can remove the loop
            - Use lazy foldl so elements are not forced until the end
            - Add an UNPACK pragma on the vector argument of the function
          why: >-
            The boxed vector makes the loop chase pointers to separate Double boxes. Unboxed storage keeps the numbers
            in one array and lets the fold run without allocating per element.
          source: vector-pkg
  - id: readert-pattern
    name: ReaderT & handle patterns
    layer: understory
    branch: types-and-effects
    tier: 2
    needs:
      - bracket
      - newtypes-deriving
    harvest: judged
    minutes: 45
    sources: [readert-pattern, three-layer-cake]
    summary: >-
      Read FP Complete's The ReaderT Design Pattern end to end (especially 'Better globals', 'Avoiding WriterT
      and StateT' and 'Has typeclass approach'), then Layer 1 of Three Layer Haskell Cake. Yield: notes on why
      mutable state lives in IORef or TVar fields of the Env, how helpers run actions across threads, and how a
      test swaps one capability, a function in the Env or a small record of functions, for a fake.
    rubric:
      - Shows an Env record that holds configuration, resources and mutable references
      - Explains why state lives in references rather than StateT (exceptions and forked threads)
      - Shows how a handle, a record of functions, lets a test replace one capability
      - Names a cost, such as a growing Env or functions that hide which capabilities they use
    prompts:
      - >-
        Sketch a ReaderT Env IO design for an order service. List what goes in Env, which functions take a narrow
        handle instead of the whole Env, and how a test replaces the payment client. Explain one failure that a StateT
        stack would have caused.
      - >-
        You inherit a service with a four-layer transformer stack. Argue for or against flattening it to ReaderT Env
        IO, naming what you gain, what you lose, and how you would migrate one endpoint first.
    questions:
      water:
        - q: In `ReaderT Env IO`, where do configuration and mutable state live?
          answer: In the Env record, with mutable state held in IORef or TVar fields
          distractors:
            - In the monad's state, which each action threads on to the next
            - In global variables created once with unsafePerformIO
            - In the ReaderT type parameter, rewritten by local per request
          why: >-
            The reader layer only passes the Env down. Anything that must change is a mutable reference inside it,
            which every thread holding the Env shares.
          source: readert-pattern
        - q: Why does the pattern keep state in a TVar or IORef instead of StateT when handlers can be cancelled?
          answer: A StateT update is lost when an exception unwinds past it
          distractors:
            - StateT cannot be placed on top of IO at all
            - An IORef is faster than StateT in every possible case
            - StateT values are collected as soon as a handler returns
          why: >-
            With StateT the new state is a return value. If an exception or cancellation cuts the computation, the
            value never reaches the caller. A reference is updated in place, so effects done before the exception remain.
          source: readert-pattern
  - id: async-exceptions
    name: Async exceptions & timeouts
    layer: vine
    branch: types-and-effects
    tier: 2
    needs:
      - bracket
    harvest: judged
    minutes: 50
    sources: [pcph, base-pkg, ghc-optimisation]
    summary: >-
      Read PCPH chapter 9 (Cancellation and Timeouts), especially 'Catching Asynchronous Exceptions' and
      'Timeouts', then chapter 11 ('Symmetric Concurrency Combinators', 'Timeouts Using race'), the
      System.Timeout docs in base and the -fomit-yields entry in the User's Guide optimisation flags. Yield:
      notes on how throwTo delivers an exception, what mask protects, why a catch-all SomeException handler is
      dangerous, and how timeout and race cancel work.
    rubric:
      - Explains that timeout, killThread and cancel work by throwing an asynchronous exception
      - Explains what mask does and that blocking operations are still interruptible
      - Says why a catch-all handler can swallow cancellation and how to avoid that
      - States a limit, such as non-allocating loops or uninterruptible foreign calls
    prompts:
      - >-
        Write fetchWithDeadline, which calls two upstream services at once, returns the first answer, cancels the
        other, and closes its HTTP connection even when cancelled mid-request. Say which exceptions your handlers must
        never swallow.
      - >-
        A request handler wraps work in a handler that catches SomeException, logs it and returns a default. Explain,
        step by step, how this breaks client disconnects and deploy shutdowns, and write the fix.
    questions:
      water:
        - q: A handler catches `SomeException`, logs it and carries on. The server cancels the thread when a client disconnects. What goes wrong?
          answer: The cancellation is swallowed and the thread keeps running
          distractors:
            - The log call itself throws, so the thread dies without cleanup
            - The handler's finalisers are skipped, which leaks the connection
            - The cancel exception is re-thrown to the whole server process
          why: >-
            Cancellation arrives as an asynchronous exception, and SomeException matches it. If the handler treats it
            as an ordinary failure and continues, the thread outlives the request it was cancelled for.
          source: pcph
        - q: "`timeout 1000000 action` returns Nothing after one second by…"
          answer: Throwing an asynchronous exception to the thread running the action
          distractors:
            - Killing the OS thread that is running the action
            - Setting a flag that the action must poll often enough to notice the deadline
            - Running the action in a child process that is killed on expiry
          why: >-
            timeout arranges for a private exception to be thrown to your thread when the timer fires. Cleanup in
            bracket and finally still runs, but code that never allocates or sits in a foreign call may not notice for a while.
          source: base-pkg
        - q: In `race a b`, when `a` finishes first, what happens to `b`?
          answer: It is cancelled with an asynchronous exception and its cleanup runs
          distractors:
            - It keeps running in the background and its result is simply dropped when it finishes
            - It is paused until the caller asks for its result
            - It restarts from the beginning on another thread
          why: >-
            race, concurrently and withAsync tie the lifetimes of their threads together, so a loser or a failed sibling
            is cancelled instead of leaking, as long as its code respects async exceptions.
          source: pcph
  - id: property-testing
    name: "Property testing: QuickCheck & Hedgehog"
    layer: vine
    branch: types-and-effects
    tier: 2
    needs:
      - typeclass-laws
    harvest: judged
    minutes: 50
    sources: [quickcheck-pkg]
    summary: >-
      Read the QuickCheck docs on Hackage (Arbitrary and shrink, forAll, ==>, classify, cover, checkCoverage),
      then skim Hedgehog's integrated shrinking for the contrast. Yield: notes on how a generator and its
      shrinker interact, how shrinking finds a small counterexample, why discard-heavy preconditions fail, and
      one property of each shape you write yourself (round trip, idempotence, invariant, model).
    rubric:
      - Writes at least three properties of different shapes
      - Explains how a generator produces valid and interesting inputs
      - Explains shrinking and what a good minimal counterexample looks like
      - States what properties cannot show, since they sample inputs
    prompts:
      - >-
        Pick a pure function in a service you know (a parser, a price calculator, a state machine). Write three
        properties of different shapes, say which bug each could catch, and describe what a shrunk counterexample for
        one would look like.
      - >-
        A property using ==> keeps reporting that it gave up. Explain why, show how to build the generator so it
        produces only valid inputs, and add a cover check so you know the interesting cases are being reached.
    questions:
      water:
        - q: A property passes its 100 tests, but you suspect the generator mostly produces empty lists. Which QuickCheck combinator warns when too few non-trivial cases occur?
          answer: "`cover`, which checks that a stated share of tests lands in a named class"
          distractors:
            - "`once`, which runs the property a single time on a hand-picked input"
            - "`shrink`, which reports the smallest value the generator can produce"
            - "`expectFailure`, which downgrades a failing property to a warning"
          why: >-
            classify and label only count cases. cover also states the share you require and prints a warning when a run
            falls short; checkCoverage turns that warning into a failure. It guards against a green run that never
            reached the interesting inputs.
          source: quickcheck-pkg
        - q: A QuickCheck type has an invariant, such as a sorted list. Why can a hand-written `shrink` for it mislead you?
          answer: Shrinking is separate from generation, so it can produce values the generator never would
          distractors:
            - shrink runs only on inputs that passed, so it never sees a failing value
            - shrink is limited to one step, so it cannot reduce a failure below its first candidate
            - shrink replaces the random seed, so the same failure is not reproducible
          why: >-
            A failing input is reduced by trying whatever shrink returns, and nothing forces those candidates to obey
            the generator's invariant. A failure on an unsorted list may then be reported for a value that could never
            occur. Hedgehog avoids this by building shrinks into the generator itself.
          source: quickcheck-pkg
        - q: A property uses `==>` with a precondition that fewer than one input in a hundred satisfies, and QuickCheck gives up. The fix is to…
          answer: Build a generator that produces valid inputs directly
          distractors:
            - Raise the number of tests until enough inputs happen to pass
            - Wrap the property in once so that it runs a single time
            - Replace ==> with when, which silently discards bad inputs
          why: >-
            Filtering random values wastes almost every case. Generating valid data by construction (for example from a
            smart constructor) keeps each test useful and avoids hidden bias.
          source: quickcheck-pkg
  - id: type-driven-design
    name: "Type-driven design: parse, don't validate"
    layer: understory
    branch: types-and-effects
    tier: 2
    needs:
      - newtypes-deriving
      - error-values
      - typeclass-laws
    harvest: judged
    minutes: 50
    sources: [parse-dont-validate]
    summary: >-
      Read Alexis King's Parse, don't validate in full, especially 'Turning partial functions total', 'The power
      of parsing' and 'The danger of validation'. Yield: notes on the difference between a check that returns
      unit or Bool and one that returns a stronger type, the NonEmpty example, shotgun parsing, and how smart
      constructors keep an invariant true everywhere.
    rubric:
      - Moves checks to one boundary step that returns a more precise type or an error
      - Uses types such as NonEmpty, newtypes or sum types so an illegal state cannot be built
      - Hides constructors behind smart constructors or abstract modules where needed
      - Names a rule that types cannot enforce and says where it is checked instead
    prompts:
      - >-
        A checkout endpoint accepts a JSON cart with items (non-empty), quantities (positive), a currency and an optional
        discount code. Design the Haskell types and the single parsing step so that downstream code never re-validates.
        Show one illegal state that is now unrepresentable and one rule you could not encode.
      - >-
        Take a module in a codebase you know that has Bool-returning validators. Show how you would replace one with a
        parser, what callers gain, and what the migration costs.
    questions:
      water:
        - q: "Why is `validateEmail :: Text -> Bool` weaker than `parseEmail :: Text -> Either Err Email`?"
          answer: The Bool throws away what was learned, so later code must re-check or trust
          distractors:
            - Bool cannot express failure at all, so only Either can say that a check failed
            - validateEmail runs slower, because it examines every character twice
            - Functions that return Bool cannot be covered by unit tests
          why: >-
            After parseEmail succeeds, the Email type is evidence the check happened. After validateEmail returns True,
            the value is still plain Text, so every later function must either trust it or check again.
          source: parse-dont-validate
        - q: What is 'shotgun parsing'?
          answer: Checks scattered through processing code, so bad input is caught late
          distractors:
            - Parsing the same input in parallel to find the fastest parser
            - Using one huge regular expression to cover every field of the input at once
            - Trying several encodings on the input until one of them succeeds
          why: >-
            Mixing validation with processing means some of the work, and some effects, may already have happened when
            a late check fails. Parse everything first, then act on the typed result.
          source: parse-dont-validate
  - id: streaming
    name: Streaming with conduit
    layer: understory
    branch: runtime-and-performance
    tier: 2
    needs:
      - leaks
      - folds
    harvest: judged
    minutes: 45
    sources: [conduit-pkg, base-pkg]
    summary: >-
      Read the conduit package page on Hackage (its README sections 'Evaluation strategy' and 'Resource
      allocation') and the hGetContents entry in base's System.IO. Yield: notes on why lazy IO leaks handles and
      hides errors, how a conduit pipeline pulls bounded chunks from source to sink, and how ResourceT or
      bracket guarantees cleanup. The same ideas apply to streaming or pipes.
    rubric:
      - Shows data pulled in bounded chunks from source through transforms to sink
      - Explains where each resource is opened and guaranteed closed
      - Says where an error in the middle surfaces and what cleanup follows
      - Names a measurement, such as max residency or a heap profile, that shows memory is flat
    prompts:
      - >-
        Sketch a pipeline that reads a 10 GB CSV, filters rows and writes JSON lines to numbered part files without
        holding more than a few chunks in memory. Say where errors surface, where files close, and what you would
        measure to prove memory stays flat.
      - >-
        Explain why `mapM` over a very large list in IO can exhaust memory, how a streaming version differs, and what
        you give up by streaming (random access, simplicity).
    questions:
      water:
        - q: Why is lazy IO such as `hGetContents` risky in a long-running service?
          answer: The handle stays open until the data is consumed, and read errors surface late
          distractors:
            - It reads the entire file into memory before it returns anything to the caller, so it cannot stream
            - It opens a new file handle for every character it produces
            - It cannot read files larger than two gigabytes
          why: >-
            The string is produced on demand, so the file stays open until the last byte is read, and a read failure
            appears wherever the data is later forced. Streaming libraries make open, read and close explicit.
          source: base-pkg
        - q: A conduit pipeline copies a 20 GB file through a transform in constant memory because…
          answer: Chunks are pulled one at a time and each is released before the next
          distractors:
            - It memory-maps the file and lets the OS page it in and out
            - The GC treats the stream as weak references and drops it
            - Chunks are compressed in memory as they arrive
          why: >-
            The sink asks the pipeline for the next piece only when it is ready, so at most a few chunks are alive at
            once. That pull-based demand is also what gives back-pressure.
          source: conduit-pkg
  - id: profiling-eventlog
    name: Profiling & the eventlog
    layer: vine
    branch: runtime-and-performance
    tier: 2
    needs:
      - leaks
    harvest: judged
    minutes: 50
    sources: [ghc-profiling, ghc-rts, pcph]
    summary: >-
      Read the User's Guide chapter on profiling (cost centres, -p, -hc, -hT, -hi), the RTS options -s, -S and
      -l, then PCPH chapter 15, 'Event Logging and ThreadScope'. Yield: a table of which tool answers which
      question (time, allocation, residency, scheduling), and notes on how a profiling build distorts
      optimisation.
    rubric:
      - Picks the right tool for the question (time profile, heap profile, eventlog)
      - Reads a heap profile band or a cost-centre entry correctly
      - Acknowledges profiling overhead and how cost centres change optimisation
      - Shows a before and after measurement, not a feeling
    prompts:
      - >-
        Write a small program with a leak or a hot loop. Capture a heap profile and an eventlog, say what each shows,
        fix the problem, and report before and after numbers (max residency, GC time, allocation).
      - >-
        Your production binary is not built with -prof. List what you can still learn about a memory problem from
        the RTS alone, and what you would add to the build first.
    questions:
      water:
        - q: Which RTS flag produces a heap profile by closure type without a profiling build?
          answer: "-hT"
          distractors:
            - "-hc"
            - "-hy"
            - "-hd"
          why: >-
            -hc, -hy and -hd need cost-centre information from a profiling build. -hT only counts closures by type, so
            it works on an ordinary optimised binary, which is handy in production.
          source: ghc-profiling
        - q: A `-prof -fprof-auto` build blames a function, but tuning it does not speed up the production binary. A likely reason is…
          answer: Cost centres block inlining and other optimisations, so the profile is skewed
          distractors:
            - Profiling builds use a different garbage collector with other timings than normal builds
            - A profile counts only the time spent inside the garbage collector
            - "-fprof-auto drops every function shorter than ten lines"
          why: >-
            Cost centres sit between expressions and stop GHC from inlining and fusing them, so the profiled program is
            not the optimised one. Use selective cost centres or the eventlog when you need fidelity.
          source: ghc-profiling
        - q: Which tool shows when each capability was running, idle or collecting garbage over time?
          answer: ThreadScope reading an eventlog written with -l
          distractors:
            - A `.prof` report produced by +RTS -p
            - The `+RTS -s` summary printed when the program exits
            - A heap profile from -hc
          why: >-
            The eventlog records scheduler and GC events with timestamps per capability, so you can see idle gaps and
            long pauses. Other outputs are totals and cannot show when something happened.
          source: pcph
  - id: specialise-inline
    name: Inlining & specialisation
    layer: root
    branch: runtime-and-performance
    tier: 2
    needs:
      - eval-model
    harvest: judged
    minutes: 50
    sources: [ghc-pragmas, ghc-optimisation, base-pkg]
    summary: >-
      Read the User's Guide on the INLINE, INLINABLE, NOINLINE and SPECIALIZE pragmas, and the -fspecialise,
      -fcross-module-specialise and -fexpose-all-unfoldings flag entries. Add the NOINLINE advice in base's
      System.IO.Unsafe. Yield: notes on what dictionary passing costs, how specialisation removes it, why cross-
      module calls need an exposed unfolding, and when NOINLINE is required.
    rubric:
      - Explains dictionary passing as the cost of unspecialised class-polymorphic code
      - Names the pragma or flag used and why it works across modules
      - Points to evidence in Core, such as a specialised copy or missing dictionary arguments
      - States a cost or risk, such as code size, compile time or a missing NOINLINE
    prompts:
      - >-
        Take a small overloaded function (a generic sum, or an mtl-style loop with a MonadState constraint). Compile
        with -O2, dump the Core, show the dictionary passing, add a pragma or a concrete type, show the Core again and
        explain what changed and what it cost.
      - >-
        A library exports a polymorphic function that is slow at Int in an application. Explain three ways to fix it
        (library side, application side, build flags) and the trade-offs of each.
    questions:
      water:
        - q: A polymorphic `Num a =>` library function is slow when other modules call it at Int. Which pragma lets any importing module specialise it?
          answer: INLINABLE, which keeps its unfolding available across modules
          distractors:
            - NOINLINE, which stops GHC from copying the function body anywhere
            - SCC, which makes GHC share one dictionary between all callers
            - UNPACK on the dictionary argument of the function
          why: >-
            Specialisation needs the function's body at the call site. INLINABLE exports it without forcing inlining,
            so each importer can create a copy for the types it uses.
          source: ghc-pragmas
        - q: Why does a top-level `counter = unsafePerformIO (newIORef 0)` need a NOINLINE pragma?
          answer: Inlining would duplicate the newIORef call and create several separate counters
          distractors:
            - Without it GHC would evaluate the IORef at compile time
            - Top-level IO actions are otherwise run once for every thread that happens to use them
            - The pragma is what makes the IORef atomic
          why: >-
            counter is an expression, and the optimiser may copy an expression into each use. Each copy then runs
            newIORef afresh. NOINLINE keeps one shared definition.
          source: base-pkg
