    questions:
      water:
        - q: GHC compiles a strict loop `go acc n` over Ints into a worker taking `Int#`. The benefit is…
          answer: No Int box is allocated per iteration, so the loop does not allocate
          distractors:
            - The loop is run in parallel across capabilities
            - The arguments are evaluated lazily and then shared between calls of the loop
            - The loop is evaluated at compile time and removed
          why: >-
            The wrapper evaluates and unpacks the arguments once; the worker then loops on raw machine integers in
            registers. Without the split, each iteration would allocate a fresh boxed Int.
          source: ghc-optimisation
        - q: A function returns its second argument only when the first is positive. Why can GHC not pass that second argument unboxed?
          answer: It is not strict in that argument, so evaluating it early might diverge
          distractors:
            - Unboxed arguments must come first in a function's argument list
            - Only the first argument of a function can ever be unboxed
            - Unboxing is allowed only for functions marked INLINE
          why: >-
            Unboxing means evaluating the argument before the call. If some paths never use it, evaluating it early
            could loop or throw where the original would not, so GHC must keep it as a possibly-unevaluated pointer.
          source: ghc-optimisation
