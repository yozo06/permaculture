      - Describes the wrapper and worker split and why the worker takes unboxed arguments
      - Spots boxed allocation in Core ($w names, I# and D# constructors) and a fix
      - Mentions CPR or strict fields as related ways to avoid boxing results
    prompts:
      - >-
        Write a loop over a list of Doubles that computes mean and variance. Compile with -O2, dump Core, and find the
