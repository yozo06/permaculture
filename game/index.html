<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Permaculture: a farm game where the crops are the things you are learning.">
<title>Permaculture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen farm game. Pixel-art isometric world in the middle (drag to pan), a wooden HUD above, an action bar below, cards float over the farm. Single committed look (a game), no light/dark split. */
:root{
  --sky:#8FC8E8;
  --ink:#1A1610; --panel:#2B2318; --panel-2:#3B3020; --line:#5C4A2E; --line-2:#7A6340;
  --cream:#F4EAD0; --muted:#C6B48E; --dim:#8F7F60;
  --green:#6DB24F; --ochre:#E0A93E; --blue:#5FA8C9; --purple:#B089D6; --red:#D9534F; --water:#4FA3E8;
  --font-display:'Pixelify Sans','DM Sans',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical;background:var(--ink);color:var(--cream);border:1px solid var(--line-2);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
input[type=file]{color:var(--muted);font-size:13px}
body{background:var(--ink);color:var(--cream);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.game{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 14px}
.logo{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--green);margin-right:auto}
.stat{display:flex;align-items:center;gap:8px;font-size:13px}
.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.stat .v{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;min-width:2ch}
.meter{width:90px;height:10px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);width:100%;transition:width .3s}
.stage{position:relative;width:100%;background:var(--sky);border:2px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:480/300;max-width:100%}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.night{position:absolute;inset:0;background:#0A0F2A;opacity:0;pointer-events:none;transition:opacity .7s}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(26,22,16,.92);color:var(--cream);border:1px solid var(--line-2);border-radius:6px;padding:8px 12px;font-size:13px;max-width:min(90%,420px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.corner{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.corner button{min-height:32px;padding:0 10px;font-size:12px;background:rgba(26,22,16,.8)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 14px}
.hint{flex:1 1 240px;min-width:0;font-size:13px;color:var(--muted);line-height:1.4}
.hint b{color:var(--cream);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font-family:var(--font-body);font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:6px;border:2px solid var(--line-2);background:var(--panel-2);color:var(--cream);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button.pri{background:var(--green);border-color:#4C8A36;color:#10200C}
button.pri:hover{background:#7CC25E}
button:disabled{opacity:.6;cursor:default}
.veil{position:fixed;inset:0;background:rgba(10,8,5,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.veil[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line-2);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.sheet h3{font-family:var(--font-display);font-size:16px;margin:8px 0 0;font-weight:600;color:var(--green)}
.sheet p{margin:0;line-height:1.5}
.sheet ul{margin:0;padding-left:18px;line-height:1.5;font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#10200C;background:var(--c,var(--green))}
.q{font-size:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;min-height:48px;padding:10px 14px;font-weight:500;line-height:1.35}
.opts button.ok{background:#2F5A24;border-color:var(--green)}
.opts button.bad{background:#5A2622;border-color:var(--red)}
.opts button:disabled{cursor:default;opacity:.85}
.res{padding:12px 14px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);font-size:14px;line-height:1.5}
.res b{font-family:var(--font-display);font-size:17px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row .n{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .n small{color:var(--muted);font-size:12px}
.row button{min-height:36px;padding:0 12px;font-size:13px;flex:none}
.row.locked{opacity:.6}
.fh{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:16px;margin-top:6px}
.fh i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--dim);font-weight:500;min-height:36px;padding:0 4px;text-decoration:underline}
.link:hover{color:var(--muted);border:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:34px;padding:0 10px;font-size:13px}
.tabs button.on{border-color:var(--cream)}
.tree{width:100%;height:auto;display:block;background:var(--ink);border:1px solid var(--line);border-radius:8px}
.branches{display:flex;gap:8px;flex-wrap:wrap}
.branches button{flex:1 1 150px;min-height:38px;font-size:13px}
.find{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.night,.toast,.meter i{transition:none}}
</style>
</head>
<body>

<div class="game">
  <header class="hud" aria-label="Farm status">
    <div class="logo">PERMACULTURE</div>
    <div class="stat"><span class="k">Day</span><span class="v" id="hDay">12</span></div>
    <div class="stat"><span class="k">Energy</span><div class="meter" aria-hidden="true"><i id="hEnergy"></i></div><span class="v" id="hEnergyT">90</span></div>
    <div class="stat"><span class="k">Coins</span><span class="v" id="hCoins">140</span></div>
    <div class="stat"><span class="k">Rain barrel</span><span class="v" id="hBarrel">2</span></div>
  </header>

  <div class="stage">
    <canvas id="c" width="480" height="300" aria-label="Isometric farm. Drag to look around. Tap crops to water or harvest them."></canvas>
    <div class="corner"><button type="button" id="bHome">Centre</button></div>
    <div class="night" id="night"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <footer class="bar">
    <div class="hint" id="hint"><b>Drag</b> to look around. Tap a crop with a <b>droplet</b> to water it, <b>sparkles</b> to harvest. Tap the forest to forage. Tap land beside a field to fence it in.</div>
    <div class="acts">
      <button type="button" id="bAlm">Almanac</button>
      <button type="button" id="bTree">Learning tree</button>
      <button type="button" id="bBag">Seed bag</button>
      <button type="button" id="bSleep" class="pri">Sleep</button>
    </div>
  </footer>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
const W=480,H=300,TH=16,N=20;
const HOME={x0:4,y0:4,x1:15,y1:15};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

/* ---------- world ---------- */
const FIELDS={
  hs:{name:'Haskell',color:'#6DB24F',x0:5,y0:5,branches:['Runtime & performance','Types & effects']},
  sd:{name:'System design',color:'#E0A93E',x0:12,y0:5,branches:['Distributed data','Traffic & resilience']},
  inf:{name:'Infra',color:'#5FA8C9',x0:5,y0:12,branches:['Network & platform','Data & reliability']},
  kn:{name:'Kannada',color:'#B089D6',x0:12,y0:12,branches:['Words','Grammar & script']}
};
const BARN={x:9,y:4},WELL={x:15,y:9},COMPOST={x:15,y:10},SIGN={x:8,y:8};
const BLOCKED=new Set(['9,4','10,4','9,5','10,5','15,9','15,10','8,8']);

/* Seeds. First answer in `a` is the correct one; options are shuffled on screen. b = branch index, tier = depth in the tree. */
const TOPICS=[
 {id:'laziness',f:'hs',b:1,tier:0,name:'Laziness model',layer:'Ground cover',
  q:[{q:'`let xs = [1..] in take 3 xs` works because…',a:['Lists are built lazily; only the demanded cons cells get evaluated','GHC detects infinite lists and truncates them','take forces the whole list first','[1..] is special finite syntax'],why:'Thunks are evaluated on demand; take only pattern-matches three cells.'}]},
 {id:'stm',f:'hs',b:1,tier:1,name:'STM retry',layer:'Shrub',
  q:[{q:'Inside an STM transaction, what does `retry` do?',a:['Blocks until a TVar it read changes, then re-runs the transaction','Re-runs the transaction immediately in a busy loop','Throws an exception to the caller','Commits the writes made so far'],why:'retry parks the thread and wakes it when any TVar read so far is written by another transaction.'}],
  h:[{q:'Why can you not run IO inside `atomically`?',a:['A transaction may run several times before committing, so effects would repeat','IO is too slow for the STM scheduler','The runtime has no way to time IO','STM runs only on the main thread'],why:'Transactions are optimistic and can be re-executed; IO effects cannot be rolled back.'}]},
 {id:'bracket',f:'hs',b:1,tier:1,name:'bracket & cleanup',layer:'Herb',
  q:[{q:'`bracket acquire release use` runs `release` when…',a:['`use` finishes, throws, or the thread gets an async exception','Only when `use` returns normally','Only on asynchronous exceptions','Only if `acquire` failed'],why:'bracket masks async exceptions during acquire/release and always runs release.'}],
  h:[{q:'What does `mask` change for the `acquire` step?',a:['Async exceptions are deferred until an interruptible op or unmask','Sync exceptions are swallowed','GC is paused for the duration','Nothing; mask only affects release'],why:'Without mask, a Ctrl-C between acquire and the handler install would leak the resource.'}]},
 {id:'gc',f:'hs',b:0,tier:1,name:'GC generations',layer:'Root',
  q:[{q:"GHC's default garbage collector is…",a:['A generational copying collector','Reference counting','Mark-and-sweep only','There is no GC; memory is arena-allocated'],why:'Young objects live in the nursery and get copied to the old generation if they survive.'}],
  h:[{q:'Raising -A (nursery size) usually means…',a:['Fewer minor GCs, more memory per capability','More minor GCs, less memory','No change to GC frequency','The old generation shrinks'],why:'A bigger nursery fills more slowly, so minor collections are rarer; cost is memory and cache locality.'}]},
 {id:'leaks',f:'hs',b:0,tier:1,name:'Space leaks',layer:'Root',
  q:[{q:'The classic `foldl` space leak happens because…',a:['The lazy accumulator builds a chain of thunks before anything is forced','The list is evaluated strictly up front','Too many capabilities run the fold','foldl allocates a new list per step'],why:"foldl' (or a bang on the accumulator) forces each step and keeps memory flat."}],
  h:[{q:'Which RTS flag gives you a heap profile broken down by cost centre?',a:['-hc','-s','-N','-A64m'],why:'-hc profiles by cost centre; -hy by type, -hd by closure description.'}]},
 {id:'rts',f:'hs',b:0,tier:2,name:'Threaded RTS',layer:'Root',needs:['gc'],
  q:[{q:'`-N4` with the threaded runtime gives you…',a:['4 capabilities: OS threads that run Haskell threads in parallel','4 green threads','4 separate heaps with no sharing','Nothing unless you also use forkOS'],why:'Capabilities are the parallel slots; green threads are multiplexed onto them.'}]},
 {id:'lockfree',f:'hs',b:1,tier:2,name:'Lock-free structures',layer:'Shrub',needs:['stm'],
  q:[{q:'A compare-and-swap loop can starve a thread because…',a:['Another thread keeps winning the CAS, so it never commits','CAS takes a global lock','The GC blocks CAS','CAS only works on 8-bit values'],why:'Lock-free guarantees system progress, not per-thread progress; that is wait-free.'}]},
 {id:'gadts',f:'hs',b:1,tier:2,name:'GADTs & type-level',layer:'Ground cover',needs:['laziness'],
  q:[{q:'A GADT lets a constructor…',a:['Refine the type parameter, so pattern matching learns type information','Have more than one name','Be used at the kind level only','Skip the type checker'],why:'`eval :: Expr Int -> Int` is safe because matching on `IntLit` refines `a ~ Int`.'}]},
 {id:'effects',f:'hs',b:1,tier:3,name:'Effect systems',layer:'Canopy',needs:['gadts','bracket'],
  q:[{q:'The ReaderT-over-IO pattern avoids…',a:['Deep transformer stacks and their lifting overhead','All use of IO','Exceptions entirely','The need for a configuration record'],why:'One ReaderT Env IO layer; capabilities live in the Env.'}]},
 {id:'nonmoving',f:'hs',b:0,tier:3,name:'Non-moving GC',layer:'Root',needs:['rts'],wild:true,
  q:[{q:"GHC's non-moving collector mainly reduces…",a:['Pause times for the old generation','Allocation cost','Thunk creation','Binary size'],why:'Enable with --nonmoving-gc; throughput can drop slightly.'}]},

 {id:'cap',f:'sd',b:0,tier:0,name:'CAP & consistency',layer:'Ground cover',
  q:[{q:'Under a network partition, a CP system…',a:['Refuses some requests rather than return stale or divergent data','Keeps serving every request from any node','Switches to eventual consistency automatically','Loses data'],why:'PACELC adds: even without a partition, you trade latency for consistency.'}]},
 {id:'con',f:'sd',b:0,tier:0,name:'Consistent hashing',layer:'Ground cover',
  q:[{q:'The main benefit of consistent hashing over `hash mod N`?',a:['Adding or removing a node remaps only about 1/N of the keys','Hashing becomes faster','Collisions become impossible','Keys come out sorted'],why:'Keys map to points on a ring; only the arc next to the new node moves.'}],
  h:[{q:'Why add virtual nodes to the ring?',a:['To even out load when nodes are few or unequal in size','To encrypt the keys','To cut memory use','To avoid hashing entirely'],why:'Each physical node gets many ring positions, smoothing the arcs it owns.'}]},
 {id:'replication',f:'sd',b:0,tier:1,name:'Replication',layer:'Shrub',needs:['cap'],
  q:[{q:'Leader-based replication with async followers risks…',a:['Acknowledged writes being lost if the leader fails before followers catch up','Double writes','Followers overwriting the leader','Nothing; it is equivalent to sync'],why:'Semi-sync (one follower acks) is the usual middle ground.'}]},
 {id:'raft',f:'sd',b:0,tier:1,name:'Raft',layer:'Root',needs:['con'],
  q:[{q:'In Raft, a log entry is committed when…',a:['It is replicated on a majority and the leader has applied an entry from its current term','The leader has written it locally','Any follower acknowledges it','The client receives an acknowledgement'],why:'Majority replication plus a current-term entry prevents an old entry from being committed by a stale leader.'}]},
 {id:'cell',f:'sd',b:0,tier:2,name:'Cell architecture',layer:'Canopy',needs:['replication','raft'],
  q:[{q:'Cell-based architecture limits blast radius by…',a:['Running many small, independent copies of the whole stack, each serving a slice of customers','Caching everything at the edge','Using one very large database','Moving all logic to the client'],why:'A bad deploy or a hot tenant takes down one cell, not the fleet.'}]},
 {id:'bp',f:'sd',b:1,tier:0,name:'Backpressure',layer:'Understory',
  q:[{q:'Backpressure is…',a:['A consumer signalling a producer to slow down','Retrying failed requests with jitter','Caching responses near the client','Spreading requests across replicas'],why:'Bounded queues, pull-based streams and TCP windows are all backpressure.'}],
  h:[{q:'A bounded queue before a slow worker fills up. Safest failure for a payments API?',a:['Reject new work fast with 503 and Retry-After','Grow the queue without bound','Drop the oldest requests silently','Block the accept loop until space frees'],why:'Fast rejection keeps latency bounded and lets callers back off; unbounded queues turn into memory and timeout failures.'}]},
 {id:'rl',f:'sd',b:1,tier:1,name:'Rate limiting',layer:'Herb',needs:['bp'],
  q:[{q:'A token bucket allows…',a:['Bursts up to the bucket size while enforcing an average rate','No bursts at all','Unlimited rate when the bucket is empty','Only fixed one-second windows'],why:'Tokens refill at the rate; a full bucket is the burst allowance.'}],
  h:[{q:'Fixed-window counters suffer from…',a:['Up to 2× the limit across a window boundary','Too much memory per client','Clock drift only','Nothing; they are exact'],why:'A burst at the end of one window plus one at the start of the next doubles the real rate.'}]},
 {id:'idem',f:'sd',b:1,tier:1,name:'Idempotency & outbox',layer:'Understory',needs:['bp'],
  q:[{q:'A transactional outbox solves…',a:['Writing to the DB and publishing an event atomically, so neither is lost','Slow queries','Duplicate consumers','Schema migrations'],why:'The event row commits with the business row; a relay publishes it afterwards, at-least-once.'}]},
 {id:'fpaxos',f:'sd',b:0,tier:2,name:'Flexible Paxos',layer:'Root',needs:['raft'],wild:true,
  q:[{q:'Flexible Paxos relaxes…',a:['The rule that election and replication quorums are both majorities; they only need to intersect','The need for a leader','Log ordering','Durability'],why:'Replicate to 2 of 5, elect with 4 of 5: faster steady state, slower failover.'}]},
 {id:'jump',f:'sd',b:0,tier:1,name:'Jump hash',layer:'Ground cover',needs:['con'],wild:true,
  q:[{q:'Compared with a hash ring, jump consistent hash gives up…',a:['Arbitrary node names and removal from the middle; buckets are numbered 0..n−1','Uniform key distribution','Speed','Determinism'],why:'Great for sharding where you only ever grow or shrink from the end.'}]},

 {id:'tcp',f:'inf',b:0,tier:0,name:'TCP backlog',layer:'Ground cover',
  q:[{q:'A SYN flood exhausts…',a:['The half-open connection queue','Disk space on the server','The DNS cache','TLS session tickets'],why:'SYN cookies let the kernel accept without holding state for half-open connections.'}]},
 {id:'k8s',f:'inf',b:0,tier:1,name:'k8s scheduling',layer:'Understory',needs:['tcp'],
  q:[{q:'A pod stays Pending most often because…',a:['No node satisfies its resource requests or affinity rules','The image is too large to pull','Its Service has not been created','Its ConfigMap is empty'],why:'`kubectl describe pod` shows the scheduler events; requests, taints and affinity are the usual culprits.'}]},
 {id:'tls',f:'inf',b:0,tier:1,name:'TLS & certs',layer:'Ground cover',needs:['tcp'],
  q:[{q:'The TLS 1.3 handshake is faster mainly because…',a:['Key exchange and cipher negotiation complete in one round trip','Certificates are no longer sent','It uses RSA key transport','Compression was added'],why:'1-RTT handshake, 0-RTT for resumption; legacy ciphers were removed.'}]},
 {id:'mesh',f:'inf',b:0,tier:2,name:'Service mesh',layer:'Canopy',needs:['k8s','tls'],
  q:[{q:'A sidecar mesh moves retries, mTLS and metrics…',a:['Out of application code into a per-pod proxy','Into the kernel','Into the load balancer only','Into the database'],why:'Cost: an extra hop per call and more moving parts to run.'}]},
 {id:'mvcc',f:'inf',b:1,tier:0,name:'Postgres MVCC',layer:'Shrub',
  q:[{q:'An UPDATE in Postgres…',a:['Writes a new row version; the old one stays until VACUUM','Overwrites the row in place','Takes a table-level lock','Deletes the page and rewrites it'],why:'Readers keep seeing the old version; dead tuples are reclaimed by VACUUM.'}],
  h:[{q:'A long-running transaction hurts mostly because…',a:['VACUUM cannot remove dead tuples that transaction might still see','It burns CPU constantly','It locks every index','It blocks all writers'],why:'Table bloat grows until the old snapshot is released.'}]},
 {id:'pgidx',f:'inf',b:1,tier:1,name:'Indexes & planner',layer:'Shrub',needs:['mvcc'],
  q:[{q:'`EXPLAIN` shows a Seq Scan on an indexed column because…',a:['The planner estimates the index would not be cheaper (small table or low selectivity)','Indexes only work with primary keys','The column type is unsupported','You forgot VACUUM'],why:'Check row estimates with EXPLAIN ANALYZE; stale statistics mislead the planner.'}]},
 {id:'kafka',f:'inf',b:1,tier:1,name:'Kafka internals',layer:'Shrub',needs:['mvcc'],
  q:[{q:'Ordering in Kafka is guaranteed…',a:['Within a partition only','Across the whole topic','Across all topics of a producer','Only with exactly-once enabled'],why:'Pick the partition key to be whatever you need ordered, e.g. an order id.'}]},
 {id:'slo',f:'inf',b:1,tier:2,name:'SLOs & error budgets',layer:'Vine',needs:['kafka','pgidx'],
  q:[{q:'An error budget is…',a:['The allowed unreliability (1 − SLO) you may spend on risk, like deploys','The on-call budget in rupees','The number of bugs allowed per sprint','A Grafana dashboard'],why:'Burn it too fast and you freeze feature work; that is the SRE bargain.'}]},

 {id:'food',f:'kn',b:0,tier:0,name:'Food words',layer:'Herb',
  q:[{q:'ಊಟ (oota) means…',a:['meal','water','house','road'],why:'ಊಟ ಆಯ್ತಾ? (oota aaytaa?) — did you eat?'}],
  h:[{q:"'ನನಗೆ ಹಸಿವಾಗಿದೆ' (nanage hasivaagide) means…",a:['I am hungry','I am tired','I am thirsty','I am late'],why:'ಹಸಿವು = hunger; ನನಗೆ = to me.'}]},
 {id:'water',f:'kn',b:0,tier:0,name:'Water & drink',layer:'Herb',
  q:[{q:'ನೀರು (neeru) means…',a:['water','milk','rice','fire'],why:'ನೀರು ಕೊಡಿ (neeru kodi) — please give water.'}]},
 {id:'num',f:'kn',b:0,tier:0,name:'Numbers 1–10',layer:'Ground cover',
  q:[{q:'ಮೂರು (mooru) is…',a:['three','two','five','ten'],why:'ಒಂದು, ಎರಡು, ಮೂರು — ondu, eradu, mooru.'}]},
 {id:'market',f:'kn',b:0,tier:1,name:'Market phrases',layer:'Understory',needs:['num'],
  q:[{q:"'ಇದು ಎಷ್ಟು?' (idu eshtu?) asks…",a:['How much is this?','Where is this?','What is this?','Who are you?'],why:'ಎಷ್ಟು = how much/many. Useful at every stall.'}]},
 {id:'dirs',f:'kn',b:0,tier:1,name:'Directions',layer:'Herb',needs:['water'],

/* ---------- world objects (rebuilt when land changes) ---------- */
let statics=[],dirtyGround=true;
const gcv=document.createElement('canvas');gcv.width=672;gcv.height=360;const gctx=gcv.getContext('2d');
function buildStatics(){
  statics=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=key(x,y);const tr=terrain(x,y);
    if(tr==='wild'){const kind=wildKind(x,y);
      if(kind==='tree')statics.push({s:x+y,x,y,kind:'forest',d:t=>{const p=iso(x,y);drawTree(p.sx,p.sy,hash(x,y,2));}});
      else if(kind==='bush')statics.push({s:x+y,x,y,kind:'forest',d:t=>{const p=iso(x,y);drawBush(p.sx,p.sy);}});
      else if(kind==='rock')statics.push({s:x+y,x,y,d:t=>{const p=iso(x,y);drawRock(p.sx,p.sy);}});
      else statics.push({s:x+y,x,y,d:t=>{const p=iso(x,y);drawTuft(p.sx,p.sy,x,y);}});}
    else if(tr==='grass'&&inHome(x,y)&&(x===HOME.x0||x===HOME.x1||y===HOME.y0||y===HOME.y1)&&!BLOCKED.has(k)&&hash(x,y,1)>0.55)statics.push({s:x+y,x,y,d:t=>{const p=iso(x,y);drawBush(p.sx,p.sy);}});
  }
  statics.push({s:BARN.x+BARN.y+1.5,d:drawBarn,hit:(ix,iy)=>{const p=iso(BARN.x,BARN.y);return ix>=p.sx-32&&ix<=p.sx+32&&iy>=p.sy-30&&iy<=p.sy+32;},kind:'barn'});
  statics.push({s:WELL.x+WELL.y,d:drawWell,hit:(ix,iy)=>{const p=iso(WELL.x,WELL.y);return Math.abs(ix-p.sx)<=8&&iy>=p.sy-4&&iy<=p.sy+14;},kind:'well'});
  statics.push({s:COMPOST.x+COMPOST.y,d:drawCompost,hit:(ix,iy)=>{const p=iso(COMPOST.x,COMPOST.y);return Math.abs(ix-p.sx)<=8&&iy>=p.sy+2&&iy<=p.sy+14;},kind:'compost'});
  statics.push({s:SIGN.x+SIGN.y,d:drawSign,hit:(ix,iy)=>{const p=iso(SIGN.x,SIGN.y);return Math.abs(ix-p.sx)<=8&&iy>=p.sy-4&&iy<=p.sy+14;},kind:'sign'});
  // fences: one segment per field edge that borders a different field or open land
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=fieldOf(x,y);if(!f)continue;
    const edges=[[x,y-1,'TR',-0.5],[x-1,y,'TL',-0.5],[x+1,y,'RB',0.5],[x,y+1,'LB',0.5]];
    for(const [nx,ny,e,ds] of edges){if(fieldOf(nx,ny)===f)continue;
      statics.push({s:x+y+ds,d:()=>{const p=iso(x,y);const V={T:[p.sx,p.sy],R:[p.sx+16,p.sy+8],B:[p.sx,p.sy+16],L:[p.sx-16,p.sy+8]};const a=V[e[0]],b=V[e[1]];
        rail(a[0],a[1]-5,b[0],b[1]-5,'#A26A40');rail(a[0],a[1]-2,b[0],b[1]-2,'#A26A40');
        for(const v of [a,b]){px(v[0]-1,v[1]-6,2,7,'#8E5A34');px(v[0]-1,v[1]-6,2,1,'#B8804A');}}});}
  }

function buildGround(){
  g=gctx;g.clearRect(0,0,gcv.width,gcv.height);const ox=336,oy=8;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const sx=(x-y)*16+ox,sy=(x+y)*8+oy;const tr=terrain(x,y);
    if(tr==='soil'){diamond(sx,sy,'#7A5230');for(const r of [3,6,9,12]){const hw=r<8?(r+1)*2:(TH-r)*2;for(let k=-hw+3;k<hw-2;k+=3)px(sx+k,sy+r,1,1,'#5E3C22');}}
    else if(tr==='path'){diamond(sx,sy,'#C9A86A');for(let i=0;i<3;i++){const r=3+Math.floor(hash(x,y,i)*9),hw=r<8?(r+1)*2:(TH-r)*2;px(sx-hw+2+Math.floor(hash(x,y,i+3)*(hw*2-4)),sy+r,1,1,'#A98850');}}
    else if(tr==='wild'){diamond(sx,sy,'#4F8F3C');for(let i=0;i<4;i++){const r=2+Math.floor(hash(x,y,i)*11),hw=r<8?(r+1)*2:(TH-r)*2;px(sx-hw+1+Math.floor(hash(x,y,i+5)*(hw*2-2)),sy+r,1,1,hash(x,y,i+9)>0.5?'#3F7A30':'#62A84A');}}
    else{diamond(sx,sy,'#6DB24F');for(let i=0;i<4;i++){const r=2+Math.floor(hash(x,y,i)*11),hw=r<8?(r+1)*2:(TH-r)*2;px(sx-hw+1+Math.floor(hash(x,y,i+5)*(hw*2-2)),sy+r,1,1,hash(x,y,i+9)>0.5?'#5A9A3E':'#83C464');}drawFlowers(sx,sy,x,y);}
  }
  for(let x=0;x<N;x++){const sx=(x-(N-1))*16+ox,sy=(x+N-1)*8+oy;for(let t2=0;t2<16;t2++){px(sx-16+t2,sy+8+Math.floor(t2/2)+1,1,10,'#6A4A2C');px(sx-16+t2,sy+8+Math.floor(t2/2)+9,1,3,'#4E361F');}}
  for(let y=0;y<N;y++){const sx=((N-1)-y)*16+ox,sy=(N-1+y)*8+oy;for(let t2=0;t2<16;t2++){px(sx+t2,sy+16-Math.ceil(t2/2)+1,1,10,'#5C3F24');px(sx+t2,sy+16-Math.ceil(t2/2)+9,1,3,'#43301C');}}
  g=ctx;dirtyGround=false;
}
buildStatics();

/* ---------- clouds ---------- */
const clouds=[{x:40,y:22,w:[10,18,24,22,14],v:.035},{x:260,y:12,w:[8,14,20,18,10],v:.025},{x:400,y:34,w:[12,20,26,22,12],v:.03}];

/* ---------- render ---------- */
let hover=null;
function frame(t){
  if(dirtyGround)buildGround();
  g=ctx;ctx.fillStyle='#8FC8E8';ctx.fillRect(0,0,W,H);ctx.fillStyle='#A4D6F0';ctx.fillRect(0,170,W,130);
  px(438,24,12,12,'#FFE27A');px(440,22,8,16,'#FFE27A');px(436,26,16,8,'#FFE27A');px(441,25,6,6,'#FFF3B8');
  for(const c of clouds){c.x+=c.v;if(c.x>W+40)c.x=-40;blob(Math.round(c.x),c.y,c.w,['#E6F2FA','#FFFFFF','#FFFFFF','#FFFFFF','#FFFFFF']);}
  ctx.drawImage(gcv,Math.round(S.cam.x-336),Math.round(S.cam.y-8));
  if(hover){const {sx,sy}=iso(hover.x,hover.y);ctx.fillStyle='rgba(255,255,255,.28)';for(let r=0;r<TH;r++){const hw=r<8?(r+1)*2:(TH-r)*2;ctx.fillRect(sx-hw,sy+r,hw*2,1);}}
  const f=S.farmer;const dx=f.tx-f.x,dy=f.ty-f.y;const dist=Math.hypot(dx,dy);const walking=dist>0.02;
  if(walking){const sp=Math.min(0.07,dist);f.x+=dx/dist*sp;f.y+=dy/dist*sp;}
  const list=statics.slice();
  for(const c of S.crops){list.push({s:c.x+c.y,d:()=>{const p=iso(c.x,c.y);drawCrop(c,p.sx,p.sy,t);drawMarker(c,p.sx,p.sy,t);}});}
  list.push({s:f.x+f.y+0.01,d:()=>{const p=iso(f.x,f.y);drawFarmer(Math.round(p.sx),Math.round(p.sy+13),walking,t);}});
  list.sort((a,b)=>a.s-b.s);for(const o of list)o.d(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- HUD & sheets ---------- */
function hud(){$('hDay').textContent=S.day;$('hEnergyT').textContent=S.energy;$('hEnergy').style.width=(100*S.energy/S.energyMax)+'%';$('hCoins').textContent=S.coins;$('hBarrel').textContent=S.barrel;save();}
let toastT;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800);}
function hint(h){$('hint').innerHTML=h;}
const veil=$('veil'),sheet=$('sheet');
function open(html){sheet.innerHTML=html;veil.hidden=false;const b=sheet.querySelector('button.pri')||sheet.querySelector('button');if(b)b.focus();}
function close(){veil.hidden=true;}
veil.addEventListener('click',e=>{if(e.target===veil)close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!veil.hidden)close();});
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const foot=(label,extra)=>'<div class="foot">'+(extra||'<span></span>')+'<button type="button" class="pri" data-act="close">'+(label||'Close')+'</button></div>';

/* ---------- input: drag to pan, tap to act ---------- */
let down=null,dragging=false;
function toInternal(e){const r=cv.getBoundingClientRect();return {ix:(e.clientX-r.left)*W/r.width,iy:(e.clientY-r.top)*H/r.height,k:W/r.width};}
function tileAt(ix,iy){const dx=ix-S.cam.x,dy=iy-S.cam.y;const x=Math.floor((dx/16+dy/8)/2),y=Math.floor((dy/8-dx/16)/2);return (x>=0&&y>=0&&x<N&&y<N)?{x,y}:null;}
function pick(ix,iy){
  let best=null;
  for(const c of S.crops){const {sx,sy}=iso(c.x,c.y);if(Math.abs(ix-sx)<=7&&iy>=sy-16&&iy<=sy+14&&(!best||c.x+c.y>best.s))best={s:c.x+c.y,kind:'crop',crop:c};}
  if(best)return best;
  for(const o of statics)if(o.hit&&o.hit(ix,iy))return {kind:o.kind};
  const t=tileAt(ix,iy);return t?{kind:'tile',x:t.x,y:t.y}:null;
}
function clampCam(){S.cam.x=Math.max(-80,Math.min(560,S.cam.x));S.cam.y=Math.max(-220,Math.min(260,S.cam.y));}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=toInternal(e);down={x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y,k:p.k};dragging=false;});
cv.addEventListener('pointermove',e=>{const p=toInternal(e);
  if(down){const dx=(e.clientX-down.x)*down.k,dy=(e.clientY-down.y)*down.k;if(!dragging&&Math.hypot(dx,dy)>5){dragging=true;cv.classList.add('drag');}
    if(dragging){S.cam.x=down.cx+dx;S.cam.y=down.cy+dy;clampCam();}}
  hover=(e.pointerType==='mouse'&&!dragging)?tileAt(p.ix,p.iy):null;});
cv.addEventListener('pointerup',e=>{if(!down)return;const wasDrag=dragging;down=null;dragging=false;cv.classList.remove('drag');if(wasDrag){save();return;}
  const {ix,iy}=toInternal(e);const p=pick(ix,iy);if(!p)return;
  if(p.kind==='crop'){walkTo(p.crop.x,p.crop.y);onCrop(p.crop);}
  else if(p.kind==='barn'){walkTo(9,6);openBag();}
  else if(p.kind==='well'){walkTo(14,9);openWell();}
  else if(p.kind==='compost'){walkTo(14,10);openCompost();}
  else if(p.kind==='sign'){walkTo(9,8);openAlmanac();}
  else if(p.kind==='tile'){onTile(p.x,p.y);}
});
cv.addEventListener('pointercancel',()=>{down=null;dragging=false;cv.classList.remove('drag');});
cv.addEventListener('pointerleave',()=>{hover=null;});
function walkTo(x,y){S.farmer.tx=x;S.farmer.ty=y;}
$('bHome').addEventListener('click',()=>{S.cam={x:240,y:-18};save();});

/* ---------- actions ---------- */
function onCrop(c){const tp=T[c.id];
  if(c.wilted||thirsty(c)){if(S.energy<6)return toast('Out of energy. Sleep to start a new day.');return ask(tp,c,'water');}
  if(ripe(c)){if(S.energy<15)return toast('Harvest takes 15 energy. Sleep first.');return ask(tp,c,'harvest');}
  if(c.per)return toast(tp.name+' is rooted (perennial). Next check-in on day '+due(c)+'.');
  toast(tp.name+' · stage '+(c.stage+1)+'/5 · '+zone(c)+' · thirsty again on day '+due(c)+'.');
}
function neighbourField(x,y){for(const [nx,ny] of [[x,y-1],[x-1,y],[x+1,y],[x,y+1]]){const f=fieldOf(nx,ny);if(f)return f;}return null;}
function onTile(x,y){const tr=terrain(x,y);const k=key(x,y);
  if(tr==='soil'){if(cropAt(x,y))return;walkTo(x,y);
    if(!S.seedSel)return toast('Empty soil. Pick a seed from the barn (or Seed bag) first.');
    const tp=T[S.seedSel];const fk=fieldOf(x,y);
    if(tp.f!==fk)return toast(tp.name+' belongs in the '+FIELDS[tp.f].name+' field.');
    if(S.energy<10||S.coins<10)return toast('Planting needs 10 energy and 10 coins.');
    S.energy-=10;S.coins-=10;S.crops.push({id:tp.id,x,y,stage:0,lw:S.day,wilted:false,per:false});S.seedSel=null;
    hint('Planted <b>'+esc(tp.name)+'</b>. It will be thirsty tomorrow. Tap it then and answer to make it grow.');hud();toast('Planted '+tp.name+'.');return;}
  if(tr==='path'||BLOCKED.has(k))return;
  const nf=neighbourField(x,y);
  if(nf){walkTo(x,y);const F=FIELDS[nf];const cost=tr==='wild'?40:25;
    open('<div><span class="chip" style="--c:'+F.color+'">'+esc(F.name)+'</span></div><h2>'+(tr==='wild'?'Clear and fence':'Fence it in')+'</h2><p>'+(tr==='wild'?'Fell the trees and ':'')+'Add this tile to the '+esc(F.name)+' field. Fields grow one tile at a time, in any shape.</p><p class="sub">Costs '+cost+' coins. You have '+S.coins+'.</p>'+
      foot('Add to '+F.name+' · '+cost+' coins','<button type="button" data-act="close">Not now</button>'));
    sheet.querySelector('button.pri').dataset.act='expand';sheet.querySelector('button.pri').dataset.arg=k+'|'+nf+'|'+cost;return;}
  if(tr==='wild'){const kind=wildKind(x,y);if(kind==='tree'||kind==='bush')return openForage(x,y);return toast('Wilderness. Forage in the trees, or fence in land next to a field.');}
  toast('Open ground. Land next to a field can be fenced in.');
}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
let QC=null;
function ask(tp,c,mode){const F=FIELDS[tp.f];
  const bank=(mode!=='water'&&tp.h)?tp.h:tp.q;const Q=bank[Math.floor(Math.random()*bank.length)];
  const opts=shuffle(Q.a.map((txt,i)=>({txt,ok:i===0})));
  const title=mode==='harvest'?'Harvest':mode==='testout'?'Jump the fence':(c&&c.wilted?'Revive':'Water');
  const cost=mode==='harvest'?15:mode==='testout'?10:6;QC={tp,c,mode,opts,Q,cost};
  const sub=mode==='testout'?'Prove you already know it. A clean answer unlocks the seed without its prerequisites.':(esc(tp.layer)+' layer · '+(c?zone(c):'')+' · '+cost+' energy'+(mode==='harvest'?' · premium grade makes it perennial':''));
  open('<div><span class="chip" style="--c:'+F.color+'">'+esc(F.name)+'</span></div><h2>'+title+' · '+esc(tp.name)+'</h2><p class="sub">'+sub+'</p><p class="q">'+esc(Q.q)+'</p><div class="opts" id="opts">'+opts.map((o,i)=>'<button type="button" data-act="opt" data-arg="'+i+'">'+esc(o.txt)+'</button>').join('')+'</div>');
}
function answer(i){if(!QC)return;const {tp,c,mode,opts,Q,cost}=QC;const ok=opts[i].ok;QC=null;
  [...$('opts').children].forEach((el,j)=>{el.disabled=true;if(opts[j].ok)el.classList.add('ok');else if(j===i)el.classList.add('bad');});
  S.energy-=cost;let msg;
  if(mode==='testout'){if(ok){S.unlocked.push(tp.id);msg='<b>Over the fence.</b> '+esc(tp.name)+' is unlocked. Plant it from the seed bag.';}else msg='<b>Not yet.</b> '+esc(tp.name)+' stays locked. Root its prerequisites, or try again tomorrow.';}
  else if(mode==='harvest'){if(ok){S.coins+=30;c.per=true;c.lw=S.day;msg='<b>Premium grade.</b> +30 coins. '+esc(tp.name)+' is now a perennial: rooted, it only needs a check-in every 10 days. Seeds that needed it are now unlocked.';}
    else{c.stage=2;c.lw=S.day;if(!S.compost.includes(c.id))S.compost.push(c.id);msg='<b>Seconds.</b> Composted. '+esc(tp.name)+' drops back to stage 3 and goes in the review heap.';}}
  else{if(ok){c.wilted=false;c.stage=Math.min(4,c.stage+1);c.lw=S.day;S.compost=S.compost.filter(x=>x!==c.id);msg='<b>Watered.</b> '+esc(tp.name)+' grows to stage '+(c.stage+1)+'/5. Next watering on day '+due(c)+' ('+zone(c)+').';}
    else{c.wilted=true;c.stage=Math.max(0,c.stage-1);c.lw=S.day;if(!S.compost.includes(c.id))S.compost.push(c.id);msg='<b>Wilted.</b> '+esc(tp.name)+' drops a stage and goes in the compost heap. Revive it tomorrow.';}}
  hud();const r=document.createElement('div');r.className='res';r.innerHTML=msg+'<br><span class="sub">'+esc(Q.why)+'</span>';$('opts').after(r);
  const f=document.createElement('div');f.innerHTML=foot('Back to the farm');r.after(f.firstChild);sheet.querySelector('button.pri').focus();
}
function expand(arg){const [k,f,cost]=arg.split('|');const c=+cost;if(S.coins<c)return toast('Not enough coins. Harvest something first.');
  S.coins-=c;S.cleared[k]=f;buildStatics();hud();close();toast('Fenced in. The '+FIELDS[f].name+' field grew.');}

function openBag(){const planted=new Set(S.crops.map(c=>c.id));const rooted=rootedIds();
  let html='<h2>Seed bag</h2><p class="sub">Each seed is a topic. Plant it in its own field, water it by answering, harvest it to make it perennial. 10 energy + 10 coins to plant.</p>';
  for(const k in FIELDS){const F=FIELDS[k];const focus=S.focus[k];html+='<div class="fh"><i style="background:'+F.color+'"></i>'+esc(F.name)+(focus!=null?' <span class="sub">· focus: '+esc(F.branches[focus])+'</span>':'')+'</div><div>';
    const list=TOPICS.filter(t=>t.f===k&&visible(t)).sort((a,b)=>((b.b===focus)-(a.b===focus))||a.tier-b.tier);
    for(const tp of list){const locked=!available(tp);
      if(planted.has(tp.id))html+='<div class="row"><div class="n">'+esc(tp.name)+'<small>'+esc(tp.layer)+' · in the ground</small></div><span class="sub">'+(rooted.has(tp.id)?'rooted':'growing')+'</span></div>';
      else if(locked)html+='<div class="row locked"><div class="n">'+esc(tp.name)+'<small>'+esc(tp.layer)+' · locked</small></div><span class="sub">needs '+esc((tp.needs||[]).map(n=>T[n].name).join(' + '))+'</span></div>';
      else html+='<div class="row"><div class="n">'+esc(tp.name)+'<small>'+esc(tp.layer)+(tp.b===focus?' · focus':'')+'</small></div><button type="button" data-act="seed" data-arg="'+tp.id+'"'+(S.seedSel===tp.id?' class="pri"':'')+'>'+(S.seedSel===tp.id?'Selected':'Select')+'</button></div>';}
    html+='</div>';}
  html+='<h3>Your farm</h3><p class="sub">Saved in this browser only. Export it before clearing site data or moving machines.</p><div class="branches"><button type="button" data-act="export">Export farm</button><button type="button" data-act="import">Import farm</button></div>';
  html+=foot('Close','<button type="button" class="link" data-act="reset">Reset farm</button>');open(html);
}
function exportFarm(){const data=JSON.stringify(S);const name='permaculture-farm-day'+S.day+'.json';
  try{const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){}
  open('<h2>Export farm</h2><p class="sub">A file named <b>'+esc(name)+'</b> should have downloaded. If not, copy this and keep it somewhere safe.</p><label for="exp" class="sub">Farm data</label><textarea id="exp" readonly>'+esc(data)+'</textarea>'+foot('Close','<button type="button" data-act="copyExp">Copy</button>'));}
function importFarm(){open('<h2>Import farm</h2><p class="sub">Choose an exported file, or paste its contents. This replaces the farm in this browser.</p><input type="file" id="impFile" accept="application/json,.json"><label for="imp" class="sub">Or paste here</label><textarea id="imp"></textarea>'+foot('Import','<button type="button" data-act="close">Cancel</button>'));
  sheet.querySelector('button.pri').dataset.act='doImport';
  $('impFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(t=>{$('imp').value=t;});});}

  if(!obj||obj.v!==2||!Array.isArray(obj.crops)||!obj.farmer)return toast('That file is not a Permaculture farm (format v2).');
  S=obj;if(!S.cam)S.cam={x:240,y:-18};buildStatics();hud();close();toast('Farm imported. Day '+S.day+'.');}
function openWell(){open('<h2>Rain barrel</h2><p>'+S.barrel+' of 5 days stored.</p><p class="sub">Catch and store energy. End a day with 30+ energy left and the barrel fills by one. When a crop is about to wilt, the barrel spends a day to keep it alive. It never grows a crop; only you do.</p>'+foot());}
function openCompost(){const items=S.compost.map(id=>T[id]).filter(Boolean);
  open('<h2>Compost heap</h2><p class="sub">Produce no waste. A failed answer is not lost; it is the next thing to review.</p><div>'+(items.length?items.map(tp=>'<div class="row"><div class="n">'+esc(tp.name)+'<small>'+esc(FIELDS[tp.f].name)+' · tap the crop to revive it</small></div></div>').join(''):'<p>Empty. Nothing failed recently.</p>')+'</div>'+foot());}

function openForage(x,y){const growing=new Set(S.crops.filter(c=>!c.per).map(c=>c.id));const planted=new Set(S.crops.map(c=>c.id));
  let cands=FINDS.filter(f=>f.for.some(id=>growing.has(id))&&!S.foraged.includes(f.id));
  if(!cands.length)cands=FINDS.filter(f=>f.for.some(id=>planted.has(id))&&!S.foraged.includes(f.id));
  if(!cands.length)cands=FINDS.filter(f=>!S.foraged.includes(f.id));
  if(!cands.length)return toast('The forest is quiet today. Plant something new and come back.');
  const fd=cands[Math.floor(hash(x,y,S.day)*cands.length)];const link=fd.for.map(id=>T[id].name).join(', ');
  open('<div><span class="chip" style="--c:#4F8F3C">Zone 5 · wilderness</span></div><h2>Wild find</h2><p class="sub">Observe and interact. Nothing here counts toward readiness; it widens the edge of what you are growing. Related to: '+esc(link)+'.</p><div class="find">'+esc(fd.text)+'</div>'+
    foot('Forage · 5 energy','<button type="button" data-act="close">Leave it</button>'));
  const b=sheet.querySelector('button.pri');b.dataset.act='forage';b.dataset.arg=fd.id;}
function forage(id){const fd=FM[id];if(S.energy<5)return toast('Out of energy. Sleep first.');S.energy-=5;S.coins+=3;S.foraged.push(id);hud();
  let html='<h2>Foraged</h2><p>+3 coins. Noted in your field journal.</p>';
  if(fd.seed&&!S.volunteers.includes(fd.seed)){const tp=T[fd.seed];html+='<p>This one could be domesticated: <b>'+esc(tp.name)+'</b> would become a volunteer seed in the '+esc(FIELDS[tp.f].name)+' field (needs '+esc((tp.needs||[]).map(n=>T[n].name).join(' + '))+').</p>'+foot('Domesticate '+tp.name,'<button type="button" data-act="close">Leave it wild</button>');open(html);const b=sheet.querySelector('button.pri');b.dataset.act='domesticate';b.dataset.arg=fd.seed;}
  else{open(html+foot('Back to the farm'));}}
function domesticate(id){S.volunteers.push(id);save();close();toast(T[id].name+' added to your seed bag as a volunteer.');}

/* ---------- learning tree ---------- */
let treeField='hs';
function splitName(n){if(n.length<=13)return [n];const i=n.lastIndexOf(' ',Math.ceil(n.length/2)+2);return i>0?[n.slice(0,i),n.slice(i+1)]:[n];}
function treeSvg(k){const F=FIELDS[k];const rooted=rootedIds();const planted=new Set(S.crops.map(c=>c.id));
  const nodes=TOPICS.filter(t=>t.f===k&&visible(t));const colW=240,W2=480;const tiers=Math.max(...nodes.map(n=>n.tier))+1;const Hh=46+tiers*72;
  const pos={};for(let b=0;b<2;b++)for(let t=0;t<tiers;t++){const row=nodes.filter(n=>n.b===b&&n.tier===t);row.forEach((n,i)=>{pos[n.id]={x:b*colW+(i+0.5)*colW/row.length,y:46+t*72};});}
  let s='<svg class="tree" width="'+W2+'" height="'+Hh+'" viewBox="0 0 '+W2+' '+Hh+'" style="aspect-ratio:'+W2+'/'+Hh+';flex:none" role="img" aria-label="Learning tree for '+esc(F.name)+'">';
  s+='<text x="'+(colW/2)+'" y="22" text-anchor="middle" fill="#C6B48E" font-size="12" font-family="DM Sans,system-ui">'+esc(F.branches[0])+(S.focus[k]===0?' · focus':'')+'</text><text x="'+(colW*1.5)+'" y="22" text-anchor="middle" fill="#C6B48E" font-size="12" font-family="DM Sans,system-ui">'+esc(F.branches[1])+(S.focus[k]===1?' · focus':'')+'</text><line x1="'+colW+'" y1="8" x2="'+colW+'" y2="'+(Hh-8)+'" stroke="#3B3020" stroke-dasharray="3 4"/>';
  for(const n of nodes)for(const need of (n.needs||[])){const a=pos[need],b=pos[n.id];if(!a||!b)continue;const ok=rooted.has(need);s+='<path d="M'+a.x+' '+(a.y+18)+' C '+a.x+' '+(a.y+48)+', '+b.x+' '+(b.y-48)+', '+b.x+' '+(b.y-18)+'" fill="none" stroke="'+(ok?F.color:'#5C4A2E')+'" stroke-width="2"'+(ok?'':' stroke-dasharray="4 4"')+'/>';}
  for(const n of nodes){const p=pos[n.id];const st=rooted.has(n.id)?'rooted':planted.has(n.id)?'growing':available(n)?'ready':'locked';
    const fill=st==='rooted'?F.color:'#3B3020',stroke=st==='rooted'?F.color:st==='growing'?F.color:st==='ready'?'#F4EAD0':'#5C4A2E',tc=st==='rooted'?'#10200C':st==='locked'?'#8F7F60':'#F4EAD0';
    s+='<rect x="'+(p.x-50)+'" y="'+(p.y-18)+'" width="100" height="36" rx="6" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"'+(st==='locked'?' stroke-dasharray="4 3"':'')+'/>';
    const ls=splitName(n.name);ls.forEach((l,i)=>{s+='<text x="'+p.x+'" y="'+(p.y+(ls.length===1?4:(i===0?-1:11)))+'" text-anchor="middle" fill="'+tc+'" font-size="10.5" font-weight="600" font-family="DM Sans,system-ui">'+esc(l)+'</text>';});
    if(st==='growing'){const c=S.crops.find(c=>c.id===n.id);s+='<rect x="'+(p.x-50)+'" y="'+(p.y+14)+'" width="'+(100*(c.stage+1)/5)+'" height="4" rx="2" fill="'+F.color+'"/>';}
    if(n.wild)s+='<circle cx="'+(p.x+44)+'" cy="'+(p.y-12)+'" r="4" fill="#4F8F3C"/>';}
  return s+'</svg>';}
function openTree(){const k=treeField;const F=FIELDS[k];const locked=TOPICS.filter(t=>t.f===k&&visible(t)&&!available(t)&&!S.crops.some(c=>c.id===t.id));
  let html='<h2>Learning tree</h2><p class="sub">Everything you could grow, including what you cannot reach yet. A seed unlocks when the seeds it needs are <b>rooted</b> (harvested to perennial). Pick a branch to focus; the seed bag puts it first.</p>';
  html+='<div class="tabs">'+Object.keys(FIELDS).map(f=>'<button type="button" data-act="treeTab" data-arg="'+f+'"'+(f===k?' class="on"':'')+'><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+FIELDS[f].color+';margin-right:6px;vertical-align:-1px"></span>'+esc(FIELDS[f].name)+'</button>').join('')+'</div>';
  html+=treeSvg(k);
  html+='<div class="branches">'+F.branches.map((b,i)=>'<button type="button" data-act="focus" data-arg="'+k+'|'+i+'"'+(S.focus[k]===i?' class="pri"':'')+'>'+(S.focus[k]===i?'Focus: ':'Focus on ')+esc(b)+'</button>').join('')+'</div>';
  html+='<p class="sub">Solid box: rooted · outline: growing (bar = stage) · cream outline: ready to plant · dashed: locked · green dot: found in the wild.</p>';
  if(locked.length){html+='<h3>Jump the fence</h3><p class="sub">Already know one of these? Prove it on a harvest-grade question (10 energy) and it unlocks without its prerequisites.</p><div>'+locked.map(t=>'<div class="row"><div class="n">'+esc(t.name)+'<small>needs '+esc((t.needs||[]).map(n=>T[n].name).join(' + '))+'</small></div><button type="button" data-act="testout" data-arg="'+t.id+'">Test out</button></div>').join('')+'</div>';}
  html+=foot();open(html);}

/* ---------- almanac ---------- */
function openAlmanac(){open('<h2>Almanac</h2><p class="sub">The rules of this farm, as they stand today. Everything here is in the game right now.</p>'+
 '<h3>The loop</h3><ul><li><b>Seeds are topics.</b> Plant one in its field: 10 energy, 10 coins. It sprouts at stage 1 of 5.</li><li><b>Water = answer.</b> A thirsty crop shows a droplet. Tap it and answer one question (6 energy). Right: it grows a stage. Wrong: it wilts, drops a stage, and goes in the compost heap.</li><li><b>Harvest = prove it.</b> A stage-5 crop sparkles. Answer a harder question (15 energy). Premium: +30 coins and the crop becomes a <b>perennial tree</b>, rooted for good. Seconds: composted, back to stage 3.</li></ul>'+
 '<h3>Thirst and zones</h3><ul><li>After watering, a crop is thirsty again after 1, 2, 3, 4 or 5 days depending on its stage (Z1 daily, out to Z4). Perennials ask for a check-in every 10 days.</li><li>Two days past thirsty without water: it wilts overnight, unless the rain barrel saves it.</li><li>This is spaced repetition. The map is your retention: inner zones should be small, outer zones full.</li></ul>'+
 '<h3>Energy and the rain barrel</h3><ul><li>90 energy a day. Sleep restores it.</li><li>End a day with 30+ energy left and the barrel stores one day (max 5). It spends a day automatically to stop a crop from wilting.</li></ul>'+
 '<h3>Land</h3><ul><li>Drag to pan. The homestead has four fields; everything beyond is wilderness.</li><li>Tap land next to a field to fence it in: 25 coins for open ground, 40 to clear forest. Fields grow one tile at a time, any shape.</li></ul>'+
 '<h3>Wilderness (Zone 5)</h3><ul><li>Tap trees to forage a <b>wild find</b>: a fact next to what you are growing. 5 energy, +3 coins, no readiness credit.</li><li>Some finds can be <b>domesticated</b> into volunteer seeds that appear in your seed bag.</li></ul>'+
 '<h3>Learning tree</h3><ul><li>Every seed, including locked ones, is on the tree. A seed unlocks when what it needs is rooted.</li><li>Pick a branch to focus; the seed bag puts it first. Or jump the fence: pass a harvest-grade question to unlock a seed early.</li></ul>'+
 '<h3>Buildings</h3><ul><li><b>Barn</b>: seed bag. <b>Well</b>: rain barrel. <b>Compost heap</b>: what to review. <b>Signpost</b>: this almanac.</li></ul>'+
 '<h3>Not here yet</h3><p class="sub">Guilds, layers as terraces, real weather from Coorg, the rival farm, the Sunday walk, the market, the workshop, judged write-ups and timed solves, your own notes on each crop, pack import, the village.</p>'+foot());}

/* ---------- sleep ---------- */
function sleep(){const night=$('night');night.style.opacity=1;$('bSleep').disabled=true;
  setTimeout(()=>{const before=S.energy;S.day+=1;const saved=[],wiltedNow=[],thirstyNow=[];
    for(const c of S.crops){if(c.wilted||c.per)continue;
      if(S.day>due(c)+1){if(S.barrel>0){S.barrel--;c.lw=S.day-interval(c);saved.push(T[c.id].name);}else{c.wilted=true;if(!S.compost.includes(c.id))S.compost.push(c.id);wiltedNow.push(T[c.id].name);}}}
    for(const c of S.crops)if(thirsty(c))thirstyNow.push(T[c.id].name);
    let barrelUp=false;if(before>=30&&S.barrel<5){S.barrel++;barrelUp=true;}
    S.energy=S.energyMax;hud();
    setTimeout(()=>{night.style.opacity=0;$('bSleep').disabled=false;
      open('<h2>Day '+S.day+'</h2><p>Energy restored to '+S.energyMax+'.'+(barrelUp?' Rain barrel +1 (you ended the day with energy to spare).':'')+'</p>'+
        (thirstyNow.length?'<p><b>Thirsty:</b> '+esc(thirstyNow.join(', '))+'.</p>':'<p>Nothing is thirsty. Plant something, or forage.</p>')+
        (saved.length?'<p><b>Rain barrel saved:</b> '+esc(saved.join(', '))+'.</p>':'')+
        (wiltedNow.length?'<p><b>Wilted overnight:</b> '+esc(wiltedNow.join(', '))+'. Revive them today.</p>':'')+
        '<p class="sub">New wild finds have grown in the forest.</p>'+foot('Start the day'));},700);
  },750);
}

/* ---------- one delegated handler for every sheet ---------- */
sheet.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const act=b.dataset.act,arg=b.dataset.arg;
  if(act==='close')close();
  else if(act==='opt')answer(+arg);
  else if(act==='seed'){S.seedSel=arg;const tp=T[arg];hint('Seed in hand: <b>'+esc(tp.name)+'</b>. Tap an empty soil tile in the <b>'+esc(FIELDS[tp.f].name)+'</b> field to plant it.');save();close();}
  else if(act==='reset'){S=initialState();buildStatics();hud();close();toast('Farm reset to day 12.');}
  else if(act==='export')exportFarm();
  else if(act==='import')importFarm();
  else if(act==='doImport')doImport();
  else if(act==='copyExp'){const t=$('exp');const done=()=>toast('Copied.');const fail=()=>{t.focus();t.select();toast('Select all and copy.');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,fail);else fail();}
  else if(act==='expand')expand(arg);
  else if(act==='forage')forage(arg);
  else if(act==='domesticate')domesticate(arg);
  else if(act==='treeTab'){treeField=arg;openTree();}
  else if(act==='focus'){const [k,i]=arg.split('|');S.focus[k]=S.focus[k]===+i?null:+i;save();openTree();}
  else if(act==='testout'){const tp=T[arg];if(S.energy<10)return toast('Needs 10 energy. Sleep first.');ask(tp,null,'testout');}
});
$('bBag').addEventListener('click',openBag);
$('bTree').addEventListener('click',openTree);
$('bAlm').addEventListener('click',openAlmanac);
$('bSleep').addEventListener('click',sleep);
hud();
})();
</script>
</body>
</html>
